proof_route: Keep the exact logarithmic constant a. Elementary logarithm bounds prove a >= 47/54, so (6/5)*a
  exceeds 1.03883. For x >= 1 the correction (3 log x + 5)(log x + 1) is nonnegative. Combine
  the supplied equation (3.35) with theta_le_psi. The paper cites Landau, volume 1, pp. 90-91; the port follows
  the completed PNT+ argument.

