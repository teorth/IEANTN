      Ioo 0 1 for exactly this reason. Whoever consumes (b) at x = 1 has to close that gap.
      THE PAPER'S ARCSINH INTEGRAL TURNED OUT TO BE AVOIDABLE. It evaluates
      int_0^{1/2} sqrt(1/4 + r^2) dr = (sqrt 2 + arcsinh 1)/8 to get M = 1.80294; the crude sup
