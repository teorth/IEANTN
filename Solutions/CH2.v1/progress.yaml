      The route through (c) is worth recording because the paper's is not the shortest.
      A(z) = -(1-z) f(z) with f(z) = 1/(pi z) - cot(pi z), whose Taylor coefficients are
      (2/pi) zeta(2n+2) -- the imported CotangentSeries.v1. Multiplying by (1 - z^2) telescopes the
      series into h(z) = (2/pi) sum a_n z^{2n+3} with a_n = zeta(2n+2) - zeta(2n+4) >= 0, and
      non-negative coefficients give |h(z)| <= h(||z||) and the same for h'. That turns the
      two-dimensional maximum of |A'| over [0,1/2] x [-1/2,1/2] into an evaluation at 1/sqrt 2.
      THE NUMERIC STEP IS TIGHT -- the true constant is 1.7796360636 against 1.78, a margin of
      3.6e-4 -- and the closed forms are useless for it, since nothing in Mathlib evaluates
      cot(pi/sqrt 2). SUMMATION BY PARTS IS WHAT MAKES IT CHEAP. With v_n = zeta(2n+2) - 1 and W_n
      the weight, sum a_n W_n = v_0 W_0 + sum v_{n+1}(W_{n+1} - W_n), and W is decreasing while
      v >= 0, so every term after the first is negative: truncating is already an upper bound, no
      tail has to be estimated, and each retained term needs only a LOWER bound on some
      zeta(2k) - 1, which a handful of Dirichlet terms supplies. No Bernoulli numbers, no closed
      forms for zeta(6), zeta(8), zeta(10). Five terms plus pi_gt_d6 / pi_lt_d6 close it with 0.001
      to spare.
      The second half of (c), |A(x)| <= (pi/3) x, does not follow the paper either: instead of
      A'(0) = -pi/3 and monotonicity of A', it is the series bound
      (1-x) sum zeta(2n+2) x^{2n} <= zeta(2), peeling off n = 0 and comparing the rest with a
      geometric series. That proves it on all of (0,1), not just [0,1/2].
      SECTION 7'S TWO OPENING ESTIMATES ARE ALSO DONE: coth y <= 1 + 1/y (for lem:trivialzer) and
      1/y <= coth y <= 1/y + y/3 (used at source line 3351). The second is proved WITHOUT Euler's
      hyperbolic expansion -- clearing denominators leaves sinh y <= y cosh y and
      3y cosh y <= (3+y^2) sinh y, one differentiation each.
      LEM:COTHDER IS DONE, AND DID NOT NEED PHRAGMEN-LINDELOF. The paper proves |(z coth z)'| <= |z| on
      |Im z| <= pi/2 by Phragmen-Lindelof plus two boundary computations, one of which needs
      2x csch x - 2 sech x - cosh x <= 0. There is an elementary route through the series instead.
      From the partial fractions, z coth z = 1 + 2 sum_{n>=1} z^2/(z^2 + n^2 pi^2), so termwise
        f(z) := (z coth z)' = 4 z sum_{n>=1} n^2 pi^2 / (z^2 + n^2 pi^2)^2,
      and for z = x + iy with y^2 <= pi^2/4, writing A = n^2 pi^2 - y^2 >= 0,
        |z^2 + n^2 pi^2|^2 = (A + x^2)^2 + 4 x^2 y^2 >= (A + x^2)^2,
      so |z^2 + n^2 pi^2| >= (n^2 - 1/4) pi^2 + x^2 >= (n^2 - 1/4) pi^2. Hence
        |f(z)/z| <= (4/pi^2) sum_{n>=1} n^2/(n^2 - 1/4)^2 = (4/pi^2)(pi^2/4) = 1.
      VERIFIED NUMERICALLY TO 30 DIGITS: the sum is pi^2/4 = 2.467401100272339654708622750, the
      series for f agrees with the numerical derivative at four points in the strip, and
      |f(z)|/|z| -> 1 as z -> i pi/2, so THE BOUND IS SHARP AND THE EQUALITY CASE IS ATTAINED IN THE
      APPLICATION (at x = 1/2, y = 0 the substitution s = i pi (1-z) gives exactly s = i pi/2).
      The sum was done exactly rather than numerically, since the equality case is attained:
      n^2/(n^2-1/4)^2 = (1/(2n-1) + 1/(2n+1))^2 expands into two odd square series and a
      telescoping one, pi^2/8 + 1 + (pi^2/8 - 1). The odd square series is the odd half of zeta(2),
      from Mathlib's hasSum_zeta_two split by HasSum.even_add_odd.
      A JUNK-VALUE GUARD, NOT A WEAKENING: norm_deriv_mul_coth_le requires z /= 0, because in Lean
      w * cosh w / sinh w is 0/0 = 0 at the origin where its continuation is 1, so the function is
      discontinuous there and deriv returns junk.
      THE ONE THING SECTION 7 DOES NOT COVER IS THE ENDPOINT x = 1 OF PART (b).
      Fc 1 = 1/pi - 0 * cot 0 = 1/pi in Lean, whereas the true F(1) is 0 -- the limit of
