# Build plan for CH2.v1, mapped against PrimeNumberTheoremAnd and against the paper's sections.
#
# Best-practice file, not a schema CI enforces -- see docs/SOLUTIONS.md. Its job is to make the
# shape of a long build visible before anyone starts. `remaining_holes` on the node's
# formalization.yaml is derived from the build by `ieantn.py progress`; everything here is
# judgement and should read like it.

solution: Solutions/CH2.v1/

# --------------------------------------------------------------------------------------------
shape: >-
  One node, one large solution, built a paper section at a time. This is not the usual shape for
  this repository and the reason is deliberate: sections 2 to 5 of Chirre-Helfgott are machinery
  INTERNAL to the paper rather than among its exports, so their bespoke vocabulary -- LadderParams,
  Phi_lambda, sumResiduesIn, the ladder, the admissible contour -- belongs inside a solution and
  not in IEANTN/Vocabulary/ or any Conclusions.lean. Stating them as nodes would have cost about
  fifteen definitions in the layer humans read, permanently, to serve one node.
  The consequence to accept: a solution carrying any `sorry` cannot be verified, and Comparator is
  all-or-nothing per node, so NOTHING HERE GOES GREEN until all four corollaries are closed. The
  milestones below are internal. If that becomes intolerable the escape is to surface an
  intermediate result as its own node, which cuts against the reasoning above but stays available.
state: in-progress   # sections 2-5 ported; 4 holes, the four corollaries
source: PrimeNumberTheoremAnd, PrimeNumberTheoremAnd/IEANTN/CH2/CH2.lean and CH2_part1.lean
paper_source: >-
  The LaTeX source is worth having and is one command away:
  `curl -L https://arxiv.org/e-print/2512.15709 | tar xz` yields VonMangoldt.tex, 389 KB. Use it
  rather than a PDF extraction for anything numerical -- several displays in sections 8 and B do not
  survive OCR, and one of them was misread here for some time before the source settled it.

# --------------------------------------------------------------------------------------------
# What has to be proved, and what exists upstream.
# --------------------------------------------------------------------------------------------
targets:
  - conclusion: corollary_1_2_psi
    upstream: PrimeNumberTheoremAnd.CH2.cor_1_2_a          # CH2.lean:4319
    upstream_state: sorry
    statement_match: >-
      Agrees with this node's transcription, which was read from the paper and cross-checked
      against PNT+. Note the main term is x * (pi/T) * coth(pi/T), not x.
  - conclusion: corollary_1_2_lambda_sum
    upstream: PrimeNumberTheoremAnd.CH2.cor_1_2_b          # CH2.lean:4333
    upstream_state: sorry
    statement_match: agrees.
  - conclusion: corollary_1_3_psi
    upstream: PrimeNumberTheoremAnd.CH2.cor_1_3_a          # CH2.lean:4347
    upstream_state: sorry
    statement_match: >-
      DOES NOT AGREE, and the paper was taken as authoritative. PNT+ writes the leading constant as
      pi * 3 * 1e-12 = 9.425e-12 where the paper has pi/(3e12) = 1.047e-12, nine times smaller. Its
      cor_1_3_b uses a third value again. Do not copy either.
  - conclusion: corollary_1_3_lambda_sum
    upstream: PrimeNumberTheoremAnd.CH2.cor_1_3_b          # CH2.lean:4359
    upstream_state: sorry
    statement_match: does not agree; see above.

# --------------------------------------------------------------------------------------------
# Stages. Each is a paper section; the first four are ports, the rest are not.
# --------------------------------------------------------------------------------------------
stages:
  - stage: "sections 2-4: Fourier core and extremal approximants"
    files: [Part1Fourier.lean, Approximants.lean, Decay.lean, WienerPort.lean, Pnt*.lean]
    state: done
    note: >-
      Reused verbatim from Solutions/CH2.v2 and Solutions/CH2.v3, both of which are verified, so
      this material has already been through Comparator once in those nodes. Decay.lean is the one
      piece that is not upstream's: PNT+ derives the Fourier decay of the approximant from
      Wiener.prelim_decay_3, which is one of the two `sorry`s in that file, and Decay.lean replaces
      that route with one through the closed form. See Solutions/CH2.v3.

  - stage: "rectangle contour machinery"
    files: [AdditiveCombination.lean, RectanglePort.lean, ResiduePort.lean]
    state: done
    note: >-
      Reused from Solutions/CH2.v3. Sorry-free upstream, BUT CONDITIONALLY SOUND, and a reader of a
      future receipt should know why. ResiduePort's `residue` is labelled by its own authors a
      "placeholder definition -- valid only for simple poles", which "at a higher-order or essential
      singularity ... returns a junk value", and they add that results stated in terms of it are
      "likely not provable in full generality with the current API. This is a deliberate stopgap."
      The matching `HasSimplePolesOn` hypothesis is called a "temporary scaffold ... added to Lemma
      5.1 / Proposition 5.2 and their sub-lemmas to make them provable with the present API", to be
      removed once Mathlib gains higher-order residue support.
      FOR THIS APPLICATION IT IS SOUND: PNT+ names zeta'/zeta as the intended case precisely because
      its poles are all simple, and ZetaInstance.lean now PROVES that property rather than assuming
      it. But a CH2.v1 receipt would attest something narrower than it looks, and that is worth
      saying out loud rather than leaving buried in thirteen thousand lines.
      It also settles a question raised elsewhere: ContourIntegration.v1's general residue theorem,
      admitting arbitrary isolated singularities, is STRONGER than CH2 ever needs, since PNT+'s own
      machinery already assumes simple poles.

  - stage: "section 5: the contour shift"
    files: [ZetaConjPort.lean, Section5.lean]
    state: done
    note: >-
      CH2.lean lines 1-4318, everything below the four corollary `sorry`s: lemma_5_1_a to _d,
      prop_5_2_a/b/c and prop_5_2, with the LadderParams machinery. 199 declarations, sorry-free
      upstream, and it compiled against this repository's Mathlib after exactly ONE change: the
      `hp` argument of integrableOn_rpow_mul_exp_neg_mul_rpow is now `0 < p` where upstream's pin
      accepted `le_rfl`. That is far less drift than CH2.v2's port, which opened at a hundred
      errors, and the reason is that section 5 sits on top of Approximants and Part1Fourier, whose
      drift had already been absorbed for CH2.v2 and CH2.v3.
      Worth recording that PNT+'s LadderParams generates "a contour going up from 1 to
      1 + I * delta then backwards to -infinity + I * delta" -- the same vertical-plus-horizontal-ray
      restriction that CH2.v4 arrived at independently, which is some evidence the restriction is
      the natural one rather than a convenience.

  - stage: "instantiating section 5 at A(s) = -zeta'/zeta"
    files: [ZetaInstance.lean]
    state: >-
      DONE. Every hypothesis of prop_5_2 is discharged and prop_5_2_zeta applies it at
      A(s) = -zeta'/zeta with the pole at s = 1 divided out, for any LadderParams whose abscissas
      are sigmaZeta and whose T and delta miss the zero ordinates -- which exists_ladderParams_zeta
      supplies.
    what_it_took: >-
      Meromorphy and conjugation symmetry came almost free from the port. The other five did not.
      THE TWO BOUNDEDNESS CONDITIONS needed the ladder cut at Re = -1: to the right it is a union
      of five boxes, four degenerate, handled by compactness; to the left by the growth bound on F
      damped by x0^s. The weighted one needed a quadratic version of that damping, since the extra
      factor zOf s = (s-1)/(iT) turns linear growth into quadratic -- obtained free from the linear
      case by u^2 exp(-cu) = (u exp(-(c/2)u))^2.
      THE TWO SIMPLE-POLE CONDITIONS needed the Graham-Vaaler weights to have no poles on R, which
      holds because zOf pulls their poles back to Re s = 1 + T lam/(2 pi) > 1 -- and that in turn
      holds because prop_5_2 assumes 0 < lam, which had looked like a free parameter.
      hsimple additionally forced prop_5_2's own hypothesis to be weakened; see below.
      hfin needed nothing new: RC removes exactly the real axis, which is where all the trivial
      zeros of zeta sit, and off the axis the poles lie in a compact band with finitely many.
    one_edit_to_the_ported_section_5: >-
      prop_5_2's hsimple hypothesis was stated on l.R and is now on l.Rpos u l.RposBar. It was
      never CONSUMED outside that set -- it reaches its uses through HasSimplePolesOn.mono onto the
      upper and lower rectangles, which sit at |Im s| >= delta > 0 -- and on l.R it is not provable
      by an order computation at all: Phi_lambda contains Real.sign (Re z) and
      Re (zOf s) = Im s / T, so the integrand is discontinuous across the real axis, hence not
      meromorphic there, and meromorphicOrderAt returns its junk value 0. Proving the l.R form
      would have meant establishing a vacuity. Eight binders and two mono proofs changed; no proof
      body did, and weakening a hypothesis strengthens the theorem.
    note: >-
      Done first because it is the smallest thing that tests whether the section 5 port is USABLE
      rather than merely compiling. It is: ConjSymm falls straight out of the ported
      logDerivZeta_conj', MeromorphicOn out of Mathlib's MeromorphicOn.logDeriv, and the order bound
      out of meromorphicOrderAt_logDeriv_eq_neg_one.
      HasSimplePolesOn was the hypothesis expected to hurt and did not. -zeta'/zeta has a pole at
      every zero of zeta, of every multiplicity, and Mathlib gives the logarithmic derivative order
      exactly -1 at any zero or pole regardless: the multiplicity lands in the residue, not the
      order. That is now proved rather than assumed.
      BOTH GAPS ARE NOW CLOSED, using Mathlib.NumberTheory.Harmonic.ZetaAsymp. Meromorphy at the
      pole comes from riemannZeta_eq_inv_sub_add -- zeta s = (s-1)^-1 + riemannZeta0 s away from 1,
      with riemannZeta0 ENTIRE -- so it is a congruence on the punctured neighbourhood plus
      MeromorphicAt.inv, with no removable-singularity argument. Non-vanishing is then the identity
      theorem, which Mathlib packages as meromorphicOrderAt_ne_top_of_isPreconnected: seed it at
      s = 2 via riemannZeta_ne_zero_of_one_lt_re and it holds everywhere.
      A third Mathlib lemma collapsed the rest. meromorphicOrderAt_logDeriv_nonneg gives order >= 0
      for the logarithmic derivative wherever the function itself has order 0, which is exactly the
      branch that had needed analyticity and z != 1. HasSimplePolesOn A now holds on ALL of C,
      including s = 1, since meromorphicOrderAt_logDeriv_eq_neg_one covers poles as well as zeros
      and zeta's pole there is simple.
      THE TWO IsBoundedNoPolesOn HYPOTHESES ARE HALF DONE, and the halves are very unequal. Each
      asks for two things at once on l.Rboundary union l.admissible_contour union l.L: no poles
      there, and boundedness there.
      THE POLE HALF IS DONE, and it is where the ladder's abscissas get chosen. Mathlib knows that
      each -2(n+1) IS a zero of zeta (riemannZeta_neg_two_mul_nat_add_one) and that there are none
      with Re s >= 1, but NOT that the trivial zeros are the only ones on the left -- which is
      exactly what a ladder needs, since it puts its columns out there. That gap is now closed by
      riemannZeta_ne_zero_of_re_neg, proved from the functional equation alone: writing s = 1 - w
      with Re w > 1, every factor of riemannZeta_one_sub except cos(pi w/2) is nonzero for free, so
      a zero forces w = 2k+1, i.e. s = -2k. The abscissas are then sigmaZeta n = 1 - 2n, odd and so
      threading between the even trivial zeros, with riemannZeta_ne_zero_on_column proving each
      column past the first misses them. Both are sorry-free on the three permitted axioms.
      Worth noting the reuse: that proof is riemannZeta_one_sub plus Gamma_ne_zero plus
      cos_eq_zero_iff, the same three lemmas as ZetaLogDeriv.v1's solution. Not a coincidence --
      both are the functional equation carrying a fact from the convergent half-plane leftwards.
      THE BOUNDEDNESS HALF IS NOT STARTED and is the substantial one. It needs
      ||zeta'/zeta|| = O(log|s|) on the columns and the contour, which is where GammaAsymptotics.v1
      (still none-yet) and ZetaLogDeriv.v1 (green) are meant to earn their keep, together with
      boundedness on Re s >= 2 from the Dirichlet series.
      ONE THING TO KNOW BEFORE STARTING IT: x0 > 1 is not optional, though prop_5_2's signature
      only asks 1 <= x0. On the column at Re s = 1 - 2n the function zeta'/zeta grows like
      log|s|, so sup over the WHOLE ladder -- a union over all n -- is infinite at x0 = 1. What
      makes the hypothesis true is the x0^s factor decaying like x0^(1-2n). The second hypothesis
      is worse, carrying l.zOf s = (s-1)/(i T) as well, so it needs that decay to beat a further
      factor of |s|.
      THE ORIENTATION OF ZetaLogDeriv.v1 MATTERS, AND THE OBVIOUS READING IS THE WRONG ONE. That
      node states
        zeta'/zeta(w) = -zeta'/zeta(1-w) + log 2pi - psi(w) + (pi/2) tan(pi w / 2),
      and read at w = s it evaluates psi at s -- out on the ladder at Re s <= -1, where
      GammaAsymptotics.v1 says nothing whatever, since its bound is stated for Re w >= 1. Read at
      w = 1 - s instead, the same identity puts psi at 1 - s with Re (1-s) >= 2, inside that range,
      and needs no further input. That is logDeriv_ladder_form in ZetaInstance.lean.
      Getting this backwards would have sent someone hunting for a digamma bound on the left
      half-plane, or for the reflection formula psi(1-w) - psi(w) = pi cot(pi w) that this
      repository's Mathlib pin does not carry -- a detour of days for a one-line change of
      instantiation point. Both orientations were checked numerically to 30 digits at five points
      before either was written down.
      WHAT REMAINS FOR THE BOUNDEDNESS HALF, with the identity in hand. On a column Re s = 1 - 2n:
      (a) zeta'/zeta(1-s) is bounded because Re (1-s) >= 2 and the Dirichlet series converges
      there -- Mathlib has LSeries_vonMangoldt_eq_deriv_riemannZeta_div and
      LSeriesSummable_vonMangoldt, and this is the Re s >= 2 bound ZetaLogDeriv.v1's metadata
      deliberately declined to state as a conclusion, on the grounds it is about thirty lines
      inside a solution. This is that solution;
      (b) tan(pi (1-s)/2) is bounded by 1 in modulus, since 1 - s = 2n - it makes it i tanh(pi t/2)
      -- cos_ne_zero_on_column already carries the parity argument this rests on;
      (c) psi(1-s) is O(log|s|) from GammaAsymptotics.v1, which arrives as a HYPOTHESIS on the
      generated challenge rather than needing a sorry, since CH2.v1 already imports it;
      (d) log 2pi is constant.
      So the column bound is O(log|s|), and x0^(1-2n) beats it. The remaining work is (a) and the
      assembly, plus the same estimate on Rboundary and the admissible contour, which are NOT
      columns and will need their own argument.
      NOTE FOR WHOEVER CLOSES THIS: CH2.v1's formalization.yaml does not yet import
      ZetaLogDeriv.v1. It will have to, since logDeriv_ladder_form takes that statement as a
      hypothesis and the corollary proofs must supply it from the challenge. Adding the import
      leaves the conclusion text untouched, so no fingerprint moves; it only adds a hypothesis to
      the generated challenge. It was left out here because the corollaries are still holes and
      the dependency is not yet real at the conclusion level.
      THE SET SPLITS INTO COMPACT PIECES AND LEFTWARD RAYS, and the two want different arguments.
      Rboundary union admissible_contour union L is nowhere near compact -- every piece of it runs
      off to Re s = -infinity -- but three of its five pieces are compact: the segment
      {Re s = 1, |Im s| <= T} of the boundary, the contour's vertical stub
      {Re s = 1, Im s in [0, delta]}, and any bounded portion of a ray. On those, analyticity is
      the whole story, and isBoundedNoPolesOn_of_isCompact gets both halves at once: continuous on
      a compact set is bounded, and the meromorphic order of an analytic function is its analytic
      order, which is a natural number and so never negative. isCompact_reOne_segment does the
      first of the three.
      THREE THINGS REMAIN FOR THIS STAGE, in rough order of difficulty.
      (i) F IS NOW DEFINED, AND IT IS NOT THE AWKWARD OBJECT IT LOOKED LIKE. prop_5_2 is applied
      not to A = -zeta'/zeta but to F = A - 1/(s-1), Theorem 1.1's pole-free part, because
      Rboundary CONTAINS s = 1 -- it has Re s = 1 and |Im s| = 0 <= T -- and IsBoundedNoPolesOn
      demands order >= 0 there, which A fails at its own pole. A cannot be the input.
      No removable-singularity argument was needed in the end. From zeta s = riemannZeta_1 s /
      (s-1), taking logarithmic derivatives gives A = -riemannZeta_1'/riemannZeta_1 + 1/(s-1), so
      F = -logDeriv riemannZeta_1 exactly. F is the logarithmic derivative of an ENTIRE function,
      analytic wherever riemannZeta_1 is non-zero, and riemannZeta_1_one = 1 makes that include
      s = 1 with nothing to prove. analyticAt_F, analyticAt_F_one and meromorphicOn_F.
      THE THREE HYPOTHESES RECORDED ABOVE AS DONE WERE PROVED FOR A, AND prop_5_2 WANTS THEM FOR
      F. They do not transfer for free. This was not noticed until F was defined, and it is the
      correction most likely to mislead someone reading the earlier notes: ConjSymm,
      MeromorphicOn and HasSimplePolesOn all have to be reproved.
      ALL THREE ARE NOW REPROVED FOR F, and it was easier than for A, exactly because
      riemannZeta_1 is entire: conjSymm_F, meromorphicOn_F, hasSimplePolesOn_F_univ.
      meromorphicOn_F took three lines against the dozen its A-counterpart needed to route around
      the pole, and hasSimplePolesOn_F_univ is hasSimplePolesOn_A_univ with riemannZeta_1
      substituted throughout.
      ConjSymm F was the only one needing anything new, namely riemannZeta_1_conj. Mathlib has no
      conjugation lemma for riemannZeta_0 -- checked -- so the route is riemannZeta_1 w =
      (w-1) zeta w off the pole, transported along riemannZeta_conj, with s = 1 done separately
      from riemannZeta_1_one. The split is unavoidable, since ConjSymm is a claim about EVERY s
      while the transporting identity holds only off the pole. Two lines.
      SO prop_5_2's FIRST THREE HYPOTHESES NOW HOLD FOR THE FUNCTION IT IS ACTUALLY APPLIED TO.
      (ii) THE LEFTWARD RAYS ARE DONE as an estimate:
      exists_bound_of_linear_growth_mul_cpow. Every non-compact piece of the target set is a set
      running off to Re s = -infinity at bounded height -- the horizontal pieces and the ladder L
      alike -- and on those the x0^s factor does the work, since ||x0^s|| = x0^(Re s) decays
      exponentially in |Re s| and beats any polynomial growth of F.
      THE HYPOTHESIS IS DELIBERATELY WEAK. It asks for LINEAR growth, where the truth is
      logarithmic. That costs nothing and makes it much easier to supply, and it also absorbs the
      extra factor of s in prop_5_2's second boundedness hypothesis, which then only changes the
      constant rather than needing a separate argument.
      x0 > 1 IS ESSENTIAL AND THE SIGNATURE DOES NOT SAY SO. prop_5_2 asks only 1 <= x0; at
      x0 = 1 the damping factor is identically 1 and the statement is FALSE, since zeta'/zeta is
      unbounded along a ladder whose columns march to -infinity. Recorded on the lemma itself.
      (iv) THE LADDER ITSELF NOW EXISTS: exists_ladderParams_zeta produces a LadderParams with
      sigma = sigmaZeta and with T, delta drawn from exists_ladder_heights, so its columns thread
      between the trivial zeros and its horizontal pieces miss the non-trivial ones. Stated as an
      existence rather than a def on purpose -- nothing downstream should depend on WHICH
      admissible T and delta were picked, only that some choice works. T is taken from [20,21] and
      delta from [1,2], which forces delta < T/4; the numbers are arbitrary and concrete only
      because that is cheaper than carrying the inequality abstractly.
      One Mathlib gap met on the way: there is no const_sub lemma landing in atBot, so
      1 - 2n -> -infinity is proved directly through Filter.tendsto_atBot.
      (v) WHAT IS ACTUALLY LEFT is a linear growth bound on F over
      Rboundary union admissible_contour union L, which is what
      exists_bound_of_linear_growth_mul_cpow consumes. Every input exists --
      logDeriv_ladder_form, logDeriv_riemannZeta_bounded_of_two_le_re, the tan bound implicit in
      cos_ne_zero_on_column, and GammaAsymptotics.v1's digamma estimate, which arrives as a
      HYPOTHESIS on the generated challenge rather than needing a sorry.
      ONE OF THOSE INPUTS TURNED OUT TO BE MISSING FROM MATHLIB and is now supplied here:
      norm_tan_le_of_im_ne_zero, that ||tan w|| <= cosh(Im w)/|sinh(Im w)|. Mathlib's only results
      about Complex.tan say it blows up AT its poles -- tendsto_norm_tan_of_cos_eq_zero -- and a
      contour argument needs the opposite, that it stays bounded away from them. Along a horizontal
      ray at fixed non-zero height the bound is a constant depending only on the height, which is
      exactly what the rays need. The identity that makes it easy is
      ||cos w||^2 = cos^2(Re w) + sinh^2(Im w), from Complex.cos_add_mul_I and Real.cosh_sq; that
      and its sin analogue look like Mathlib lemmas in their own right.
      Note the tan bound is needed for the RAYS but not for the COLUMNS: on a column Re s = 1-2n
      the reflected point is 1-s = 2n - it, where the tangent is i tanh(pi t/2) and bounded by 1
      outright. cos_ne_zero_on_column carries the parity argument that rests on.
      THE GROWTH BOUND IS NOW PROVED: norm_F_le_linear. It takes GammaAsymptotics.v1's statement
      as an argument, exactly as logDeriv_ladder_form takes ZetaLogDeriv.v1's, so no sorry is
      involved -- both arrive as hypotheses on the generated challenge.
      Its two set-dependent hypotheses are the right ones: how big tan is on the piece, and that
      the cosine does not vanish there. Both are supplied per-piece -- bounded by 1 on a column by
      parity, by norm_tan_le_of_im_ne_zero on a ray.
      hcos does double duty and that is worth knowing: its failures are exactly the EVEN integers,
      which include every trivial zero, so together with Re z <= -1 it hands over zeta z /= 0 free
      via riemannZeta_ne_zero_of_re_neg. No separate non-vanishing hypothesis is needed.
      Two supporting facts had to be built: norm_log_le_norm_add_pi (crude on purpose, only linear
      growth is wanted) and logDeriv_riemannZeta_1_eq, which is what finally proves that the F
      defined here as -logDeriv riemannZeta_1 really IS Theorem 1.1's A - Res/(s-1).
      WHAT IS LEFT IN THE STAGE is now only the application: instantiate prop_5_2 at
      exists_ladderParams_zeta, splitting the target set into its compact pieces and its rays and
      feeding isBoundedNoPolesOn_of_isCompact and exists_bound_of_linear_growth_mul_cpow
      respectively. No estimate remains unproved.
      (iii) T AND DELTA AVOIDING THE ZERO ORDINATES IS NOW DONE:
      exists_ordinate_free_height gives, for every T0 > 0, a height T in [T0, T0+1] with no zero of
      zeta at |Im z| = T. Same statement serves delta, since it is the same question.
      THE TOOL IS riemannZeta_1, AND THE REASON IS WORTH KEEPING. The identity theorem is about
      ANALYTIC functions, and zeta has a pole, so zeta cannot be fed to it on any set containing 1.
      Mathlib's riemannZeta_1 = 1 + (s-1) zeta_0 s is entire and, away from 1, has exactly zeta's
      zeros -- but Mathlib never says so. riemannZeta_1 appears only in ZetaAsymp, where it was
      introduced for the asymptotic expansion, and not one of its five lemmas relates it back to
      zeta. riemannZeta_eq_riemannZeta_1_div is that bridge.
      From there the argument is counting, not analysis. riemannZeta_1 is not identically zero
      because riemannZeta_1_one supplies the seed for free, so its zeros are isolated; on a compact
      band missing the pole that gives finitely many zeros of zeta; finitely many ordinates cannot
      exhaust an interval. The band is compact and misses 1 because it has |Im z| bounded away from
      zero, and a zero off the real axis lies in the closed critical strip -- which is
      re_mem_Icc_of_riemannZeta_eq_zero, itself just riemannZeta_ne_zero_of_one_le_re at one edge
      and riemannZeta_ne_zero_of_re_neg at the other, the trivial zeros being real.
      THREE OF THESE ARE ABOUT ZETA, NOT ABOUT CH2, and have been extracted for upstreaming:
      riemannZeta_eq_riemannZeta_1_div, riemannZeta_eq_zero_iff_riemannZeta_1, and
      finite_zeros_riemannZeta_of_isCompact. If they land in Mathlib the copies here can go.
      Mathlib friction worth knowing: `DifferentiableAt` unfolds to an Exists, so
      `(differentiableAt_riemannZeta hz).analyticAt` resolves to `Exists.analyticAt` and fails
      confusingly -- go through DifferentiableOn.analyticAt. And there is no meromorphicOrderAt_neg,
      so a sign must go through meromorphicOrderAt_smul.

  - stage: "section 6: Theorem 1.1"
    state: not started, and possibly not needed
    note: >-
      PNT+ has `TODO: incorporate material from [CH2, Section 6]` where this would go, and its
      cor_1_2_a is meant to follow from prop_5_2 without it. If that holds here too, the general
      theorem can be skipped entirely; it is the paper's headline but not on the path to the
      corollaries. Decide this by working section 7 backwards, not by stating Theorem 1.1 first.

  - stage: "sections 7-8: the specialisation to psi"
    state: in progress -- Appendix C plus section 7's preamble done (Section7.lean); sections 7, 8 open
    note: >-
      A CORRECTION TO THE NUMBERING, recorded because it was got wrong once. Section 7 of
      Chirre-Helfgott is sec:zetres, "The case of Lambda(n): sums over zeros of zeta(s)", and
      section 8 is sec:horint, "The case of Lambda(n): Integrals". lem:sibelius and lem:cothder are
      NOT in section 7: they live in APPENDIX C, sec:darf ("Series, functions and comparisons"),
      after the appendix marker at line 3615 of the source. Section 7 consumes them.
      WHAT Section7.lean ACTUALLY CONTAINS, 2415 lines: all of Appendix C's subs:darf1 --
      lem:sibelius (a), (b), (c) and lem:cothder -- together with section 7's two PREAMBLE
      estimates, coth y <= 1 + 1/y and 1/y <= coth y <= 1/y + y/3 (source lines 2224-2225). Part (b)
      is stated on 0 < x < 1; its case 0 < x <= 1/2 follows from (c) plus
      |1/(x+iy) - 1/x| = |y|/(x|x+iy|), and its case 1/2 <= x < 1 from lem:cothder and the mean
      value inequality along the vertical segment.
      SECTION 7 PROPER IS NOT STARTED. Its four remaining pieces are lem:trivialzer (the trivial
      zeros, which needs the residue of -zeta'/zeta at -2n and coth decreasing on (0,infty)),
      cor:thonny (the weight estimate, which is what consumes lem:sibelius and lem:cothder),
      prop:tritura with lem:tremic and lem:konstanz (the integral of
