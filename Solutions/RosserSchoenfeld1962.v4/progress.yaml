proof_route: Reuse the completed RS12 theorem. Keep only the pointwise prime-power majorant from PrimePowers.
  Above 46656 derive the strict 7/5 square-root bound. Below that threshold reduce to the 83 proper prime-power
  jumps, verify rational Taylor logarithm enclosures and integer square inequalities, then compare the
  exact anchor at 361 with the strict decimal 1.42620. No uniqueness conclusion is exported.
