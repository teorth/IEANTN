cutoff_audit:
  choice: 4096 = 64^2 is a convenient sufficient cutoff, not an optimal one.
  forcing_step: For s=sqrt(x)>=64, Costa-Pereira plus the v1 upper bound gives psi(2*x)-theta(2*x)
    < 3*1.03883*sqrt(2*x) <= 3*1.03883*(3/2)*s < (19/4)*s <= (19/256)*x. The last conversion uses
    s>=64 and determines the chosen cutoff.
  logarithmic_error: log(2*x)<=5*s/32, from log(t)<=t-1 applied at t=s/64 and log(2)<0.6931471808.
    Then 5*log(2*x)+1 < x/50; at s=64 its sufficient comparison is 51<81.92.
  theta_margin: 1.84-1.03883-19/256-1/50 = 0.70695125. This exceeds 0.7 by 5561/800000, a margin
    of 28.47232 at x=4096.
  target_margin: At x=4096=2^12, (3*x/(5*log(x)))*log(2*x)=(13/20)*x=0.65*x, leaving 0.05*x=204.8
    below the 0.7*x comparison line.
