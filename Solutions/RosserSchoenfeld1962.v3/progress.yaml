strategy:
  finite: Checked prime witnesses on a rational interval covering 41/2 <= x < 4096.
  tail: Weighted factorials give psi(y) >= 0.92*y - 5*log(y) - 1. Combine with the existing proved
    psi(x) < 1.03883*x and Mathlib's proved Costa-Pereira psi-theta inequality at y=2*x, bounding
    each of the three psi terms by 1.03883*sqrt(y). Bound the log-weighted prime interval sum above
    by (pi(2*x)-pi(x))*log(2*x).
dependencies:
- IEANTN Vocabulary definition of primeCounting; no conclusion assumed.
- Sibling v1 RS12 proof library from public IEANTN merge e4123d4b16c21fc4df4f4f4706884bb57396833d.
  The proof of equation (3.35) is used directly; no node conclusion is assumed.
- LeanCert 6b11513512c9d27183fb4725bfc291ab38b4a6d7, same as v1. Exact rational logarithm endpoints
