dependency_compatibility:
  precedents_inspected:
    - Solutions/Lcm.v1/lakefile.toml
    - Solutions/Lcm.v2/lakefile.toml
    - Solutions/FKS2.v1/lakefile.toml
    - Solutions/FKS2.v2/lakefile.toml
    - Solutions/GammaAsymptotics.v2/lakefile.toml
  finding: >-
    These solutions depend on IEANTN by the path ../.. and use the core's toolchain and
    Mathlib revision. All existing solution lakefiles were also searched: none provides
    a separate external LeanCert dependency precedent. There is no precedent here for
    moving a solution to the upstream PNT+ toolchain or moving the core to accommodate it.
  decision: >-
    Retain the validated LeanCert pin 6b11513512c9d27183fb4725bfc291ab38b4a6d7 and test
    its required ten-module closure on the core toolchain. Put the IEANTN requirement
    after LeanCert: Lake resolves later requirements first, so the core's Mathlib and
    all eight support-package pins take precedence. This fixes manifest resolution
    without changing LeanCert, the core, or any RS12 mathematical or certificate content.
  result: >-
    The complete required LeanCert closure builds on Lean 4.34.0-rc2 at the original pin.
    No LeanCert source patch or revision change is needed. The compiler reports only
    existing deprecation warnings. The solution manifest's Mathlib and eight support
    package revisions match the core manifest exactly.

