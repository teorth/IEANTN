targets:
  - conclusion: RosserSchoenfeld1962.v1.equation_3_35
    compared_theorem: RosserSchoenfeld1962.v1.challenge_equation_3_35
    upstream: RS_prime.theorem_12
    upstream_state: proved
    upstream_axioms: [propext, Classical.choice, Quot.sound]
    statement_match: >-
      Exact for equation (3.35). The upstream theorem takes an implicit real x and a proof
      of 0 < x, and concludes Chebyshev.psi x < RS_prime.c₀ * x. The definition of c₀ is
      1.03883. The node quantifies explicitly over x and writes the same constant directly.
      The adapter only introduces x and its positivity proof; it changes no bound or endpoint.
    proof_structure: >-
      Certify the range 0 < x <= 500000. Above that, use
      psi(x) <= 1.021*x + psi(x/60), then strong induction on the natural floor of x.
      The strict margin is 1.03883 - (1.021 + 1.03883/60) = 3097/6000000 > 0.

statement_audit:
  source: https://doi.org/10.1215/ijm/1255631807
  scan: http://denise.vella.chemla.free.fr/Rosser-Schoenfeld-1962.pdf
  method: >-
    Downloaded the original article's scan outside the repository, extracted text to locate
    the passages, then rendered and visually read printed pp. 64 and 71 (PDF pages 1 and 8)
    before writing the conclusion. Bibliography checked against the publisher's DOI record.
  confirmed_correct:
    - >-
      Theorem 12, equation (3.35), p. 71, states psi(x) < 1.03883 x for 0 < x.
      Both inequalities are strict, x is real, and there is no additional hypothesis.
    - >-
      Page 64 defines psi(x) as the logarithm of the least common multiple of positive
      integers <= x, and sets it to zero for x < 2. Thus an integer endpoint is included
      with full weight, including at prime powers; there is no half-weight convention.
    - >-
      Mathlib's Chebyshev.psi is the sum of von Mangoldt over Ioc 0 (Nat.floor x).
      Its psi_eq_log_lcmUpto and psi_eq_psi_coe_floor identify this with the paper's
      definition, and psi_eq_zero_of_lt_two gives the small-x convention. IEANTN's
      Vocabulary.ErrorTerms already uses this exact function in Eψ. No new definition
      in Vocabulary or Conclusions is required.
  discrepancy:
    - >-
      The complete printed Theorem 12 ALSO asserts that psi(x)/x attains its maximum
      at x = 113. RS_prime.theorem_12 proves only the bound (3.35). This was reported
      before porting. The node deliberately represents the requested displayed bound,
      named equation_3_35, with the omitted clause explicit in Conclusions.lean and formalization.yaml;
      no claim is made that the maximum assertion has been formalized.

upstream_closure:
  method: >-
    Followed imports recursively using only git blobs at 81eca5a, then read the actual
    theorem and its dependencies to prune imports at their origin. External Mathlib and
    LeanCert modules are excluded from the following PNT+ module/line counts.
  raw_source_theorem_module: {modules: 86, lines: 125846}
  raw_rs12_proof_module: {modules: 82, lines: 118936}
  retained_rs12: {modules: 49, lines: 92459}
  retained_support:
    - >-
      ZetaBounds.lean: the two-line Finset.Ioc_eq_Icc identity, used by the factorial
      sum rewrites. This is the only declaration retained from the analytic imports.
    - >-
      Chebyshev.lean: T, T.le, T.ge, T.eq_sum_Lambda, E, T.weighted_eq_sum,
      e, and U_bound.lemma_2. These are the factorial estimates and weighted identity
      actually consumed by RS12, and need only Mathlib after extraction.
    - >-
      RosserSchoenfeldPrime_tables.lean: the definition RS_prime.c₀ := 1.03883.
    - >-
      RosserSchoenfeldPrime.lean: the two-line RS_prime.theorem_12 wrapper only.
  excluded:
    - MediumPNT and the unrelated theorems in RosserSchoenfeldPrime.lean
    - SecondaryDefinitions, PrimaryDefinitions, Consequences, Wiener, and zeta machinery
    - LogTables and its unrelated numerical estimates
    - LeanArchitect imports, blueprint attributes, and blueprint comments
  external_dependencies:
    - >-
      IEANTN at ../.., for the small node conclusion, with the repository's exact
      Lean 4.34.0-rc2 toolchain and Mathlib pin. Core dependencies are unchanged.
    - >-
      LeanCert, solution only, initially pinned to the same commit used by the validated
      upstream. Only the certified psi checker and rational Taylor-logarithm API are
      imported. Any compatibility adaptation will be recorded below.

trusted_numerics:
  assumptions: none
  factorial_certificates: >-
    FactorialData00--FactorialData11 certify one period [0, 360360) of the fixed integer
    weighted-floor function, in leaves of at most 250 inputs. The weights, their
    denominator 1000000, and the recurrence contraction 60 are unchanged.
  psi_certificates: >-
    PsiFiniteBase certifies the accumulator at 600. PsiData00--PsiData19 cover the
    integers 601 through 500000, preserving all 1998 witness arrays and prefix checks.
    The final accumulator is 5793100 and each integer bound uses coefficient 1.038829.
  logarithms_and_small_range: >-
    KernelLogs verifies six rational Taylor-logarithm endpoints. Small uses LeanCert's
    rational psi checker through 600. All closed computations use decide +kernel,
    never native_decide or externally asserted numerical results.
  trust_boundary: >-
    Python only supplies certificate data and Lean source. The soundness theorems and
    all certificate checks are verified by Lean. No numerical node hypothesis is added.

file_layout:
  core: >-
    IEANTN/Nodes/RosserSchoenfeld1962/v1 contains Conclusions.lean, formalization.yaml,
    generated Challenge.lean, and generated fingerprints.json. It imports Mathlib only.
  solution: >-
    Solution.lean contains only the Comparator-facing adapter. RS12/ keeps every
    upstream RS12 module boundary, with Chebyshev.lean and Tables.lean for the extracted
    support. Proof.lean also retains the small RS_prime.theorem_12 wrapper.
  rs12_support_modules:
    - Constants
    - Factorial
    - FactorialBound
    - FactorialData
    - FactorialUpper
    - FiniteBridge
    - FixedCheck
    - KernelLogs
    - Period
    - Proof
    - PsiFinite
    - PsiFiniteBase
    - PsiInteger
    - PsiRecurrence
    - PsiWitness
    - Small
    - Weights
  generated_modules: >-
    FactorialData00--FactorialData11, FactorialData, PsiData00--PsiData19,
    PsiFiniteBase, and PsiFinite: 35 modules total, including the 32 heavy shards.
    All belong to the solution, never to the core node.

