statement_audit:
  source: https://doi.org/10.1215/ijm/1255631807
  scan: http://denise.vella.chemla.free.fr/Rosser-Schoenfeld-1962.pdf
  wording: >-
    Printed Theorem 12, p. 71, says the quotient psi(x)/x takes its maximum at x = 113,
    then gives equation (3.35). It does not explicitly say the maximum is unique.
  proof_locator: >-
    Pages 77-78 discuss verification through 2000 using Gram's table and a bound of
    1.03882 x beyond 2000; they place the maximum value strictly between 1.03882 and
    1.03883. The range above 10^8 is reduced to Table I, justified in Section 6.
    The maximum clause and equation (3.35) are distinct parts of Theorem 12.
  conclusions:
    maximum: >-
      RosserSchoenfeld1962.v2.psi_ratio_maximum_at_113 is the sourced claim, over all
      positive real arguments using Mathlib's full-weight prime-power endpoint convention.
    uniqueness: >-
      RosserSchoenfeld1962.v2.psi_ratio_unique_maximum_at_113 is an explicit uniqueness refinement, formally stronger
      than the printed wording. Its designated asserted justification records the author's
      local validation report; official Comparator verification remains pending.
      No mathematical novelty is claimed.
  unchanged: >-
    RosserSchoenfeld1962.v1.equation_3_35 and RS_prime.theorem_12 retain their original
    meanings and source files. The pinned PNT+ theorem proves only equation (3.35).

architecture:
  node: RosserSchoenfeld1962.v2
  rationale: >-
    Versions are variants in IEANTN. Two separate conclusions distinguish the historical
    maximum claim from uniqueness, and leave the merged v1 conclusion immutable.
  core: Mathlib.NumberTheory.Chebyshev only; no new Vocabulary definitions.
  reuse: >-
    Required recurrence support and integer witness DATA are supplied locally with
    attribution and pinned original-source hashes. No sibling srcDir, v1 proof module,
    or LeanCert package remains. Only v1 core Conclusions supplies the hypothesis type.
  duplication: >-
    The 1998 witness lists are supplied as integer data and rendered into local checked
    declarations. Shifted and SmallChecker preserve the existing stronger accumulator
    argument. Only necessary recurrence support is extracted; unused checker routes,
    the v1 seed, global theorem and induction are omitted.

proof:
  historical_comparison: >-
    The paper uses 0..2000, 2000..50653, 50653..10^8, and Table I beyond.
    Lean uses 0..600, 601..500000, and the recurrence beyond 500000. The cutoff 2000
    is historical; 600 is inherited from the earlier finite-certificate architecture
    and supplies the seed for the witness certificates; 500000 is the finite-certificate/
    recurrence handoff. The formal proof is mathematically different while proving the
    same maximum statement. No mathematical novelty is claimed.
  principal_target: 113 * psi(x) < x * psi(113) for x > 0 and x != 113
  finite_seed: >-
    A kernel-checked integer LCM comparison gives 2^169*(12774/10000) <= lcmUpto(113).
    Mathlib logarithm and twelve-term exponential bounds then prove
    113*1.03882 < psi(113). For the small upper bounds, refine v1's binary-length method
    from eighth powers to 256th powers, with the already certified log(2) upper bound.
    The generated data supplies 600 factor/exponent triples in 12 blocks. The checker
    verifies p^256 < 2^u by exact integer arithmetic, without trusting a computed logarithm.
    A proved checker verifies every integer prefix through 600, skipping only 113 for
    the strict slope comparison. Its endpoint gives psi(600) <= 219418*693148/256000000,
    below 594.10. This leaves more than five units of slack in v1's seed
    6919*693148/8000000. All computations use decide +kernel.
  finite_propagation: >-
    Local kernel checks of the pinned witness data yield psi(n)+5 <= 1.038829*n for 600 < n <= 500000.
    Since 0.000009*n <= 4.5 in this range, this gives psi(n) < 1.03882*n, hence the strict
    symbolic comparison. The rational separator is not substituted for the exact optimum.
  real_extension: >-
    Use psi(x)=psi(floor x). For floor x other than 0 or 113, the strict integer bound
    and floor x <= x suffice. For floor x=0 use psi(x)=0 and positivity of psi(113).
    For floor x=113 and x!=113, use 113<x and the same positivity.
  tail: >-
    For x>=500000, reuse the recurrence and apply the supplied equation_3_35 hypothesis
    at x/60. Their combination is strictly below 1.03882*x. The global v1 theorem is
    supplied as a proof; the recurrence uses locally compiled factorial certificates.
  ratios: >-
    Equality at 113 gives the non-strict global bound. Positive-denominator cross
    multiplication derives both public ratio formulations from the strict internal theorem.

