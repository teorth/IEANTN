limitations:
- >-
  Rosser's 1970 observation is recorded as Rosser and Schoenfeld (1975) report it; it is not cited
  here at first hand.
- >-
  Imports undetermined: what the 1968 computation rests on (its error analysis for the Riemann-Siegel
  formula and its counting argument) has not been traced.
- >-
  A direct verification in Lean is expected to be feasible on a powerful desktop machine but has not
  been done.
- >-
  No novelty is claimed.
