project:
  name: The least common multiple sequence is not highly abundant for large n
  description: A refutation of the conjecture that every term of L_n = lcm(1, 2, ...,
    n) is a highly abundant number. The conjecture fails for every n >= 89693^2, not
    merely infinitely often. The argument adjoins three primes slightly above sqrt(n)
    to L_n and removes three primes slightly below n, chosen so that the product removed
    slightly exceeds the product adjoined, producing a smaller integer with a larger
    sum of divisors. The primes are located using Dusart's Proposition 5.4, which
    is where the threshold 89693^2 comes from.
  authors:
  - Terence Tao
  license: Apache-2.0
  responsible_maintainers:
  - Terence Tao
