sources:
- title: Is the least common multiple sequence lcm(1, 2, ..., n) a subset of the highly
    abundant numbers?
  authors:
  - Jose Damian Espinosa
  type: web discussion
  id: https://mathoverflow.net/questions/501066
  location: MathOverflow, asked 1 October 2025
  relationship: formalizes
  contributors:
  - name: Terence Tao
    role: Author of the refutation argument formalized here, given in comments on
      the question dated 2 October 2025.
  note: 'The question posed the conjecture {L_n} subset HA; the answer is that it
    is false for all large n. VERIFY BEFORE SUBMISSION: the attribution above is taken
    from the comment thread, where the argument is Tao''s. The authorship of the accepted
    answer post itself has not been checked, and should be confirmed against the page
    before this node is used as the basis for any external submission.'
- title: On highly composite and similar numbers
  authors:
  - Leonidas Alaoglu
  - Paul Erdos
  type: paper
  id: https://doi.org/10.1090/S0002-9947-1944-0011087-2
  location: Trans. Amer. Math. Soc. 56 (1944), 448-469, at pp. 466-467
  relationship: background
  note: States that neither n! nor lcm(1, ..., n) can be highly abundant infinitely
    often, but gives no proof. That assertion is strictly weaker than the conclusion
    recorded here, which holds for every n >= 89693^2. This node does not depend on
    it. Recorded because it establishes that the result was expected in the literature
    long before the MathOverflow question, so no novelty should be claimed for the
    statement itself.
