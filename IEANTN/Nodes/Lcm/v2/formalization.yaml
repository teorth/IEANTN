# relationship to Palomar's contract.
#
# A conclusion may carry several independent justifications; exactly one is `designated`, and
# only the designated one carries trust or contributes a justification-transport edge.
version: "v0.4"

node:
  id: Lcm.v2
  family: Lcm
  version: v2
  kind: pipeline
  status: active
project:
  name: "The lcm sequence is not highly abundant, with the threshold abstracted"
  description: >-
    The argument of Lcm.v1 with its threshold abstracted: any Dusart-type prime-gap result at a threshold
    X0 admitting a lower bound c >= 5 on log X0 gives that lcm(1..n) fails to be highly abundant for every
    n >= X0^2. Lcm.v1 is the instance at 89693. Stated without imports, so a downstream user supplies
    whichever prime-gap result they have.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N56", "11A25", "11N05"]

conclusions:
- id: lcmUpto_not_highlyAbundant_of_primeGap
  declaration: Lcm.v2.lcmUpto_not_highlyAbundant_of_primeGap
  challenge: Lcm.v2.challenge_lcmUpto_not_highlyAbundant_of_primeGap
  imports: []
  justifications:
  - id: unjustified
    kind: none-yet
    note: >-
      A complete, sorry-free solution now exists at Solutions/Lcm.v2/, generalising Solutions/Lcm.v1/LcmDev.lean.
      It awaits Comparator: the justification stays none-yet until the verification workflow writes a
      receipt, because a justification an author can set is not evidence. Locally the two guarantees Comparator
      checks both hold -- the challenge and the solution declare identical types under pp.all, and the
      solution depends on propext, Classical.choice and Quot.sound alone.
  - id: comparator
    kind: lean-comparator
    note: 'Comparator accepted the solution. Run: https://github.com/teorth/IEANTN/actions/runs/32817004647'
  designated: comparator

  issue: 10
sources:
- title: "Is the least common multiple sequence lcm(1, 2, ..., n) a subset of the highly abundant numbers?"
  authors: ["Jose Damian Espinosa"]
  type: "web discussion"
  id: "https://mathoverflow.net/questions/501066"
  location: "MathOverflow, asked 1 October 2025"
  relationship: formalizes
  contributors:
  - name: "Terence Tao"
    role: >-
      Author of the refutation argument formalized here, given in comments on the question
      dated 2 October 2025.
  note: >-
    The question posed the conjecture {L_n} subset HA; the answer is that it is false for all
    large n. VERIFY BEFORE SUBMISSION: the attribution above is taken from the comment thread,
    where the argument is Tao's. The authorship of the accepted answer post itself has not been
    checked, and should be confirmed against the page before this node is used as the basis for
    any external submission.

- title: "On highly composite and similar numbers"
  authors: ["Leonidas Alaoglu", "Paul Erdos"]
  type: "paper"
  id: "https://doi.org/10.1090/S0002-9947-1944-0011087-2"
  location: "Trans. Amer. Math. Soc. 56 (1944), 448-469, at pp. 466-467"
  relationship: background
  note: >-
    States that neither n! nor lcm(1, ..., n) can be highly abundant infinitely often, but gives
    no proof -- an `asserted` claim in this network's vocabulary, not a `literature` one. That
    assertion is strictly weaker than the conclusion recorded here, which holds for every
    n >= 89693^2. This node does not depend on it. Recorded because it establishes that the
    result was expected in the literature long before the MathOverflow question, so no novelty
    should be claimed for the statement itself.

related_formalizations:
