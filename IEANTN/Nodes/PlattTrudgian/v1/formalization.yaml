project:
  name: "Platt-Trudgian: the Riemann hypothesis is true up to 3 x 10^12"
  description: >-
    A numerical verification that every zero of zeta with imaginary part up to 3 x 10^12 lies on the critical
    line. This is the finite computation the explicit estimates downstream ultimately rest on: FKS takes
    H0 = 3 x 10^12 from here, and everything FKS feeds inherits it.
  authors:
  - Terence Tao
  license: "Apache-2.0"
  responsible_maintainers:
  - Terence Tao

