  notes: >-
    Statement transcribed from FKS's use of the result, which quotes the height as H0 = 3 x 10^12. Not
    read from the paper itself.

limitations:
- >-
  Rests entirely on the cited computation. Nothing downstream of it is unconditional in any stronger sense
  than that computation is correct.
- >-
  The height is recorded as the round 3 x 10^12 that downstream papers quote. A node needing the sharper
  height implied by the first 10^13 zeros should state it separately.
- >-
  No novelty is claimed.
