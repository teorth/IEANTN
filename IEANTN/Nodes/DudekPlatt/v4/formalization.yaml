# Ramanujan's inequality above exp(9401), from Dudek-Platt's own footnote 1 pairing (a = 3130,
# R = 6.315) run through the REPAIRED DudekPlatt.v3 criterion. A variant of v1/v2/v3, not a
# successor -- all four stay. `status: stub` until the solution below is verified.
version: "v0.4"

node:
  id: DudekPlatt.v4
  family: DudekPlatt
  version: v4
  kind: paper
  status: stub

project:
  name: "Ramanujan's inequality at Dudek-Platt's footnote-improved threshold, repaired"
  description: >-
    Ramanujan's inequality pi(x)^2 < (e x / log x) pi(x/e) above exp(9401), from Dudek and Platt's
    own footnote 1 pairing a = 3130, R = 6.315 (Mossinghoff-Trudgian's improved zero-free region), run
    through the REPAIRED DudekPlatt.v3 criterion rather than the paper's own defective Lemma 2.1.
    Strictly stronger than DudekPlatt.v1's exp(9658) and resolves issue #63: the paper's own printed
    threshold is recoverable under the repair once the footnote's sharper parameters are used in place
    of the main text's, with 257 log-units to spare. Unconditional, and resting only on this paper and
    Mossinghoff-Trudgian's, not on any external Lean development.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M26", "11A41"]

conclusions:
- id: ramanujan_inequality_9401
  issue: 63
  declaration: DudekPlatt.v4.ramanujan_inequality_9401
  challenge: DudekPlatt.v4.challenge_ramanujan_inequality_9401
  imports:
  - node: DudekPlatt.v3
    conclusion: criterion
  - node: DudekPlattNumerics.v3
    conclusion: pi_two_sided_footnote
  imports_status: identified
  justifications:
  - id: unjustified
    kind: none-yet
    note: >-
      A COMPLETE SOLUTION EXISTS at Solutions/DudekPlatt.v4, awaiting verification. It is free of
      sorryAx, its axioms are exactly propext, Classical.choice and Quot.sound, and its type matches
      the challenge under `set_option pp.all true`. The justification stays `none-yet` until the
      verification workflow records a receipt -- a justification one can write by hand attests
      nothing.

      Deliberately not `literature`: exp(9401) is not printed anywhere. Dudek and Platt's own footnote
      1 claims exp(9394) at these parameters, but through their UNREPAIRED Lemma 2.1 -- the same
      defect DudekPlatt.v3's docstring documents, which costs real margin (DudekPlatt.v1's own
      main-text parameters lose their printed exp(9658) to it, needing exp(9659) instead). This
      conclusion re-runs the footnote's (a, R) pair through the REPAIRED criterion, which is genuinely
      new work relative to both the footnote (unrepaired) and DudekPlattNumerics.v1 (different
      parameters), which is why it is a separate node rather than an edit to any existing one.

      Both edges are now `identified`. DudekPlatt.v3.criterion is itself Lean-comparator verified
      already (imports none). DudekPlattNumerics.v3.pi_two_sided_footnote supplies M_a = 3250.488,
      m_a = -3010.333 at x_a = exp(9400); the threshold condition the criterion assumes was checked
      in Lean at those constants before this node was written, clearing by approximately 21.06 at
      log x = 9401 -- a large margin compared to DudekPlatt.v2's 0.4989 at its own threshold, and in
      sharp contrast to the SAME condition FAILING by about 0.89 at DudekPlattNumerics.v1's parameters
      at DudekPlatt.v1's printed threshold.
  designated: unjustified

