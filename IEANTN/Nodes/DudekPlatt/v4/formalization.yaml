review:
  status: self-assessed
  notes: >-
    This new node has been checked by its contributing agent and by this repository's mechanical
    checks (core build, separate solution build, pp.all type/axiom comparison, fingerprint/graph/
    closure checks) only; no maintainer or other human review has been recorded for it, and none is
