    numerics node's own note, before writing the solution's Lean proof.

limitations:
- >-
  Proved from its two imports, but not yet verified: a receipt requires a Comparator run, which has
  not been dispatched (external to this change; requires a maintainer's approval of the verification
  environment per SECURITY.md).
- >-
  What it is proved FROM matters more than that it is proved. DudekPlatt.v3.criterion is itself
  Lean-comparator verified. DudekPlattNumerics.v3.pi_two_sided_footnote is `numerical`, but its
  m = -3010.333, M = 3250.488 are independently re-derived over the ENTIRE range x >= exp(9400) from
  Mossinghoff-Trudgian's open-access Corollary 1 via an exact-rational split-integral argument and an
  executable certificate (DudekPlattNumerics.v3's README.md and certificate.py) -- not merely
  asserted by evaluating Dudek-Platt's footnote and eq. (8)-(9) at these parameters and calling the
  omitted [2, x_a] integration range negligible. R = 6.315 itself is traced to (but not yet an edge
  from) Mossinghoff-Trudgian (2015) Section 7 Corollary 1. So exp(9401) rests on Lean plus one
  numerical derivation resting on that paper's authority plus an exact-rational certificate, which is
  a DIFFERENT and arguably stronger evidentiary tier than DudekPlatt.v2's own PNT+-development-based
  numerics import, but is still not as strong as a fully Lean-verified chain.
- >-
  This conclusion is strictly stronger than DudekPlatt.v1.ramanujan_inequality and implies it, since
  exp(9401) < exp(9658) and the claim is monotone in the threshold -- the same relationship
  DudekPlatt.v2's exp(3915) already has to v1. That bridge is now written and compiled by the core
  build (IEANTN/Bridges/DudekPlatt/V4ToV1.lean) and registered as a second, non-designated
  `bridged` justification on v1's own `ramanujan_inequality` (see v1's formalization.yaml); it needed
  no node to be independently verified first, since a bridge relates statements, not trust -- v1 keeps
  its own `literature` citation designated. `Solutions/DudekPlatt.v4/Endpoint.lean` composes this
  node's own solution with that bridge into one reproducible witness for v1's literal exp(9658)
  target. The endpoint-convention caveat already recorded on v2 (strict here, non-strict on v1) applies
  identically and is exactly what the bridge's `exp 9401 < exp 9658` step absorbs.
- >-
  exp(9401) is not a numerically re-optimized endpoint: x_a = exp(9400) was chosen with a safe,
  monotonicity-backed margin above the theta-bound's true crossing point (~9392.86), not as tight as
  possible, and x_0 = e*x_a = exp(9401) is the criterion's own minimum admissible threshold, not
  independently minimized further. A tighter threshold than exp(9401) is very likely obtainable by
  optimizing x_a itself; deliberately not pursued here, since the margin already recovered
  (257 log-units below the issue's exp(9658) target) is large and threshold optimization was
  explicitly out of scope for closing issue #63.
- >-
  No novelty is claimed. The inequality is Ramanujan's, the argument is Dudek and Platt's, the
  improved R is Mossinghoff and Trudgian's, and the repair is the network's own (DudekPlatt.v3).
