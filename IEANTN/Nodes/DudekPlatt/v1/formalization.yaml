# Node metadata for `DudekPlatt.v1`.  See docs/NODES.md.
#
# Ramanujan's inequality with the explicit thresholds Dudek and Platt prove. The paper node:
# it claims what the paper claims and no more. `status: stub` -- conclusions stated, no solution
# intended here.
version: "v0.4"

node:
  id: DudekPlatt.v1
  family: DudekPlatt
  version: v1
  kind: paper
  status: stub

project:
  name: "Dudek-Platt: explicit thresholds for Ramanujan's inequality"
  description: >-
    Ramanujan asserted in his notebooks that pi(x)^2 < (e x / log x) pi(x/e) for sufficiently large x.
    Dudek and Platt make "sufficiently large" explicit twice over: unconditionally the inequality holds
    for x >= exp(9658), and on the Riemann hypothesis the largest integer counterexample is exactly
    38358837682. This node states both, on the paper's authority. The unconditional threshold is the
    paper's own; better ones exist, including one the paper itself names in a footnote and one that
    PrimeNumberTheoremAnd reaches, and those live on DudekPlatt.v2 rather than here.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M26", "11A41"]

conclusions:
- id: ramanujan_inequality
  declaration: DudekPlatt.v1.ramanujan_inequality
  challenge: DudekPlatt.v1.challenge_ramanujan_inequality
  imports:
  - node: DudekPlattNumerics.v1
    conclusion: pi_two_sided_paper
  - node: DudekPlatt.v3
    conclusion: criterion
  imports_status: identified
  justifications:
  - id: dudek-platt-paper
    kind: literature
    source: DudekPlatt
    locator: Theorem 1.2
    note: >-
      Asserted on the authority of the paper, read from the published Exp. Math. version. "Inequality
      (1.1) holds unconditionally for all x >= exp(9658)." The route is the paper's Lemma 2.1 applied to
      the two-sided pi estimate recorded as DudekPlattNumerics.v1.pi_two_sided_paper: at a = 3223 that
      estimate holds above x_a = exp(9656.8), and Lemma 2.1's threshold e*x_a = exp(9657.8) rounds up to
      the exp(9658) printed here. So this conclusion is the composite of a pipeline and a numerical
      input, and both are now edges -- see DudekPlatt.v3 for the pipeline. THE THRESHOLD IS THE PAPER'S
      AND MUST STAY SO. PNT+ proves
      exp(3915) and the paper's own footnote 1 names exp(9394); stating either here would attribute to
      Dudek and Platt a result they did not prove. That is what DudekPlatt.v2 is for.

      ERRATUM IN THE SOURCE, AND IT IS IN THE PROOF OF THIS. Lemma 2.1 as printed does not prove what
      it claims. The paper lower-bounds the left side of Ramanujan's inequality by replacing each
      1/(log x - 1)^(k+1) with the lower bound obtained from truncating
      (1/log^(k+1) x)(1 + 1/log x + 1/log^2 x + ...)^(k+1). For the factorial terms, whose coefficients
      k! are positive, that is valid. For the term carrying m_a it is valid only when m_a >= 0 --
      lower-bounding 1/(log x - 1)^6 and multiplying by a negative m_a bounds that term from ABOVE,
      which is the wrong direction. And m_a is negative in every application; this paper uses
      -3103.33. So the argument as written never uses the branch in which its step is justified. The
      same defect is in the authors' earlier arXiv:1407.1901, where the step is displayed at the end of
      page 3. Reported to the maintainer by David Platt, after a student formalizing a related result
      flagged it.

      The effect is confined to seventh-order terms, so the threshold moves only slightly and this
      statement is believed to stand -- but its stated proof does not establish it. The import of
      DudekPlatt.v3 is the REPAIRED criterion, not the paper's lemma, which is why this conclusion is
      now `identified`: its inputs are all nodes, and one of them is a corrected version of a step the
      source got wrong. The corrected criterion has since been checked at this node's own parameters (see
      limitations): the paper's own printed exp(9658) narrowly fails that specific instantiation, so
      this node's own constant is not currently re-derived from the network at its own parameters,
      though a different (a, R) instantiation recovers a nearby threshold (DudekPlatt.v4). Justifying
      this node means either continuing to cite the paper, or bridging from DudekPlatt.v2, which is
      strictly stronger.
  - id: bridge-from-v4
    kind: bridged
    from: DudekPlatt.v4.ramanujan_inequality_9401
    bridge: IEANTN/Bridges/DudekPlatt/V4ToV1.lean
    note: >-
      A second, independent ground, added for issue #63: DudekPlatt.v4 states the identical inequality
      above the strictly smaller threshold exp(9401) and proves it (Solutions/DudekPlatt.v4) from the
      REPAIRED DudekPlatt.v3.criterion and DudekPlattNumerics.v3.pi_two_sided_footnote alone -- no
      dependence on the paper's own defective Lemma 2.1 as printed, and no numerical certificate in the
      bridge itself. Since exp(9401) < exp(9658) and the inequality is monotone in the threshold, `.v4`'s
      conclusion implies this one pointwise; the bridge is exactly that one-line monotonicity argument,
      compiled by the core build. `Solutions/DudekPlatt.v4/Endpoint.lean` composes `.v4`'s own solution
      with this bridge into a single reproducible witness for the literal exp(9658) target, an ordinary
      `lake build` in that project alone. Not designated: `.v4`'s own designated justification is itself
      still `none-yet` (awaiting a Comparator receipt, per SECURITY.md), so promoting this bridge would
      trade a `literature` ground for one not yet verified at all; this entry records that the
      independent route exists and is machine-checked to imply this exact statement, matching `.v2`'s
      own (still unregistered) relationship to this node.
  designated: dudek-platt-paper
- id: largest_counterexample_on_rh
  declaration: DudekPlatt.v1.largest_counterexample_on_rh
  challenge: DudekPlatt.v1.challenge_largest_counterexample_on_rh
  imports: []
  imports_status: traced
  justifications:
  - id: dudek-platt-paper
    kind: literature
    source: DudekPlatt
    locator: Theorem 1.3
    note: >-
      Asserted on the authority of the paper. "Assuming the Riemann hypothesis, the largest integer
      counterexample to inequality (1.1) is at x = 38358837682." Stated SHARPLY, as the paper states it:
      the inequality fails there and holds at every larger integer. Weakening it to "holds for
      x > 38358837682" would discard the paper's actual result, which is that this is the last failure.
      The hypothesis is RiemannHypothesis itself, not RiemannHypothesisUpTo: the paper leans on
      Schoenfeld's conditional bound |pi(x) - li(x)| < sqrt(x) log(x) / (8 pi) for x >= 2657, which needs
      the full hypothesis, so a verification node supplying a finite height does NOT discharge this.
      `traced` because that Schoenfeld bound, and the numerical search over the remaining range, are
      known inputs that are not yet nodes.
  designated: dudek-platt-paper

sources:
- title: "On solving a curious inequality of Ramanujan"
  authors: ["Adrian W. Dudek", "David J. Platt"]
  type: "paper"
  id: "https://doi.org/10.1080/10586458.2014.990118"
  location: "Exp. Math. 24 (2015), no. 3, 289-294"
  relationship: formalizes
  note: >-
