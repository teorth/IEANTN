review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    Both theorems read from the published Exp. Math. version. Checking them mattered: PrimeNumberTheoremAnd
    proves the inequality above exp(3915), and a node citing Dudek and Platt for that would have been
    wrong -- their Theorem 1.2 gives exp(9658). The two thresholds are now separate nodes for that
    reason. The sharpness of Theorem 1.3 was likewise read from the paper rather than inferred.

limitations:
- >-
  Both conclusions rest on the cited paper; neither is proved in Lean here, and anything downstream
  inherits that.
- >-
  The unconditional threshold exp(9658) is not the best known and is not meant to be. The paper's own
  footnote 1 names exp(9394) using Mossinghoff-Trudgian's improved R, and PrimeNumberTheoremAnd reaches
  exp(3915). Neither belongs on this node.
- >-
  THE PAPER'S PROOF OF THEOREM 1.2 HAS A DEFECT, AND THE PRINTED THRESHOLD DOES NOT SURVIVE IT AT THE
  PAPER'S OWN PARAMETERS. The defect is in Lemma 2.1, which bounds the term carrying the lower-bound
  constant m_a in the wrong direction whenever m_a is negative -- always, in practice. See the
  conclusion's note, and DudekPlatt.v3 for the repaired criterion.

  The recomputation has now been done, in Lean, by norm_num on exact rationals. At the paper's own
  M_a = 3343.48, m_a = -3103.33 and x_a = exp(9656.8), the repaired threshold condition
  eUpper M_a x - eNeg m_a x_a x < log x FAILS at log x = 9658 (short by about 0.887) and also FAILS
  strictly inside the range this node's own threshold would need, at log x = 9658.001 (short by about
  0.886) -- so the shortfall is not an artifact of the closed-vs-open endpoint convention, and HOLDS at
  log x = 9659. The arithmetic is that the repair multiplies m_a by (1 + 1/log x_a)^6 = 1.000621...,
  costing 1.9287 in the gap, where the paper had only 9657.8 - 9656.96 = 0.84 of margin.

  Consequently, at this node's own fixed parameters, the direct criterion side condition
  eUpper M_a x - eNeg m_a x_a x < log x FAILS when instantiated with DudekPlattNumerics.v1.pi_two_sided_paper
  together with DudekPlatt.v3.criterion at log x = 9658 -- i.e. this fixed-parameter instantiation of
  this node's own designated import route does not close at log x = 9658 -- while the same side
  condition HOLDS at log x = 9659. This is failure of one sufficient-condition instantiation, not a
  proof that exp(9658) is logically nonderivable by any other route from those two facts, and it does
  not make Theorem 1.2 false -- the inequality is believed true far below either threshold. What is
  certain is that THIS SPECIFIC route (v1's own a = 3223, R = 6.455 via DudekPlattNumerics.v1) does not
  quite close at these fixed parameters, which is why this node's designated justification stays
  `literature` rather than switching to a network derivation: citing the paper directly remains the
  accurate, and only fully Lean-independent, way to state Theorem 1.2 itself.

  UPDATE (issue #63): "nobody has tried" re-optimising is no longer accurate; two routes have now
  been explored, and they have DIFFERENT outcomes -- the point of this update is to keep them
  distinct, not to blur a failure and a success into one verdict. Re-optimising the choice a = 3223
  ALONE, still at the paper's own un-improved R = 6.455 (Route A), turns out to be genuinely close to
  the boundary either way -- a quick numerical exploration puts the best achievable threshold within
  roughly one unit of log x = 9658 on either side, depending on exactly how much safety margin is
  taken above the underlying theta-bound's crossing point, which is far too thin a margin to call
  without the same exact-rational rigor DudekPlatt.v4 was held to. Neither a success nor a failure is
  asserted for Route A here; it is left unresolved because settling it is not needed and a sampled or
  margin-sensitive numeric check is not evidence either way.

  What DOES cleanly work, verified with about 257 log-units to spare rather than one (Route B), is
  re-deriving m_a, M_a at the paper's OWN footnote 1 parameters (a = 3130, using Mossinghoff-Trudgian's
  improved R = 6.315 in place of R = 6.455) and running them through the REPAIRED
  DudekPlatt.v3.criterion instead of the paper's own defective Lemma 2.1: see DudekPlattNumerics.v3
  (whose README.md and certificate.py now carry the full exact-rational derivation, not merely an
  evaluated formula) and DudekPlatt.v4, which recovers exp(9401), comfortably below both exp(9658) and
  exp(9659). That is a DIFFERENT route from this node's own (different parameters, different R, and
  Corollary 1 rather than eq. (8)-(9) as the certified theta input) and a DIFFERENT, weaker evidentiary
  tier than a Lean-comparator receipt: a locally checked conditional Lean implication
  (DudekPlatt.v3.criterion together with DudekPlattNumerics.v3.pi_two_sided_footnote) resting on a
  documented numerical/literature input, not yet Comparator-verified (DudekPlatt.v4's own
  justification stays `none-yet`). It is a materially different computation from the footnote's own
  (unrepaired) exp(9394), for the same reason DudekPlatt.v3 exists at all, and it answers issue #63's
  underlying question -- exp(9658) IS recoverable under the repaired criterion, by this different
  route -- without changing what this node itself states or how it is justified.
- >-
  Theorem 1.3 needs the full Riemann hypothesis, not a partial verification. This is the first
  conclusion in the network with that hypothesis, and it does not compose with the verification nodes.
- >-
  No novelty is claimed. The results are Dudek and Platt's, and the inequality is Ramanujan's.
