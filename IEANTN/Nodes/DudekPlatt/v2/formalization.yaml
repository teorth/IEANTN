review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    The threshold exp(3915) was read from PrimeNumberTheoremAnd's Ramanujan.lean, where xa is exp 3914
    and exa is exp 1 * xa; the statement shape was matched to this repository's Vocabulary rather than
    transcribed from PNT+'s. The claim that exp(3915) is not Dudek and Platt's was checked against the
    published paper directly: their Theorem 1.2 reads exp(9658).

limitations:
- >-
  Proved from its two imports, but not yet verified: a receipt requires a Comparator run.
- >-
  What it is proved FROM matters more than that it is proved. The step from
  DudekPlatt.v3.criterion and DudekPlattNumerics.v2.pi_two_sided_pnt to this conclusion is Lean; the
  criterion is itself verified; but pi_two_sided_pnt is ASSERTED on PrimeNumberTheoremAnd's authority,
  and PNT+ is a Lean development with sorries and native_decide in its closure rather than a peer
  reviewed paper. So exp(3915) will rest on Lean plus one assertion of that particular kind, which is
  weaker than resting on a citation and should not be mistaken for stronger because the word "Lean"
  appears in it.
- >-
  The threshold condition the criterion assumes clears by only about 0.4989 at log x = 3915. The
  solution proves it with a deliberately crude bound that reaches 3914.663, leaving 0.337. Any later
  loosening of DudekPlattNumerics.v2's constants, including via an `IEANTN.margin` index, would need
  that proof rechecked rather than merely rebuilt.
- >-
  This conclusion is strictly stronger than DudekPlatt.v1.ramanujan_inequality and implies it, since
  exp(3915) < exp(9658) and the claim is monotone in the threshold. A bridge recording that implication
  is worth writing once either node is justified -- but note the endpoint conventions differ, strict
  here and non-strict there, so it is not quite a one-liner.
- >-
  This node is the better place to attach evidence than DudekPlatt.v1, and deliberately so. The paper's
  proof of its own Theorem 1.2 has a defect -- see DudekPlatt.v1's note -- whereas PNT+'s route to
  exp(3915) goes through the repaired criterion. So the sound order of work is to justify THIS node and
  bridge down to v1, rather than the reverse.
- >-
  No novelty is claimed. The inequality is Ramanujan's and the argument is Dudek and Platt's.
