automation:
  methods:
  - method: agent
    role: >-
      Done with the help of AI tools, under the direction of the author: branched this version from
      FKS.v2 with its two statements unchanged, wrote the assembly in Solutions/FKS.v3 from the
      author's earlier proof of the range [2, e^2100] (posted on issue #52), and checked it against
      the core in the two ways Comparator does (type under pp.all, axioms). Comparator itself does
      not run on Windows and has not been run.

review:
  status: self-assessed
  reviewers: ["Marcos Adriano"]
  notes: >-
    The two statements are FKS.v2's, unchanged; their fingerprints match. The solution was compiled
    against the core at 301159d with `lake env lean`, as a file rather than as its own Lake project,
    which would fetch a second copy of Mathlib. Checked there: the type of each compared theorem is
    identical to the challenge's under pp.all, the axioms are the three permitted ones, and
    sabotaged variants are rejected (see the author's notes). The locators, constants and table
    rows were read from the LaTeX source of arXiv v2 and v3; the published version was not
    consulted for this version.

limitations:
- >-
  The assembly is only as good as its three imports: BKLNW's Table 8 (asserted numerics), the
  Lemma 5.3 interpolation (an asserted computation) and Theorem 1.2 at one row of its table
  (asserted, and provisionally placed on FKSNumerics.v1).
- >-
  Neither numerical import has room for a margin above 0: 121.096 is itself the largest entry of
  the Lemma 5.3 table, and 121.096 / 121.0360 = 1.0005 is less than margin 1 = 1.001.
- >-
  The solution has not been through Comparator, and the justification stays none-yet until it has.
- >-
  R = 5.5666305 is not this paper's constant but Mossinghoff and Trudgian's, J. Number Theory 157
  (2015). A sharper value is available from MTY.v1 and is the first thing to change when the chain
  is re-run.
- >-
  No novelty is claimed. The results are Fiori, Kadiri and Swidinsky's; the assembly only avoids
  Lemma 5.2.
