# Node metadata for `FKS.v3`.  See docs/NODES.md.
#
# FKS.v2's two conclusions, word for word, assembled rather than cited: Solutions/FKS.v3 proves
# them from BKLNW's Table 8, FKSNumerics.v1's two claims and Mathlib, following the ranges of the
# paper's proof of Corollary 1.4 and avoiding its Lemma 5.2. `status: awaiting-verification`: the
# solution is complete (no sorry, only the three permitted axioms, its type matching the challenge
# under pp.all) but has no Comparator receipt.
version: "v0.4"

node:
  id: FKS.v3
  family: FKS
  version: v3
  kind: paper
  status: awaiting-verification

project:
  name: "Fiori-Kadiri-Swidinsky: sharper bounds for the Chebyshev function psi(x)"
  description: >-
    Explicit bounds on psi(x) - x, obtained from a zero-free region and a zero density estimate for
    the Riemann zeta function together with a numerical verification of the Riemann hypothesis to a
    finite height. This version states FKS.v2's two conclusions unchanged and assembles them in
    Lean from the ranges of the paper's own proof: Mathlib below e^40, BKLNW's Table 8 up to
    e^2100, and FKSNumerics.v1's two claims above that. The all-x bound follows from the classical
    one by the rescaling the paper's proof of Lemma 5.3 performs.
  authors: ["Marcos Adriano", "Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M06", "11Y35"]

conclusions:
- id: psi_bound_all_x
  issue: 52
  declaration: FKS.v3.psi_bound_all_x
  challenge: FKS.v3.challenge_psi_bound_all_x
  imports:
  - node: BKLNW.v1
    conclusion: table8_psi_bound_above
  - node: FKSNumerics.v1
    conclusion: psi_classical_mid_range
  - node: FKSNumerics.v1
    conclusion: psi_classical_above_e200000
  imports_status: identified
  justifications:
  - id: unjustified
    kind: none-yet
    note: >-
      A COMPLETE SOLUTION EXISTS at Solutions/FKS.v3, awaiting verification. It is free of sorryAx,
      its axioms are exactly propext, Classical.choice and Quot.sound, and its type matches the
      challenge under `set_option pp.all true`. The justification stays `none-yet` until the
      verification workflow records a receipt, as for DudekPlattNumerics.v4.

      The solution derives this conclusion from psi_classical_bound by the arithmetic of
      IEANTN.Bridges.FKS.ClassicalToAllX (121.096 < 9.22022 R^{3/2} and 0.8476836 sqrt(R) <= 2),
      the direction the paper's proof of Lemma 5.3 runs; its imports are therefore those of
      psi_classical_bound.
  designated: unjustified
- id: psi_classical_bound
  issue: 52
  declaration: FKS.v3.psi_classical_bound
  challenge: FKS.v3.challenge_psi_classical_bound
  imports:
  - node: BKLNW.v1
    conclusion: table8_psi_bound_above
  - node: FKSNumerics.v1
    conclusion: psi_classical_mid_range
  - node: FKSNumerics.v1
    conclusion: psi_classical_above_e200000
  imports_status: identified
  justifications:
  - id: unjustified
    kind: none-yet
    note: >-
      A COMPLETE SOLUTION EXISTS at Solutions/FKS.v3, awaiting verification. It is free of sorryAx,
      its axioms are exactly propext, Classical.choice and Quot.sound, and its type matches the
      challenge under `set_option pp.all true`. The justification stays `none-yet` until the
      verification workflow records a receipt, as for DudekPlattNumerics.v4.

      The assembly, range by range. On [2, e^40], Mathlib's Chebyshev.psi_le gives E_psi(x) <= 2
      and the right-hand side stays above 2 (IEANTN.Bridges.FKS.ThresholdTwo up to e^30, one more
      piece to e^40). On [e^40, e^2100], the rows (40, 1.93378e-8) and (1000, 1.94751e-12) of
      BKLNW.v1.table8, the two rows the proof of Lemma 5.2 uses; the right-hand side is bounded
      below piecewise in s = sqrt(log x / R), with the tightest piece clearing 1.94751e-12 by a
      factor of 2.9. On [e^2100, e^200000], FKSNumerics.v1.psi_classical_mid_range. Above
      e^200000, FKSNumerics.v1.psi_classical_above_e200000, with 121.0360 <= 121.096. Both
      numerical imports are consumed at margin 0, which is the only depth the constants allow.

      Every input is an edge, so identified. The paper's own proof of Corollary 1.4 covers
      log x <= 2100 with Lemma 5.2, false as printed for 1 < x < 2.2901308748...; the assembly
      does not use it.
  designated: unjustified

