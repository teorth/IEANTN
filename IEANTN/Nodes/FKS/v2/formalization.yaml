# Node metadata for `FKS.v2`.  See docs/NODES.md.
version: "v0.4"

node:
  id: FKS.v2
  family: FKS
  version: v2
  kind: paper
  status: awaiting-solution

project:
  name: "Fiori-Kadiri-Swidinsky: sharper bounds for the Chebyshev function psi(x)"
  description: >-
    Explicit bounds on `psi(x) - x`, obtained from a zero-free region and a zero density estimate
    for the Riemann zeta function together with a numerical verification of the Riemann hypothesis
    to a finite height. This version states the admissible classical bound on `E_psi` from the
    paper's own threshold `x = 2` rather than from `exp(30)`, and obtains the all-`x` bound from it
    by the rescaling the paper's own proof performs, so that the node rests on one citation rather
    than two. Both are bridged from `FKS.v1` in Lean.
  authors: ["Marcos Adriano", "Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M06", "11Y35"]

conclusions:
- id: psi_bound_all_x
  declaration: FKS.v2.psi_bound_all_x
  challenge: FKS.v2.challenge_psi_bound_all_x
  imports:
  - node: KLN.v1
    conclusion: subconvexity_bound
  - node: MT.v1
    conclusion: zero_free_region_sharpened
  - node: PlattTrudgian.v1
    conclusion: rh_up_to
  imports_status: traced
  justifications:
  - id: rescaled-from-classical
    kind: bridged
    from: FKS.v1.psi_classical_bound
    bridge: IEANTN/Bridges/FKS/ClassicalToAllX.lean
    note: >-
      Not a second citation. Where the paper uses the classical form, it derives the all-x bound FROM
      it: the proof of Lemma 5.3, the step of the proof of Corollary 1.4 that covers 2100 < log x <=
      200000, ends "We now simply verify that 121.096/5.5666305^(3/2) < 9.22022 to complete the
      result." The bridge carries out that rescaling in Lean from FKS.v1.psi_classical_bound, using
      Mathlib and ThresholdTwo.lean and nothing else, and is compiled by the core build. What it
      needs is 121.096 < 9.22022 R^(3/2) and 0.8476836 sqrt(R) <= 2 -- the two inequalities
      FKS.v1.rescaled_A_exceeds_printed and FKS.v1.rescaled_C_is_short_of_two record, read in the
      direction that closes. No margin index is involved. FKS.v1's own note observes that the
      converse rescaling fails; that is true and is the other direction.
  designated: rescaled-from-classical
- id: psi_classical_bound
  declaration: FKS.v2.psi_classical_bound
  challenge: FKS.v2.challenge_psi_classical_bound
  imports:
  - node: KLN.v1
    conclusion: subconvexity_bound
  - node: MT.v1
    conclusion: zero_free_region_sharpened
  - node: PlattTrudgian.v1
    conclusion: rh_up_to
  imports_status: traced
  justifications:
  - id: threshold-from-v1
    kind: bridged
    from: FKS.v1.psi_classical_bound
    bridge: IEANTN/Bridges/FKS/ThresholdTwo.lean
    note: >-
      The same bound as FKS.v1.psi_classical_bound at the paper's own threshold x0 = 2 rather than
      the x0 = exp(30) that FKS2 quotes. The two are equivalent: x0 = 2 gives x0 = exp(30) at once,
      and the bridge proves the converse from Mathlib alone. On [2, exp(30)] the right-hand side
      never falls below 2.627..., its minimum at x = 2, while Mathlib's Chebyshev.psi_le already
      gives E_psi(x) <= 2 -- the argument FKS2 itself makes for E_theta right after quoting the
      bound. The bridge is compiled by the core build, so it cannot silently stop being a proof.
      The underlying bound remains the paper's; this transports it, it does not establish it.
  designated: threshold-from-v1

