automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Restated FKS.v1's two conclusions at the published threshold and wrote the two bridges, under
      the direction of the maintainer. Both bridges were checked against the published paper and
      recompiled here; the numbering, the constants and the falsity of Lemma 5.2 as printed were
      verified against the published version and the arXiv preprint. No proof of the underlying
      bound is claimed: the bridges transport FKS.v1's citation, they do not replace it.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    Bibliographic details taken from blueprint/src/references.bib in PrimeNumberTheoremAnd
    rather than from the printed paper. The published JMAA version is now held in the library;
    verify them against it before this node is cited externally or used as the basis for a
    submission. That check would also settle the numbering discrepancy noted below.

limitations:
- >-
  Both conclusions rest on the cited paper; neither is proved in Lean here.
- >-
  The preprint (arXiv:2204.02588v2) numbers the all-x bound as Corollary 1.4; that is now checked
  against the rendered preprint. The second conclusion's locator remains FKS2's "[8, Corollary 1.3]"
  for the published numbering, which the preprint does not use.
- >-
  psi_classical_bound is not derivable from psi_bound_all_x by rescaling at R = 5.5666305. The two
  new conclusions record the A and C gaps as claims.
- >-
  R = 5.5666305 is not this paper's constant but Mossinghoff and Trudgian's, J. Number Theory 157 (2015).
  A sharper value is available from MTY.v1 and is the first thing to change when the chain is re-run.
- >-
  No novelty is claimed. The results are Fiori, Kadiri and Swidinsky's.
