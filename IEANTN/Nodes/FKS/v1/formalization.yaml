      1.3]. The arXiv preprint numbers its results differently -- its Corollary 1.3 is a remark -- and
      tabulates A(x0) only for log x0 > 1000, so the value at e^30 could not be checked against the version
      to hand. CONFIRM the locator and the constant against the published J. Math. Anal. Appl. version
      before relying on this. Imports: Settled against the published version (J. Math. Anal. Appl. 527
      (2023) 127426). FKS names three inputs: the verification height H0 = 3 x 10^12 from Platt and Trudgian,
      the zero-free region R = 5.5666305 from Mossinghoff and Trudgian, and a zero-density bound for N-tilde(sigma,
      T) of the shape (2.6) from Kadiri, Lumley and Ng [18], the published J. Math. Anal. Appl. 465 (2018)
      paper that KLN.v1 records. The first two are recorded as edges. The third is now recorded too, at
      the point where the error FKS reports actually bites: KLN.v1 states the subconvexity bound of its
      Lemma 3.2 with FKS's corrected constant 0.77 rather than the printed 0.63, which is the value FKS
      itself uses. KLN's Theorem 1.1 and its numerical density tables remain unstated, because their constants
      were computed with the erroneous value and nobody has published recomputed ones. FKS's other Kadiri-Lumley-Ng
      reference [19], the unpublished preprint 'Bounding psi(x) with zero-density', is NOT an input: Lemma
      2.5, the sums-over-zeros estimate, is proved in FKS itself and the preprint is cited as attribution.
      It is background, not an edge. Absolute values, checked against the rendered page. FKS (1.1) defines
      E_psi(x) = |(psi(x) - x)/x| and FKS2 (1) and (2) define E_pi, E_theta and E_psi the same way, all
      with bars, exactly as this network's Vocabulary does. An earlier note here claimed the papers defined
      these signed and that the conclusions were therefore stronger than the printed corollaries; that
      was wrong. PDF text extraction silently drops absolute-value bars around a displayed fraction, and
      the definitions were read from extracted text. They have since been read from the rendered page,
