limitations:
- "RH up to height 1894438.5122 remains an explicit premise of every conclusion."
- >-
  The paper's own inputs (Rosser-Schoenfeld 1975 and Schoenfeld's finite computations) are traced
  in the notes but are not edges.
- >-
  The thresholds 161971 in (5.5a*) and 89909 in (5.5b*) are transcribed as printed; they are not
  sharp: an exact interval computation of psi (the RSBounds walk data, outside Lean) shows that
  both inequalities already hold from x >= 70841.
- "No novelty is claimed."
