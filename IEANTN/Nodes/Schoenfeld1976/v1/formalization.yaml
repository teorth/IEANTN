project:
  name: "Schoenfeld: sharper bounds for the Chebyshev functions theta(x) and psi(x), II"
  description: >-
    Theorem 11 (|psi(x) - x| and |theta(x) - x| below x eps0(x), with Schoenfeld's exponentially small
    eps0) and the five displays of Theorem 7* (bounds of the form c x / log x), each with its
    published threshold, from Schoenfeld's 1976 paper. Every conclusion assumes the Riemann hypothesis
    up to 1894438.5122, the height A = 1894438.51224... of Rosser-Schoenfeld (1975) rounded down,
    as an explicit premise.
  authors: ["Harald Helfgott"]
  license: "Apache-2.0"
  responsible_maintainers: ["Harald Helfgott"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M26"]

conclusions:
- id: psi_theorem_11
  declaration: Schoenfeld1976.v1.psi_theorem_11
  challenge: Schoenfeld1976.v1.challenge_psi_theorem_11
  imports: []
  imports_status: traced
  justifications:
  - id: schoenfeld-paper
    kind: literature
    source: Schoenfeld1976
    locator: "Theorem 11, (7.2), printed p. 342"
    note: >-
      Asserted on the authority of the paper. Schoenfeld's proof rests on Rosser-Schoenfeld (1975)
      (their zero-free region with R = 9.645908801 and their table of psi bounds), on the Riemann
      hypothesis up to the height A = 1894438.51224... of that paper (here the premise), and on his
      own finite computations of theta and psi. Two of these inputs are nodes: the zero-free region
      is RosserSchoenfeld.v1.zero_free_region, and the row b = 23 of the psi table is
      RosserSchoenfeld.v2.psi_error_b23. Neither is imported, deliberately: imports become
      hypotheses of the challenge, and the conclusion as stated does not need them (the standalone
      Lean proof described below assumes neither). Transcribed from the scan and rechecked on
      2026-11-07. A standalone Lean 4.35 proof exists (RSBounds, Schoenfeld1976Final): it assumes
      only RiemannHypothesisUpTo's counterpart at the same height, but replaces the paper's finite
      computations by a kernel-checked walk below 1.35e6 and by the certification |psi(x) - x| <=
      (4/5) sqrt(x) for 1500 <= x <= 1e10. It is not integrated here and has no IEANTN receipt.
  designated: schoenfeld-paper
