sources:
- title: Approximate formulas for some functions of prime numbers
  authors:
  - J. Barkley Rosser
  - Lowell Schoenfeld
  type: paper
  id: https://doi.org/10.1215/ijm/1255631807
  location: Illinois Journal of Mathematics 6(1) (1962), 64-94
  relationship: formalizes
  note: Rendered original pp. 64, 71 and 77 checked against the Lean statements. The paper defines psi
    and theta with inclusive upper endpoints, as does Mathlib. The maximum is non-strict without uniqueness;
    (3.36) and (5.4) are strict on x > 0. Theorem 25 includes x = 1 and has theta <= psi with a strict
    upper bound. All displayed decimals are exact rationals; its logarithmic constant is not rounded.
