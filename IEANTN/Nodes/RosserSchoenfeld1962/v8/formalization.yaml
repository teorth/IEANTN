limitations:
- >-
  Only (3.19) is represented; the Corollary's upper bound (3.20) and Theorem 5's (3.17),
  (3.18), which involve Mertens' constant B, are not.
- >-
  The same historical statement is proved by a different, elementary formal proof; no
  mathematical novelty is claimed.
