project:
  name: "Rosser-Schoenfeld 1962: equation (3.19), the Corollary to Theorem 5"
  description: >-
    Equation (3.19): log log x < sum_{p <= x} 1/p for every real x > 1. The solution is an
    elementary Lean proof (Legendre's bound on v_p(N!), discrete partial summation, and one
    kernel-checked numerical inequality plus a kernel-checked finite range), not a port of
    the paper's route through Theorem 5. The Corollary's other inequality (3.20) is outside
    this node's scope.
  authors: ["Devon Wright"]
  license: "Apache-2.0"
  responsible_maintainers: ["Devon Wright"]

repository:
  role: substantive-development

