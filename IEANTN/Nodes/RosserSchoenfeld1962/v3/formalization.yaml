project:
  name: 'Rosser-Schoenfeld 1962: equation (3.8) in Corollary 3'
  description: 'Equation (3.8) of Corollary 3: 3x/(5 log x) < pi(2x)-pi(x) for every real x >= 41/2. An
    unconditional Lean proof combines kernel-checked prime witnesses below 4096 with elementary weighted
    factorial estimates, Mathlib''s Costa-Pereira inequality, and the unchanged proved equation-(3.35)
    library from v1.'
