project:
  name: "Rosser-Schoenfeld 1962: equation (3.35) in Theorem 12"
  description: >-
    Equation (3.35) of Theorem 12: psi(x) < 1.03883 x for every positive real x.
    The solution is a port of the completed PNT+ formalization at commit 81eca5a,
    retaining its kernel-checked finite certificate through 500000 and weighted-factorial
    recurrence. The theorem's separate maximum-at-113 assertion is outside this node's scope.
  authors: ["Akula"]
