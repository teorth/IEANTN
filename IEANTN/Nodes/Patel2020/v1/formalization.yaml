project:
  name: "Patel: an explicit bound for |zeta(1+it)|, and the corrected Cheng-Graham lemmas"
  description: >-
    Patel's explicit bound for |zeta(1+it)|, and the corrected forms of Cheng-Graham Lemmas 2 and 3
    printed in the same paper. ChengGraham2004.v1 states nothing because those lemmas are wrong;
    this node is where the corrections live.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11M06", "11L07"]

conclusions:
- id: zeta_one_bound
  declaration: Patel2020.v1.zeta_one_bound
  challenge: Patel2020.v1.challenge_zeta_one_bound
  imports: []
  imports_status: traced
  justifications:
  - id: patel-zeta
    kind: literature
    source: Patel2020
    locator: Theorem maintheorem
    note: >-
      Read from arXiv:2009.00769, mainbound.tex, Theorem maintheorem. For t >= 3,
      |zeta(1+it)| <= min(log t, (1/2) log t + 1.93, (1/5) log t + 44.02). Asserted on the paper's
      authority. The proof uses exponential-sum estimates, including the corrected Cheng-Graham
      lemmas stated beside it; those are separate conclusions rather than hidden hypotheses.
  designated: patel-zeta
- id: cheng_graham_lemma_2
  declaration: Patel2020.v1.cheng_graham_lemma_2
  challenge: Patel2020.v1.challenge_cheng_graham_lemma_2
  imports: []
  imports_status: traced
  justifications:
  - id: patel-lemma-2
    kind: literature
    source: Patel2020
    locator: Section 2, the corrected form of Cheng-Graham Lemma 2
    note: >-
      Read from the same source. If f is continuously differentiable on (a, b], f' is monotonic,
      and the distance from f' to the integers is at least 1/U, then the exponential sum over
      integers n in (a, b] is at most (2/pi) U. The preprint attributes the shape to Kuzmin-Landau
      and records that 2/pi is best possible (Landau). Asserted on Patel's authority, not on
      Cheng-Graham's, because the lemma being corrected is the erroneous one.
  designated: patel-lemma-2
- id: cheng_graham_lemma_3
  declaration: Patel2020.v1.cheng_graham_lemma_3
  challenge: Patel2020.v1.challenge_cheng_graham_lemma_3
  imports: []
  imports_status: traced
  justifications:
  - id: patel-lemma-3
    kind: literature
    source: Patel2020
    locator: Section 2, the corrected form of Cheng-Graham Lemma 3
    note: >-
      Read from the same source. Under 1/W <= |f''| <= 1/V on [N+1, N+L], with V < W and W > 1,
      the exponential sum is at most 2 (L/V + 2) (2 sqrt(W/pi) + 1). Patel records that the
      leading term of the incorrect lemma is off by a factor of sqrt(2). The Platt-Trudgian
      sharpening printed immediately afterwards is a different bound and is not this conclusion.
  designated: patel-lemma-3

