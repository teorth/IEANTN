limitations:
- >-
  The corrected third-derivative test in the same section is not stated. In the formula for
  alpha_3 the preprint writes 32 lambda once and lambda_3 elsewhere, and lambda is never defined.
- >-
  The sum in the corrected Lemma 2 is taken over integers n with floor(a)+1 <= n <= floor(b),
  which is n in (a, b] when a and b are real. A non-integral endpoint convention different from
  that would be a different sum.
- >-
  No novelty is claimed. The results are the cited author's, correcting Cheng and Graham.
