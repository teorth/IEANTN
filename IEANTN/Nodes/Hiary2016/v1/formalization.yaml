      paper, Hiary obtained |zeta(1/2+it)| <= 0.63 t^(1/6) log t at the time. ... With the correction
      provided in Lemma [derivative3test], the estimate obtained by Hiary now becomes |zeta(1/2+it)| <=
      0.77 t^(1/6) log t.' So 0.77 is confirmed against the paper that argues it, not merely against FKS's
      report of it. Patel's Section 2 also says more than FKS did: the flaw is in Cheng-Graham's LEMMAS
