version: "v0.4"

node:
  id: Hiary2016.v1
  family: Hiary2016
  version: v1
  kind: paper
  status: stub
project:
  name: 'Hiary: an explicit van der Corput estimate for zeta on the critical line'
  description: >-
    The explicit subconvexity bound |zeta(1/2 + it)| <= a_1 t^(1/6) log t that KLN's Lemma 3.2 quotes
    and the FKS chain ultimately consumes. Stated with the corrected constant 0.77 rather than the printed
    0.63, for the reason KLN.v1 states it: the printed value depends on an erroneous explicit van der
    Corput test.
  authors:
  - Terence Tao
  license: Apache-2.0
  responsible_maintainers:
  - Terence Tao

repository:
  role: substantive-development

classification:
  arxiv:
  - math.NT
  msc2020:
  - 11M06
  - 11Y35

conclusions:
- id: zeta_half_line_bound
  declaration: Hiary2016.v1.zeta_half_line_bound
  challenge: Hiary2016.v1.challenge_zeta_half_line_bound
  imports: []
  imports_status: traced
  justifications:
  - id: hiary-paper
    kind: literature
    source: Hiary2016
    locator: Theorem 1.1, the t >= 3 half, with the constant corrected from 0.63 to 0.77
    note: >-
      Asserted on the authority of the paper, with the correction. Read from the arXiv LaTeX source: Theorem
      1.1 reads 'If 0 <= t <= 3, then |zeta(1/2+it)| <= 1.461. If t >= 3, then |zeta(1/2+it)| <= 0.63
      t^(1/6) log t'. The 0.63 depends on an erroneous explicit van der Corput second-derivative test
      of Cheng and Graham; FKS records that 'after accounting for this correction, the constant, a_1,
      changes to 0.77' and computes its own tables with 0.77. Stating 0.63 would put a knowably wrong
      value in the network. Imports: traced but not yet edges. The bound rests on Cheng-Graham, Explicit
      Estimates for the Riemann Zeta Function, Rocky Mountain J. Math. 34 (2004), 1261-1280 -- held, no
      node -- in the corrected form documented in D. Patel, An Explicit Upper Bound for |zeta(1 + it)|,
      Indag. Math. (N.S.) 33 (2022), no. 5, 1012-1032, Footnote 3, which is not held. Until the corrected
      test is a conclusion this stays undetermined: the input could be an edge and is not one yet. 
  designated: hiary-paper
sources:
- title: An explicit van der Corput estimate for zeta(1/2 + it)
  authors:
  - Ghaith A. Hiary
  type: paper
  id: arXiv:1507.01261; Int. J. Number Theory 12 (2016)
  location: International Journal of Number Theory; arXiv:1507.01261
  relationship: formalizes
  note: >-
    arXiv LaTeX source held and read. The constant stated in this node is corrected relative to the paper;
    see the conclusion's note.
automation:
  methods:
