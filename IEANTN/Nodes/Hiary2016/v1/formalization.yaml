    locator: Theorem 1.1, the t >= 3 half, with the constant corrected from 0.63 to 0.77
    note: >-
      Asserted on the authority of the paper, with the correction. Read from the arXiv LaTeX source: Theorem
      1.1 reads 'If 0 <= t <= 3, then |zeta(1/2+it)| <= 1.461. If t >= 3, then |zeta(1/2+it)| <= 0.63
      t^(1/6) log t'. The 0.63 depends on an erroneous explicit van der Corput second-derivative test
      of Cheng and Graham; FKS records that 'after accounting for this correction, the constant, a_1,
      changes to 0.77' and computes its own tables with 0.77. Stating 0.63 would put a knowably wrong
      value in the network. Imports, traced from the paper's own LaTeX source rather than from FKS's characterisation
      of it, and the two agree exactly. Hiary's Theorem 1.1 rests on his Lemma (corput lemma), whose proof
      in his Section 'Proof of Lemma' applies three results of Cheng-Graham: [Lemma 5], the Weyl-van der
      Corput lemma 'in the more precise form presented at the bottom of page 1273'; [Lemma 3], the van
      der Corput second-derivative test, at a step his source labels literally `corput second der`; and
      the summation estimates following [Lemma 7]. It also uses [Lemma 2] of Platt-Trudgian, An improved
      explicit bound on |zeta(1/2+it)|, J. Number Theory 147 (2015), 842-851, for a refinement. So FKS's
      report is exact: the erroneous input is Cheng-Graham's Lemma 3, the second-derivative test, which
      is why the constant moves from 0.63 to 0.77. ChengGraham2004.v1 now exists but states nothing, deliberately
      -- transcribing Lemma 3 as printed would put a knowably wrong statement into the network, and the
      corrected form is argued only in Patel's footnote, which is not held. Neither input is an edge,
      so this stays `traced`. The correction is now verified FIRST HAND. Patel's paper is on arXiv as
      2009.00769, which earlier searches by title missed; its Footnote 3 reads: 'This corrected version
      of the explicit third derivative test in turn changes the explicit van der Corput bound derived
      by Hiary in [Theorem 1.1]. In that paper, Hiary obtained |zeta(1/2+it)| <= 0.63 t^(1/6) log t at
      the time. ... With the correction provided in Lemma [derivative3test], the estimate obtained by
      Hiary now becomes |zeta(1/2+it)| <= 0.77 t^(1/6) log t.' So 0.77 is confirmed against the paper
      that argues it, not merely against FKS's report of it. Patel's Section 2 also says more than FKS
      did: the flaw is in Cheng-Graham's LEMMAS 2 AND 3, not Lemma 3 alone; it was found by Kevin Ford
      and by Reyna; the leading term of the incorrect Lemma 3 is 'off by a factor of sqrt(2)'; and it
      'affects many explicit estimates in the literature'. Patel gives corrected versions, so a Patel2022
      node stating them would make this conclusion's imports drawable -- that is the next step here. The
      correction is now verified FIRST HAND. Patel's paper is on arXiv as 2009.00769, which earlier searches
      by title missed; its Footnote 3 reads: 'This corrected version of the explicit third derivative
