    models:
    - Claude Opus 5 (Anthropic)
    framework: Claude Code
    role: >-
      Transcribed the statement from the paper's LaTeX source and applied the correction FKS documents,
      under the direction of the maintainer. No proof is claimed.
review:
  status: self-assessed
  reviewers:
  - Terence Tao
  notes: >-
    The correction from 0.63 to 0.77 is taken from FKS, not verified independently; Patel's footnote,
    which is where it is argued, has not been read.
limitations:
- >-
  The conclusion rests on the cited paper as corrected by a third one; it is not proved in Lean here,
  and the correction has not been verified against Patel's footnote.
- >-
  Theorem 1.1's other half, |zeta(1/2+it)| <= 1.461 for 0 <= t <= 3, is not stated. Nothing consumes it,
  and whether the same correction affects it has not been checked.
- >-
  Hiary, Patel and Yang have since recovered and improved the constant to 0.618, per FKS. That paper is
  held and has no node; adopting it would sharpen the whole chain.
- >-
  No novelty is claimed. The result is Hiary's.
