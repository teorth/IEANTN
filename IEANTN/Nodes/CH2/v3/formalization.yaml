      "Extremal approximants to the truncated exponential". The statements that matter upstream are
      CH2.Inu_bounds for the majorant inequality and CH2.varphi_fourier_plus_error for the L1 error,
      in exactly the closed form stated here.
      CORRECTION TO AN EARLIER CLAIM ON THIS NODE. That section contains no `sorry` of its own, but
      it is NOT sorry-free: `varphi_fourier_decay` and `varphi_hat_integrable` are proved from
      Wiener.prelim_decay_3 and Wiener.decay_alt, and prelim_decay_3 is one of the two `sorry`s in
      Wiener.lean -- the decay of the Fourier transform of a function whose derivative has bounded
      variation. Mathlib has no such lemma either; `eVariationOn` appears nowhere in
      Analysis/Fourier/. Both of this node's conclusions depend on it, since band-limitedness needs
      the decay and the L1 errors need integrability of the transform.
      THE SOLUTION AVOIDS IT rather than proving it. The closed form the section DOES prove sorry-free
      -- fourier_formula_pos and fourier_formula_neg -- gives the same bound directly, because
      B_real_lipschitz_of_pm shows `B` is globally 1-Lipschitz along the reals, so the integrand
      `B(nu -+ t) - B(nu)` vanishes LINEARLY at t = 0 and the second moment `int t exp(-ct) = 1/c^2`
      supplies the second power. See Solutions/CH2.v3/Decay.lean. A proper, upstreamable treatment of
      Riemann-Stieltjes integration by parts is worth having and is deliberately out of scope.
      THE OTHER PIECE THAT IS NOT A PORT is the sign of `lambda` -- see the node's limitations.
      Solutions/CH2.v2 is the worked example of the port operation across the same Lean version gap,
      and Solutions/DudekPlatt.v3 of the @[blueprint ...] stripping it needs.
