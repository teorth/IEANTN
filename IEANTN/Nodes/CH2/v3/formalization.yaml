# The extremal approximants of Chirre-Helfgott, section 4 as replaced by the authors' addendum.
# A variant of CH2.v2, not a successor -- v2 consumes an approximant, v3 produces one. Both stay.
version: "v0.4"

node:
  id: CH2.v3
  family: CH2
  version: v3
  kind: pipeline
  status: awaiting-solution

project:
  name: "Chirre-Helfgott's extremal approximants"
  description: >-
    Section 4 of Chirre-Helfgott, as replaced by the authors' addendum "Replacement for Section 4.1":
    band-limited majorants and minorants of the truncated exponential, with their L1 error computed
    exactly. Two conclusions, one per direction. Both are stated existentially -- they assert that an
    approximant exists with the four properties a consumer uses, rather than naming the explicit
    Beurling-Selberg function the paper constructs -- so this node introduces no definitions of its
    own and its output feeds CH2.v2's hypotheses verbatim. The exactness of the L1 error is what makes
    the resulting bound optimal rather than merely valid; it is the quantity the paper minimises, and
    Corollary 1.2's pi/T is its value.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "42A05", "42A38"]

