      without waiting on any numerical input.
      A COMPLETE SOLUTION EXISTS at Solutions/CH2.v3, awaiting verification: 6969 lines across six
      files, free of sorryAx, axioms exactly propext / Classical.choice / Quot.sound, type matching
      the challenge under `set_option pp.all true`. The justification stays `none-yet` until the
      verification workflow records a receipt.
