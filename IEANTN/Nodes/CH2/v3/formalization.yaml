      The companion to the majorant, from CH2.Inu_bounds and CH2.varphi_fourier_minus_error upstream.
      Imports `none`, for the same reason.
      Stated as a separate conclusion rather than folded into a conjunction because the optimal
      majorant and the optimal minorant are different functions -- the same reason CH2.v2 splits
      Proposition 2.4 in two -- so a consumer instantiates one or the other, not both at a shared phi.
      Note the two L1 errors are NOT equal: 1/(1-e^-L) - 1/L against 1/L - 1/(e^L - 1). The majorant
      is the more expensive side, and that asymmetry survives into the final constants.
