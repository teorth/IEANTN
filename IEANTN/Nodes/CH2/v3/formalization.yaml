sources:
- title: "Optimal bounds for sums of non-negative arithmetic functions"
  authors: ["Andres Chirre", "Harald Andres Helfgott"]
  type: "paper"
  id: "https://arxiv.org/abs/2512.15709"
  relationship: formalizes
  note: >-
    Section 4, read from the arXiv preprint together with the authors' addendum "Replacement for
    Section 4.1". The addendum is what makes this node worth stating: without it, section 4 rests on
    Graham-Vaaler 1981, and formalizing the approximants would mean formalizing a 1981 paper nobody
    here holds. The addendum supplies a self-contained construction.

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Read the paper's section 4 and its addendum, located the corresponding upstream development in
      PrimeNumberTheoremAnd, and chose the existential form of the statements, under the direction of
      the maintainer. No proof is claimed.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    The two statements were designed against CH2.v2's hypotheses rather than transcribed from the
    paper's own numbering, so that the existentials feed proposition_2_4_upper and _lower with no
    bridging. What was checked deliberately is the internal consistency of the last two properties:
    since the integral of a Fourier transform is its value at 0 and the integral of truncExp lambda
    is 1/|lambda|, the stated L1 error must equal `phi 0 - 1/|lambda|`, and it does, in both
    directions. A transcription error in either the value at 0 or the error would break that
    identity, so the two corroborate each other.
    The upper limit beta <= 2 was derived, not copied: the upstream decay estimate is O(y^-2), and
    IsBandLimited asks for a bound at every nonzero y, which a y^-2 bound supplies for |y| >= 1 and
    boundedness of the Fourier transform of an integrable function supplies for |y| < 1. Neither
    argument is available above beta = 2.

limitations:
- >-
  Proved, but not yet verified: a receipt requires a Comparator run. Nothing downstream may treat
  these as established until one exists.
- >-
  THE SIGN OF LAMBDA IS NOT A PORT. CH2.v2 applies these at lambda = 2 pi (sigma - 1) / T, and for
  psi the relevant sigma is 0, so lambda is NEGATIVE in the intended application.
  PrimeNumberTheoremAnd builds its approximants for `Inu nu x = if 0 <= x then exp(-nu x) else 0`
  with nu > 0, which is CH2.v2.truncExp at a positive argument only. The two are related by
  reflection -- for nu > 0, truncExp (-nu) u is Inu nu (-u), and reflecting phi reflects its Fourier
  transform while preserving support in [-1,1] -- so the negative case follows from the positive one,
  but it is a step upstream does not take, because upstream never states the theorem these
  approximants are for. The solution does it, in Solution.lean.
  It was NOT the only real mathematics in the solution, which is what the earlier version of this
  note guessed. The bounded-variation decay bound was, and is discussed in the majorant's
  justification note above.
- >-
  THE APPROXIMANT IS NOT NAMED. These conclusions assert existence, not a formula. A consumer that
  needs a pointwise value of phi other than phi 0 -- which is the only one CH2.v2.mainExpression uses
  -- will not find it here and would need a further conclusion or a stronger, non-existential
  restatement. That was a deliberate trade: naming the function would put the Beurling-Selberg
  construction into a Conclusions file and pin every consumer to the particular approximant.
- >-
  OPTIMALITY IS NOT CLAIMED. The paper's approximants are extremal -- no band-limited majorant has
  smaller L1 error -- and that is what makes Corollary 1.2's pi/T optimal rather than merely valid.
  These conclusions state the error exactly but do not state that no better approximant exists.
  Stating the extremality is separate work and is not needed for any bound downstream.
- >-
  No novelty is claimed. The construction is Graham and Vaaler's as reconstructed by Chirre and
  Helfgott.
