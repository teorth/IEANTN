project:
  name: 'Buthe: estimating pi(x) and related functions under partial RH assumptions'
  description: >-
    Schoenfeld proved his explicit bounds for psi, theta, pi* and pi on the Riemann hypothesis. This paper
    shows they already follow from a partial verification, provided x is small enough relative to the
    height reached -- precisely 4.92 sqrt(x / log x) <= T. That makes it the bridge between the network's
    computational nodes and its analytic ones, and it is one of the three inputs BKLNW uses to compute
    the eps(b) of its Table 8.
  authors:
  - Terence Tao
  license: Apache-2.0
  responsible_maintainers:
  - Terence Tao
repository:
  role: substantive-development

