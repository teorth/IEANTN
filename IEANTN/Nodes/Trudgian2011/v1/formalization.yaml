project:
  name: "Trudgian: improvements to Turing's method"
  description: >-
    Turing's method confirms that a zero count is complete, and so that no zero has been missed in the
    range checked. Making it explicit needs a bound on the integral of S(t), and this paper's Theorem
    2.2 is the bound modern verifications use. Platt2017 states it as its own Theorem 4.2.
  authors:
  - Terence Tao
  license: Apache-2.0
  responsible_maintainers:
  - Terence Tao
repository:
  role: substantive-development

classification:
  arxiv:
  - math.NT
  msc2020:
  - 11M26
  - 11Y35
conclusions:
- id: integral_S_bound
  declaration: Trudgian2011.v1.integral_S_bound
  challenge: Trudgian2011.v1.challenge_integral_S_bound
  imports: []
  imports_status: undetermined
  justifications:
  - id: trudgian-paper
    kind: literature
    source: Trudgian2011
    locator: Theorem 2.2
    note: >-
      Asserted on the authority of the paper, read from the rendered page. Theorem 2.2: for t_2 > t_1
      > 168 pi, |integral from t_1 to t_2 of S(t) dt| <= 2.067 + 0.059 log t_2. Platt2017 restates it
      as its Theorem 4.2 with the proof 'This is Theorem 2.2 of [27]'. The threshold is the paper's own,
      and its footnote notes that '168 pi ... seems to be a misprint' inherited from Turing and Lehman,
      kept anyway; the constants are stated as valid for all t_2 > t_1 > 168 pi while being optimal near
      t_1 > 2 pi 10^12. S is the Vocabulary's zetaS. The papers extend S to the ordinates of zeroes by
      a right limit and zetaS does not; that is harmless for this conclusion and only for this kind of
      conclusion, because the exceptional t form a measure-zero set and the statement integrates over
      t. Imports are undetermined -- what Theorem 2.2 itself rests on has not been traced.
  designated: trudgian-paper
