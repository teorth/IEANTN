limitations:
- >-
  The conclusion rests on the cited paper; it is not proved in Lean here.
- >-
  It is stated with the Vocabulary's zetaS, which omits the right-limit convention the papers use at the
  ordinates of zeroes. Harmless here because the statement integrates over t; not harmless for any conclusion
  that would evaluate S at a point.
- >-
  Imports undetermined. What Turing's method itself rests on has not been traced.
- >-
  No novelty is claimed. The result is Trudgian's.
