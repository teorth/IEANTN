# Node metadata for `Dusart2018`.
#
# Shaped as a superset of Palomar's formalization.yaml so that a sufficiently-justified
# conclusion can be spun off as a submission without restructuring. The `node`, `conclusions`
# and `receipts` blocks are IEANTN additions; everything else follows Palomar's contract.
#
# NOTE: Palomar's required-field list moves. CI re-fetches the validator rather than working
# from a vendored copy; do not treat the fields below as a closed list.
version: "v0.4"

node:
  id: Dusart2018
  kind: paper
  status: stub

project:
  name: "Dusart's explicit estimates of some functions over primes"
  description: >-
    Explicit bounds on the Chebyshev functions, the prime counting function, and the size of gaps
    between consecutive primes, from Dusart's 2018 paper in the Ramanujan Journal. This node
    currently exports only Proposition 5.4, the prime-gap estimate that downstream nodes in the
    network consume; the paper's other results should be added as further conclusions as they are
    needed.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11N56", "11Y70"]

conclusions:
  - id: proposition_5_4
    declaration: Dusart2018.proposition_5_4
    challenge: Dusart2018.challenge_proposition_5_4
    imports: []
    justification:
      kind: literature
      source: Dusart2018
      locator: "Proposition 5.4"
      note: >-
        Asserted on the authority of the paper. Dusart assembles it from an analytic argument
        above 4e18 resting on his Theorem 4.2, a prime-gap table between 360653 and 4e18, and a
        direct verification on [89693, 360653]. None of those three pieces is formalized here.
        Formalizing this node would most naturally proceed by splitting it: the analytic branch
        and the prime-gap table are separate kinds of evidence and belong in separate nodes.
    receipt: null

sources:
  - title: "Explicit estimates of some functions over primes"
    authors: ["Pierre Dusart"]
    type: "paper"
    id: "https://doi.org/10.1007/s11139-016-9839-4"
    location: "Ramanujan J. 45 (2018), no. 1, 227-251"
    relationship: formalizes
    note: >-
      The source of record for this node's conclusion. Proposition 5.4 is stated there for
      x >= 89693 with the interval half-open on the left, matching the statement recorded here.

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5 (Anthropic)"]
      framework: "Claude Code"
      role: >-
        Transcribed the paper's Proposition 5.4 into the network's vocabulary and wrote this
        metadata, under the direction and review of the maintainer. No proof is claimed.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    The statement was transcribed from the PNT+ formalization of the same proposition, which
    carries its own citation to the paper. It has not been checked against the printed paper
    directly.

limitations:
  - >-
    This node is a stub. Its conclusion is unproved in Lean and rests entirely on the cited
    paper. Anything downstream of it inherits that dependency.
  - >-
    No novelty is claimed. The result is Dusart's.
