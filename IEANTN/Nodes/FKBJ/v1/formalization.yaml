project:
  name: "Franke-Kleinjung-Buthe-Jost: a practical analytic method for pi(x)"
  description: >-
    The computation of the zeros of zeta with imaginary part up to 10^11 that Buthe's analytic method
    consumes. Buthe.v1's Theorem 2 is the output of running that method on this data. The node states
    the part of the computation that is expressible as a proposition -- that every zero up to that height
    lies on the critical line -- and records in prose that the algorithm consumes the tabulated zeros
    themselves, which is data rather than a claim.
  authors:
  - Terence Tao
  license: "Apache-2.0"
  responsible_maintainers:
  - Terence Tao

