# Node metadata for `FKBJ.v1`.  See docs/NODES.md.
version: "v0.4"

node:
  id: FKBJ.v1
  family: FKBJ
  version: v1
  kind: computation
  status: active            # change this once the node is filled in

project:
  name: "Franke-Kleinjung-Buthe-Jost: a practical analytic method for pi(x)"
  description: >-
    The computation of the zeros of zeta with imaginary part up to 10^11 that Buthe's analytic method
    consumes. Buthe.v1's Theorem 2 is the output of running that method on this data. The node states
    the part of the computation that is expressible as a proposition -- that every zero up to that height
    lies on the critical line -- and records in prose that the algorithm consumes the tabulated zeros
    themselves, which is data rather than a claim.
  authors:
  - Terence Tao
  license: "Apache-2.0"
  responsible_maintainers:
  - Terence Tao

repository:
  role: substantive-development

classification:
  arxiv:
  - math.NT
  msc2020:
  - 11M26
  - 11Y35
  - 11N05

conclusions:
- id: rh_up_to
  declaration: FKBJ.v1.rh_up_to
  challenge: FKBJ.v1.challenge_rh_up_to
  imports: []
  imports_status: undetermined
  justifications:
  - id: fkbj-paper
    kind: numerical
    source: FKBJ
    locator: the zero computation the paper reports
    note: >-
      A large finite computation, so `numerical` rather than `literature`: what stands behind it is a
      program that ran, not an argument a referee read. Recorded at second hand -- Buthe describes this
      computation as the input to his Theorem 2 and cites it as [5]; the paper itself has not been read
      here, and its exact statement of the height and accuracy wants checking. See docs/SOURCES.md.
  designated: fkbj-paper
sources:
- title: A practical analytic method for calculating pi(x)
  authors:
  - Jens Franke
  - Thorsten Kleinjung
  - Jan Buthe
  - Alexander Jost
  type: paper
  id: Math. Comp., cited by Buthe (arXiv:1511.02032v2) as reference [5]
  location: Math. Comp.; volume and pages not confirmed
  relationship: formalizes
  note: >-
    Bibliographic details taken from Buthe's reference list, which records it as 'to appear'. Volume,
    pages and DOI are unconfirmed and the paper has not been read. Confirm before external use.
automation:
  methods:
  - method: agent
    models:
    - Claude Opus 5 (Anthropic)
    framework: Claude Code
    role: >-
      Created this node and stated the consequence of the computation that Buthe's Theorem 2 rests on,
      under the direction of the maintainer. No proof is claimed.
review:
  status: self-assessed
  reviewers:
  - Terence Tao
  notes: >-
    Everything here is at second hand, from Buthe's description of what his computation consumed. The
    cited paper has not been obtained.

limitations:
- >-
  The cited paper has not been read. The height 10^11 is Buthe's description of the zeros he used, not
  a quotation of this paper's own statement.
- >-
  The node understates what it supplies. Buthe's algorithm takes the tabulated zeros as input, to a stated
  accuracy; a conclusion is a Prop, so the network can state only the consequence that there are no zeros
  off the critical line below that height. Any consumer needs more than the node says.
- >-
  No novelty is claimed.
