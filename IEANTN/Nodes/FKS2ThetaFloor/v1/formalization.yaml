  - id: unjustified
    kind: none-yet
    note: >-
      Proved in Solutions/FKS2ThetaFloor.v1. The justification stays none-yet until the
      verification workflow writes a receipt. The argument is the paper's: u = sqrt(log x / R)
      turns the bound into A u^3 exp(-2u), whose only critical point in the range is a maximum
      at u = 3/2, so the minimum on [2, exp 30] is at an endpoint.
  designated: unjustified

