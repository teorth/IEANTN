project:
  name: "The zeros of the Riemann zeta function with 5000 < Im s <= 6000"
  description: >-
    Every zero of the Riemann zeta function with 5000 < Im s <= 6000 is simple, lies on the critical
    line, and has its ordinate within 10^-20 of m/10^24 for one of 1078 listed integers m; each
    listed m has exactly one zero near it; and there are exactly 1078 such zeros. A Lean proof with
    kernel-evaluated certificates exists in Garald1/zeta-zero-locations and is not yet integrated.
  authors: ["Harald Helfgott"]
  license: "Apache-2.0"
  responsible_maintainers: ["Harald Helfgott"]

