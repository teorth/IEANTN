project:
  name: "The zeros of the Riemann zeta function up to height 10 000"
  description: >-
    Every zero of the Riemann zeta function with 0 < Im s <= 10000 is simple and lies on the
    critical line, and there are exactly 10142 of them; derived from the ten ranges
    ZetaZeroLocations.v1 to v10.
  authors: ["Harald Helfgott"]
  license: "Apache-2.0"
  responsible_maintainers: ["Harald Helfgott"]

