    declaration: ZetaZeroLocations.v1.located_0_1000
    challenge: ZetaZeroLocations.v1.challenge_located_0_1000
    imports: []
    imports_status: none
    justifications:
      - id: integration-pending
        kind: none-yet
        note: >-
          The statement `located` of challenge/Zeros0to1000.lean in Garald1/zeta-zero-locations, in
          the network's vocabulary (zetaZeroesIn and zetaOrder; see the module docstring for why
          the two forms agree). That repository proves it on Lean v4.35.0-rc2 with Mathlib
