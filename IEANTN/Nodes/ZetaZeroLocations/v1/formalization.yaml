# Node metadata for `ZetaZeroLocations.v1`.  See docs/NODES.md.
version: "v0.4"

node:
  id: ZetaZeroLocations.v1
  family: ZetaZeroLocations
  version: v1
  kind: computation
  status: awaiting-solution

project:
  name: "The zeros of the Riemann zeta function up to height 1000"
  description: >-
    Every zero of the Riemann zeta function with 0 < Im s <= 1000 is simple, lies on the critical
    line, and has its ordinate within 10^-20 of m/10^24 for one of 649 listed integers m; each
    listed m has exactly one zero near it; and there are exactly 649 such zeros. A Lean proof with
    kernel-evaluated certificates exists in Garald1/zeta-zero-locations and is not yet integrated.
  authors: ["Harald Helfgott"]
  license: "Apache-2.0"
  responsible_maintainers: ["Harald Helfgott"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11M26", "11Y35"]

conclusions:
