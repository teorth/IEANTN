# Node metadata for `MTY.v1`.  See docs/NODES.md.
#
# The three explicit regions from arXiv:2212.06867. Theorem Main2 is omitted; see limitations.
version: "v0.4"

node:
  id: MTY.v1
  family: MTY
  version: v1
  kind: paper
  status: stub

project:
  name: "Mossinghoff-Trudgian-Yang: explicit zero-free regions for the Riemann zeta-function"
  description: >-
    Sharpened explicit zero-free regions for the Riemann zeta function, improving the constants
    available to every downstream explicit estimate. The zero-free region in the same shape as
    `Kadiri2005`'s, so that a node consuming one can be migrated to the other by a bridge rather
    than a rewrite. Getting those two statements into a common form is the first real test of
    whether the vocabulary is right.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11M26"]

conclusions:
- id: classical_zero_free_region
  declaration: MTY.v1.classical_zero_free_region
  challenge: MTY.v1.challenge_classical_zero_free_region
  imports: []
  imports_status: traced
  justifications:
  - id: mty-classical
    kind: literature
    source: MTY
    locator: Theorem 1.3
    note: >-
      Read from arXiv:2212.06867, Zerofree_MTY_v10_arXiv_TTsub.tex, Theorem thmClassical: no zeros
      for |t| >= 2 and sigma >= 1 - 1/(5.558691 log|t|). The abstract states the same pair of
      constants. The proof uses the Platt-Trudgian verification of RH up to 3e12 and the Jang-Kwon
      smoothing; neither is an edge yet. Asserted on the paper's authority.
  designated: mty-classical
- id: korobov_vinogradov_region
  declaration: MTY.v1.korobov_vinogradov_region
  challenge: MTY.v1.challenge_korobov_vinogradov_region
  imports: []
  imports_status: traced
  justifications:
  - id: mty-korobov
    kind: literature
    source: MTY
    locator: Theorem 1.1
    note: >-
      Read from the same source, Theorem Main: no zeros for |t| >= 3 and
      sigma >= 1 - 1/(55.241 (log|t|)^{2/3} (log log|t|)^{1/3}). The closed inequality is the one
      printed. Asserted on the paper's authority. The argument uses a trigonometric polynomial,
      intermediate regions, and a verified height; those inputs are named in the preprint's
      discussion of Theorem Main and are not drawn as edges.
  designated: mty-korobov
- id: intermediate_zero_free_region
  declaration: MTY.v1.intermediate_zero_free_region
  challenge: MTY.v1.challenge_intermediate_zero_free_region
  imports: []
  imports_status: traced
  justifications:
  - id: mty-intermediate
    kind: literature
    source: MTY
    locator: Theorem 1.4
    note: >-
      Read from the same source, Theorem thmIntZFR: no zeros for |t| >= exp(1000) and
      sigma > 1 - 0.05035/h(t) + 0.0349/h(t)^2, with h(t) = (27/164) log|t| + 7.096. The inequality
      on sigma is strict in the preprint and is stated that way. Asserted on the paper's authority.
  designated: mty-intermediate


sources:
- title: "Explicit zero-free regions for the Riemann zeta-function"
  authors: ["Michael J. Mossinghoff", "Timothy S. Trudgian", "Andrew Yang"]
  type: "paper"
  id: "https://arxiv.org/abs/2212.06867"
  location: "Res. Number Theory 10 (2024), no. 1, Paper No. 11, 27 pp."
  relationship: formalizes
  note: >-
    Identifier is the arXiv entry; PNT+'s bibliography records no DOI and the published version's should
    be confirmed before external use. The title above was checked against the arXiv:2212.06867 preprint
    itself: 'Explicit zero-free regions for the Riemann zeta-function'. Two separate bibliographies get
    this wrong in mirror-image ways -- FKS2's reference [12] gives this paper the title of Mossinghoff and
    Trudgian's 2015 paper, while the published FKS swaps the two titles between its [21] and [22]; see
    MT.v1. Substantively, this paper improves the classical zero-free region constant to R = 5.558691;
    FKS2 and FKS use R = 5.5666305 from Mossinghoff and Trudgian, J. Number Theory 157 (2015), and state
    explicitly that their numerics do not reflect this improvement. So this node is a future sharpening of
    the chain, not an input to its current constants.

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Created this stub and transcribed its bibliographic record from the PNT+
      bibliography, under the direction of the maintainer. No mathematical claim is
      made and no statement has been transcribed from the paper.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    Bibliographic details taken from blueprint/src/references.bib in PrimeNumberTheoremAnd
    rather than from the printed paper. Verify them against the paper before this node is
    cited externally or used as the basis for a submission.

limitations:
- >-
  Theorem Main2 (constant 48.1588, "for sufficiently large |t|") is not stated. The preprint gives
  no explicit threshold, and a made-up cutoff would not be the theorem.
- >-
  Only positive t is quantified, as in ClassicalZeroFreeRegion. The preprint writes |t|.
- >-
  No novelty is claimed. The results are the cited authors'.
