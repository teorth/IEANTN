    available to every downstream explicit estimate. The zero-free region in the same shape as
    `Kadiri2005`'s, so that a node consuming one can be migrated to the other by a bridge rather
    than a rewrite. Getting those two statements into a common form is the first real test of
    whether the vocabulary is right.
