limitations:
- >-
  Both conclusions rest on the cited paper; neither is proved in Lean here.
- >-
  Table 1's sigma column is deliberately not recorded: Theorem 1 says 'for each row {X, A, B, C, eps_0}',
  so sigma is the zero-density abscissa the authors optimised over, not part of what is claimed.
- >-
  theorem_1_classical is stronger than the line as printed, which is one-sided on a signed quantity. See
  its note.
- >-
  The paper's Theorem 2, on a Ramanujan inequality, is not stated; nothing consumes it.
- >-
  No novelty is claimed. The results are the authors'.
