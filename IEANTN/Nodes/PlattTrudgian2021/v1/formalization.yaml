  imports_status: undetermined
  justifications:
  - id: pt2021-paper
    kind: literature
    source: PlattTrudgian2021
    locator: Theorem 1, the asymptotic half, over Table 1
    note: >-
      Asserted on the authority of the paper. Imports: partly traced, and left undetermined because one
      input is not yet a conclusion. The paper fixes R = 5.573412, which is exactly MT.v1.zero_free_region
      -- MT's unsharpened Theorem 1 value, not the 5.5666305 of its Section 6.1 that the FKS chain uses.
      Its Section 2 notes it is 'free to start counting from any height H <= 3e12', which is PlattTrudgian.v1.
      The third input is the zero-density estimate of Kadiri-Lumley-Ng, which BKLNW describes as 'a truncated
      Perron's formula combined with the zero density obtained in [25]': KLN.v1 exists but states only
      the subconvexity bound of its Lemma 3.2, not the density result the paper is named for. Adding that
      conclusion would complete this tracing. Note on absolute values, as for FKS and FKS2: the paper
      writes this on the signed (psi(x) - x)/x with no bars, while E_psi here is |psi(x) - x| / x, so
      against the printed line alone this is the stronger claim. Unlike FKS this paper gives no two-sided
      restatement of this half; what it does give two-sided is the epsilon column, which is theorem_1_numerical.
      Prefer that where it suffices.
  designated: pt2021-paper
