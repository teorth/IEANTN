project:
  name: 'Platt-Trudgian: the error term in the prime number theorem'
  description: >-
    An explicit form of a theorem of Pintz, giving a prime number theorem whose error term is roughly
    the square root of what was previously known. Its Theorem 1 tabulates bounds for E_psi, both in the
    classical asymptotic shape and as a plain numerical constant, and is where BKLNW's Table 8 gets its
    large-b half.
  authors:
  - Terence Tao
  license: Apache-2.0
  responsible_maintainers:
  - Terence Tao
