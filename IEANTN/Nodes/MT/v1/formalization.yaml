    Bibliographic details from PNT+'s references.bib and FKS's reference [20]; the DOI has not been confirmed
    against the publisher. Note the near-identical title of Mossinghoff, Trudgian and Yang (MTY.v1), which
    is a different, later paper. The published FKS reference list swaps this paper's title with that of
