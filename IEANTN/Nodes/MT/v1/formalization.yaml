  description: >-
    The classical zero-free region for the Riemann zeta function with R = 5.573412, and the sharpened
    R = 5.5666305 of Section 6.1 that the FKS to FKS2 chain is calibrated to. Not to be confused with
    MTY.v1, which is the 2024 paper by the same authors with Yang.
