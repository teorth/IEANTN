review:
  status: self-assessed
  notes: >-
    This new node has been checked by its contributing agent and by this repository's mechanical
    checks (certificate.py, fingerprint/graph/closure checks) only; no maintainer or other human
    review has been recorded for it, and none is implied by omitting a `reviewers` field -- that
    review is pending ordinary pull-request review. Independently recomputed M_a, m_a from eq. (8)-(9) at a = 3130, y_a = 9400 and cross-checked the
    same formula against the paper's own already-committed a = 3223 case (DudekPlattNumerics.v1):
    it reproduces the paper's printed M_a = 3343.48, m_a = -3103.33 to stated precision, confirming
    formula fidelity before trusting the new numbers. Eq. (8)-(9) themselves were then checked
    directly against the freely available Dudek-Platt arXiv v1 preprint (fetched and parsed in full
    this session): present verbatim, including the auxiliary constant A. The SAME fetch also settled
    an open question precisely rather than by assumption: the preprint contains "Trudgian" (pp. 4, 11,
    citing his solo paper) but does NOT contain footnote 1 itself or any of "Mossinghoff", "improved",
    "9394" -- the footnote's own substance is published-journal-only, so its exact wording is not
    independently obtainable from open access and still rests on the maintainer's own reading recorded
    on DudekPlattNumerics.v1. R = 6.315's citation to Mossinghoff-Trudgian (2015) Section 7 Corollary 1
    was checked against THAT paper's own freely available arXiv preprint directly, confirming it is the
    same paper MT.v1 cites and that Corollary 1 rests on that paper's Theorem 1, which in turn consumes
    the established height T0 = 3.06e10 (Platt2015.v1.rh_up_to), not the RH-height-dependent Section 6.1
    form. The theta-bound crossing point (eq. 6-7) was independently re-derived from the preprint's own
    PRE-log inequality (cancelling the shared factor of x from both sides before substituting x = e^y),
    not merely copied: the resulting root-finding computation gives y = 9392.86092006083... at
    a = 3130, R = 6.315, matching the docstring's claim to 10 decimal places, and its
    `log(e*x_a) = y+1 = 9393.86` rounds to the footnote's own printed final answer exp(9394), a strong
    independent triangulation. The same method applied to the paper's own a = 3223, R = 6.455 case
    gives a crossing of 9656.12, about 0.68 below the paper's own chosen x_a = exp(9656.8) --
    consistent with the paper choosing a modest safety margin above the bare crossing, the same style
    of choice this node makes (7.14 units) at x_a = exp(9400). This root-finding computation is
    corroborating evidence only, not the node's certified derivation: an independent review of issue
    #63 found the crossing FUNCTION as originally written here mis-normalized (subtracting log(a)
    instead of log(C/(a R^(1/4)))) and, correctly evaluated, well short of a crossing at y = 9400 --
    the root-finding value above, from a directly re-derived pre-log inequality, was never affected by
    that mistake, but the docstring's post-log g(y) formula was. README.md and certificate.py, added by
    the repair, replace that argument with an exact, non-root-finding monotonicity bound
    (f_R(9400) < 3110 < 3130), certify the previously-unaddressed [2, x_a] integration range, and
    correct this note's and the sources' "no partial-RH-verification height" language to reflect that
    MT's Theorem 1 consumes the established T0 = 3.06e10, exactly as re-confirmed above.

limitations:
- >-
  A computation asserted on the paper's own footnote authority for the (a, R) pair, same tier as
  DudekPlattNumerics.v1's main-text constants, though the resulting pi(x) estimate itself is now
  independently derived from Mossinghoff-Trudgian's open-access Corollary 1 rather than from the
  footnote's bare assertion (see README.md). Nothing here is proved in Lean: README.md is written
  mathematics and certificate.py checks its numerical inequalities in exact rational arithmetic, which
  is stronger than an asserted evaluation but not a Lean proof or a Comparator receipt. Rests, like v1,
  on Trudgian-style explicit theta error terms rather than on arithmetic over a finite window.
- >-
  R = 6.315 is not yet a drawable graph edge to MT.v1, even though it is now precisely traced to that
  paper's own Section 7 Corollary 1 (built unconditionally on MT.v1.zero_free_region): MT.v1 does not
  currently state Corollary 1, and the theta-to-pi partial-summation conversion this node applies is
  itself not a node. This is the SAME structural gap DudekPlattNumerics.v1 has for its own R = 6.455 --
  if anything this node's R is better attested, since v1's traces to a paper (Trudgian solo,
  arXiv:1401.2689) that is not held in this network at all.
- >-
  The published Dudek-Platt footnote's exact wording is transcribed from the maintainer's own reading
  of the paywalled Exp. Math. version, recorded independently in DudekPlattNumerics.v1, DudekPlatt.v1
  and DudekPlatt.v2's own formalization notes; this node adds independent, open-access corroboration
  of the R = 6.315 NUMBER itself via Mossinghoff-Trudgian's freely available arXiv preprint, but does
  not itself obtain a copy of the journal footnote's exact text.
- >-
  x_a = exp(9400) is a safely-rounded choice, not the footnote's own exp(9394) and not a numerically
  optimized endpoint: the true theta-bound crossing at these (a, R) is approximately y = 9392.86, and
  9400 was chosen to leave clear, monotone-argument-backed margin rather than to sit as close to the
  crossing as possible. A tighter x_a is possible but was deliberately not pursued, since the margin
  this node needs to recover exp(9658) is already large (see DudekPlatt.v4).
- >-
  No novelty is claimed. The results are Dudek and Platt's, and Mossinghoff and Trudgian's.
