limitations:
- >-
  Proved from its one import (MT.v2.corollary_1), but not yet verified: a receipt requires a
  Comparator run, which has not been dispatched (external to this change; requires a maintainer's
  approval of the verification environment per SECURITY.md).
- >-
  What it is proved FROM matters more than that it is proved. MT.v2.corollary_1 is `literature`,
  asserted on Mossinghoff-Trudgian's authority; its own zero-free-region-to-theta conversion argument
  is not formalized anywhere in this network. So this node's evidentiary tier is: Lean-proved calculus
  and numerics, conditional on one cited theorem -- stronger than v3's Python-certificate tier (the
  calculus is now machine-checked, not merely written down), but not a fully Lean-verified chain from
  first principles, and MT.v2.corollary_1's own citation is no stronger than MT.v1's two conclusions
  already were.
- >-
  DudekPlattNumerics.v3 is unchanged and still stands on its own `numerical` justification; this node
  does not redesignate it and does not claim to supersede it. A bridge recording that this node's
  conclusion implies v3's (they are the identical statement) is added at
  IEANTN/Bridges/DudekPlattNumerics/V4ToV3.lean and registered as a second, non-designated
  justification on v3's own conclusion, so a downstream node currently importing v3 (DudekPlatt.v4's
  solution) can discharge that hypothesis from this node instead -- i.e. ultimately from
  MT.v2.corollary_1 rather than from a numerical certificate -- without editing v3 or DudekPlatt.v4
  in place. Nothing in this network's Solutions currently exercises that route; it is available, not
  wired into any committed Solution.lean.
- >-
  x_a = exp(9400) is not a numerically re-optimized endpoint, for the same reason v3 records: it was
  chosen with a safe, monotonicity-backed margin above the theta-bound's true crossing point rather
  than as tight as possible. This node does not attempt to tighten it.
- >-
  No novelty is claimed. The results are Dudek and Platt's, and Mossinghoff and Trudgian's; the Lean
  formalization is this network's own.
