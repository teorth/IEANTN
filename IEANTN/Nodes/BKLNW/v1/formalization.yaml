version: "v0.4"

node:
  id: BKLNW.v1
  family: BKLNW
  version: v1
  kind: paper
  status: active

project:
  name: "Broadbent-Kadiri-Lumley-Ng-Wilk: sharper bounds for the Chebyshev function theta(x)"
  description: >-
    Explicit bounds on `theta(x) - x`. The method rests on a zero-free region, a zero density
    estimate, and a verification of the Riemann hypothesis to a finite height, together with
    substantial numerical work. The headline admissible classical bound on `E_theta` is the
    conclusion downstream nodes want. The paper's table-driven components are a natural candidate
    for splitting into their own node once anyone formalizes them, since a table is a different
    kind of evidence from an analytic argument.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M06", "11M26"]

conclusions:
- id: corollary_5_1
  declaration: BKLNW.v1.corollary_5_1
  challenge: BKLNW.v1.challenge_corollary_5_1
  imports: []
  justifications:
  - id: bklnw-paper
    kind: literature
    source: BKLNW
    locator: Corollary 5.1, equations (2.10) to (2.12), restricted to b <= 38 log 10
    note: >-
      Asserted on the authority of the paper, transcribed from arXiv:2002.11068v2. Stated on 7 <= b <=
      38 log 10 only. Above that threshold a1(b) is 1 + eps(b/2) with eps read from the paper's Table
      8; below it a1 is the explicit constant 1 + 1.93378e-8, and every current consumer is below it --
      FKS2 uses x0 = e^30, and 38 log 10 is about 87.4982. This is a restriction of the paper's range,
      not a weakening of what it claims on that range. The paper contradicts itself here and the displayed
      statement is the correct side, so that is what is transcribed. Theorem 5 gives a2 = (1 + alpha)
      max{...}; Corollary 5.1's proof declares alpha = 1.93378e-8 from Corollary 2.1 and then writes 1.15177e-8
      for the same quantity one sentence later, so (2.12) is self-consistent and the proof's figure is
      a stray -- most likely a leftover from a draft with a different epsilon. It appears on page 9 of
      both arXiv:2002.11068v2 and the published Math. Comp. version, and never reached PNT+, whose formalization
      uses the correct value. The difference is lower order and harmless; it is recorded because a stray
      constant that nobody writes down is the kind of thing that gets propagated later.
  designated: bklnw-paper
- id: theta_error_le_one
  declaration: BKLNW.v1.theta_error_le_one
  challenge: BKLNW.v1.challenge_theta_error_le_one
  imports: []
  justifications:
  - id: bklnw-paper
    kind: literature
    source: BKLNW
    locator: Tables 13 and 14, as used in FKS2 Corollary 14
    note: >-
      Asserted on the authority of the paper. Stated as the consequence FKS2 draws from those tables --
      E_theta(x) <= 1 on [2, e^30] -- rather than as the tables themselves, because the consequence is
      what is consumed and it is a single clean inequality. Transcribed from FKS2's proof of its Corollary
      14, not read off the tables directly; confirm against the published tables before relying on it
      for anything sharper.
  designated: bklnw-paper

