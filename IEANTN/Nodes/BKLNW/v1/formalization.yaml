limitations:
- >-
  Both conclusions rest on the cited paper; neither is proved in Lean here.
- >-
  Corollary 5.1 is stated only for 7 <= b <= 38 log 10, the range where its coefficients are explicit.
  The branch above that threshold needs the paper's Table 8, which would go in a Tables.lean beside this
  file; it is left until something needs it.
- >-
  theta_error_le_one is transcribed from FKS2's use of Tables 13 and 14 rather than read off those tables,
  so it records what a consumer needs rather than the tables' full strength.
- >-
  No novelty is claimed. The results are Broadbent, Kadiri, Lumley, Ng and Wilk's.
