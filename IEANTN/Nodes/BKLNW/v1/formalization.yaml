  status: active

project:
  name: "Broadbent-Kadiri-Lumley-Ng-Wilk: sharper bounds for the Chebyshev function theta(x)"
  description: >-
    Explicit bounds on `theta(x) - x`. The method rests on a zero-free region, a zero density
    estimate, and a verification of the Riemann hypothesis to a finite height, together with
    substantial numerical work. The headline admissible classical bound on `E_theta` is the
    conclusion downstream nodes want. The paper's table-driven components are a natural candidate
    for splitting into their own node once anyone formalizes them, since a table is a different
    kind of evidence from an analytic argument.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M06", "11M26"]

conclusions:
- id: corollary_5_1
  declaration: BKLNW.v1.corollary_5_1
  challenge: BKLNW.v1.challenge_corollary_5_1
  imports:
  - node: Buthe.v1
    conclusion: theorem_2_theta_lower
  justifications:
  - id: bklnw-paper
    kind: literature
    source: BKLNW
    locator: Corollary 5.1, equations (2.10) to (2.12), restricted to b <= 38 log 10
    note: >-
      Asserted on the authority of the paper, transcribed from arXiv:2002.11068v2. Stated on 7 <= b <=
      38 log 10 only. Above that threshold a1(b) is 1 + eps(b/2) with eps read from the paper's Table
      8; below it a1 is the explicit constant 1 + 1.93378e-8, and every current consumer is below it --
      FKS2 uses x0 = e^30, and 38 log 10 is about 87.4982. This is a restriction of the paper's range,
      not a weakening of what it claims on that range. The paper contradicts itself here and the displayed
      statement is the correct side, so that is what is transcribed. Theorem 5 gives a2 = (1 + alpha)
      max{...}; Corollary 5.1's proof declares alpha = 1.93378e-8 from Corollary 2.1 and then writes 1.15177e-8
      for the same quantity one sentence later, so (2.12) is self-consistent and the proof's figure is
      a stray -- most likely a leftover from a draft with a different epsilon. It appears on page 9 of
      both arXiv:2002.11068v2 and the published Math. Comp. version, and never reached PNT+, whose formalization
      uses the correct value. The difference is lower order and harmless; it is recorded because a stray
      constant that nobody writes down is the kind of thing that gets propagated later. Imports: the proof
      applies the paper's Theorem 5 with alpha = 1.93378e-8 from its Corollary 2.1, and its Proposition
      4 with x1 = 10^19 'from the work of Buthe [4, Equation (1.7)]' -- that is Buthe.v1.theorem_2_theta_lower,
      which is the same (1.7). The paper leans on it twice: Corollary 2.1 combines 'theta(x) < x for 0
      < x <= 10^19 ([4, Theorem 2, (1.7)])' with M0 = eps(19 log 10) from Table 8, and equation (3.17)
      quotes (1.7) in full. The other half of that, the Table 8 entry, is this node's own table8_psi_bound_above,
      so it is not an import.
  designated: bklnw-paper
  imports_status: identified
- id: table8_psi_bound
  declaration: BKLNW.v1.table8_psi_bound
  challenge: BKLNW.v1.challenge_table8_psi_bound
  imports: []
  imports_status: undetermined
  justifications:
  - id: bklnw-paper
    kind: literature
    source: BKLNW
    locator: Table 8, read as its Corollary 8.1 reads it
    note: >-
      Asserted on the authority of the paper. The entries themselves are in Tables.lean, extracted from
      the typeset table rather than retyped. What the table means is fixed by the paper's Corollary 8.1,
      which reads the caption's b' as the next entry of column 1; see the Tables.lean docstring, which
      also records the four cross-checks against the paper's prose. Imports: partly traced, but left undetermined
      because only one of the three inputs is a node. The paper's Theorem 2 is attributed to 'Buthe, Platt-Trudgian'
      and drawn from [3, Theorem 2], [4, Theorem 2] and [37]. Resolving those against the reference list:
      [4] is Buthe, An analytic method for bounding psi(x), Math. Comp. 87 (2018), 1991-2009 -- that is
      our Buthe.v1, so one edge does exist. [3] is Buthe, Estimating pi(x) and related functions under
      partial RH assumptions, Math. Comp. 85 (2016), 2483-2498, a different paper, held in the library
      but not yet a node; it supplies the rows with b <= 2000. [37] is Platt-Trudgian, The error term
      in the prime number theorem, Math. Comp. 90 (2021), 871-881 -- distinct from the [38] that our PlattTrudgian.v1
      records -- and supplies the rows with b >= 2500; not held. Recording one edge of three would read
      as a complete tracing in every report, which would be worse than saying nothing, so this stays undetermined
      until the other two are nodes.
  designated: bklnw-paper
