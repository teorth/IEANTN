limitations:
- >-
  Every conclusion rests on the cited paper; none is proved in Lean here.
- >-
  corollary_5_1 is stated on 7 <= b <= 38 log 10 only. Table 8 is now present, so the b > 38 log 10 branch
  can be stated when something needs it.
- >-
  The Table 8 conclusions import Buthe2016.v1 and PlattTrudgian2021.v1, but the third input -- the algorithm
  of Buthe 2018's Theorem 1 -- is not a proposition and can never be an edge. The tabulated values are
  what those algorithms output, so the edges understate the dependency.
- >-
  theta_error_le_one is transcribed from FKS2's use of Tables 13 and 14, not read off those tables directly.
- >-
  No novelty is claimed. The results are the paper's.
