- title: "Explicit zero density for the Riemann zeta function"
  authors: ["Habiba Kadiri", "Allysa Lumley", "Nathan Ng"]
  type: "paper"
  id: "https://doi.org/10.1016/j.jmaa.2018.04.071"
  location: "J. Math. Anal. Appl. 465 (2018), no. 1, 22-46"
  relationship: formalizes

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Transcribed Lemma 3.2 from the arXiv preprint 2101.12263v1, applied FKS's correction to
      the constant it quotes from Hiary, and stated Platt-Trudgian's simplified form of
      Theorem 1.1, under the direction of the maintainer. No proof is claimed.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    Lemma 3.2 read from the arXiv preprint 2101.12263v1 directly. The correction to its constant is FKS's,
    read from the published J. Math. Anal. Appl. version. The published KLN -- J. Math. Anal. Appl. 465
    (2018) 22-46, doi:10.1016/j.jmaa.2018.04.071 -- is now held in the library, but neither it nor any
    recomputation of its tables has been consulted for these statements.

limitations:
- >-
  The stated constant is not the paper's. It is FKS's correction of an input the paper quotes from elsewhere;
  see the conclusion's note and the Conclusions module docstring.
- >-
  The paper's Theorem 1.1 and its numerical density tables are deliberately not stated. Their constants
  are computed with the erroneous a1 = 0.63, and nobody has published recomputed values -- FKS redid its
  own estimates rather than reissuing this paper's tables. Correcting them is a recomputation, not a transcription,
  and wants someone with the method in hand.
- >-
  The error is in an input, not in the method: a1 enters this paper quoted from Hiary, and the structure
  of Theorem 1.1 is unaffected by it.
- >-
  zero_density is the simplified form of Theorem 1.1, as Platt-Trudgian state it. The paper's own theorem
  is sharper and much more heavily parameterised; nothing consumes that generality yet.
- >-
  Lemma 3.2 has a second part, (3.3): max over |t| <= T of |zeta(1/2 + it)| is at most a1 T^(1/6) log
  T + a2, with a2 = 2.851. It is not stated. If it is added, a1 needs the same 0.63 -> 0.77 correction,
  and whether a2 also moves has not been checked.
- >-
  No novelty is claimed. The results are Kadiri, Lumley and Ng's, and the subconvexity bound is Hiary's.
