node:
  id: KLN.v1
  family: KLN
  version: v1
  kind: paper
  status: active

project:
  name: "Kadiri-Lumley-Ng: explicit zero density for the Riemann zeta function"
  description: >-
    An explicit zero density estimate: a bound on the number of zeros of the Riemann zeta function
    in a rectangle to the right of the critical line. Together with a zero-free region, this is
    one of the two analytic inputs the Chebyshev-function bounds rest on. The density estimate
    itself, in a form that names its parameters, so that the nodes consuming it can instantiate
    rather than re-derive.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11M06"]

conclusions:
- id: subconvexity_bound
  declaration: KLN.v1.subconvexity_bound
  challenge: KLN.v1.challenge_subconvexity_bound
  imports:
  - node: Hiary2016.v1
    conclusion: zeta_half_line_bound
  justifications:
  - id: kln-paper
    kind: literature
    source: KLN
    locator: Lemma 3.2, equation (3.2), with the constant corrected
    note: >-
      The paper prints a1 = 0.63 and this node states 0.77. FKS (J. Math. Anal. Appl. 527 (2023) 127426)
      reports that 0.63 rests on an erroneous explicit version of the Cheng-Graham second derivative test,
      gives 0.77 as the corrected value, and says the error 'would render many results concerning the
      prime number theorem unreliable'; it then redoes its own work with 0.77. Stating the printed value
      would put a knowably false claim in the network, which nothing could soundly import -- so the correction
      is made in place rather than by keeping a faithful-to-print version that would have no valid consumer.
      The bound itself is Hiary's, quoted by KLN in the form its density argument uses. A later preprint
      of Hiary, Patel and Yang announces 0.618, which would be a strict improvement and is the natural
      content of a future version of this node. Audited against both sources 2026-08-26 and confirmed
      exact. KLN's Lemma 3.2 (3.2) is '|zeta(1/2 + it)| <= a1 t^(1/6) log t for all t >= 3' with a1 =
      0.63; FKS Remark 1.5(2) gives the same shape and states 'after accounting for this correction, the
      constant, a1, changes to 0.77', and FKS's Tables 7 and 8 record that they are computed with a1 =
      0.77. Shape, range and corrected constant therefore all check out. Imports: KLN's LaTeX source settles
      it -- 'Statement (3.2) is [Hiary, Theorem 1.1]', and its introduction lists among its ingredients
      'the most recent explicit subconvexity bound for the Riemann zeta function (due to Hiary)'. So this
      conclusion is a quotation of Hiary2016.v1.zeta_half_line_bound, and the two statements are deliberately
      identical: this node records that KLN uses it, that one records where it comes from and carries
      the correction's provenance.
  designated: kln-paper

  imports_status: identified
- id: zero_density
  declaration: KLN.v1.zero_density
  challenge: KLN.v1.challenge_zero_density
  imports:
  - node: Platt2017.v1
    conclusion: rh_up_to
  imports_status: identified
  justifications:
  - id: kln-paper
    kind: literature
    source: KLN
    locator: Theorem 1.1, in the simplified form of Platt-Trudgian's Lemma 5
    note: >-
      Asserted on the authority of the paper. Stated in the shape Platt-Trudgian consume rather than the
      paper's own: KLN's Theorem 1.1 carries nine parameters and asserts the existence of constants given
      by formulas several pages away, and nothing downstream uses that generality. Platt-Trudgian's Lemma
      5 states exactly the consequence recorded here and attributes it to this paper, remarking that 'Kadiri,
      Lumley, and Ng produce slightly superior versions of (8), but we have opted for the simpler version'.
      A node wanting the sharper form should state Theorem 1.1 separately. Imports: the paper fixes H_0
      = 3.0610046e10 throughout and cites Platt's Isolating some non-trivial zeros of zeta for it, which
      is Platt2017.v1; Theorem 1.1 concludes 'for any T >= H_0'. That threshold is kept here, though Platt-Trudgian's
      Lemma 5 drops it, because without it the bound would be asserted at heights the paper never considered
      and log T would not be guaranteed positive for the real exponent 5 - 2 sigma. Note the counting
      convention: zetaN' counts real part in the OPEN (sigma, 1) and imaginary part in the OPEN (0, T),
      where the paper counts sigma < beta <= 1 and 0 <= gamma <= T. Ours counts no more zeroes, so the
      conclusion is implied by the paper's rather than overreaching.
  designated: kln-paper
