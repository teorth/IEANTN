  imports_status: identified
  justifications:
    - id: folklore-lean
      kind: none-yet
      source: ZeroCount
      note: >-
        rvm_error_bound_open restricted to T >= 2, with b2 = 0. Solution in
        Solutions/ZeroCountOpen.v1, awaiting Comparator.
  designated: folklore-lean

sources:
- title: "ZeroCount.v1 module docstring: why the two counting conventions are equivalent"
  authors: ["Terence Tao"]
  type: "folklore"
  id: "ZeroCount"
  location: "IEANTN/Nodes/ZeroCount/v1/Conclusions.lean"
  relationship: formalizes
  note: >-
    The argument is written out there in prose (there is s < t with N_Ioc(s) = N_Ioo(t) exactly, and
    letting s rise to t loses no constant), with the ZeroFreeHeight pattern suggested as the shape.
    This node is its Lean statement. Recorded as folklore: every paper switching between the two
    conventions does so without comment.

