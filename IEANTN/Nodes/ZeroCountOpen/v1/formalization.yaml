limitations:
- >-
  ZeroCount.v1.rvm_error_small (strict, |Q(t)| < 1) has no open-convention counterpart here: the limit
  gives only <= 1, and the strict form does not follow from the hypothesis alone. It is not stated in
  a weakened form.
- >-
  No novelty is claimed; the argument is ZeroCount.v1's own.
