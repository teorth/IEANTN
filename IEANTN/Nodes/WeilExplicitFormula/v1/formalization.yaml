  reviewers: ["Harald Andres Helfgott"]
  notes: >-
    The statement was checked against the text of Theorem 12.13 and (12.22) with q = 1:
    log(q/pi) = -log pi, Gamma'/Gamma((s + kappa)/2) at s = 1/2 is Gamma'/Gamma(1/4), and the last
    term of (12.22) is the integral of e^{-pi x}/(1 - e^{-4 pi x}) (2F(0) - F(x) - F(-x)).

limitations:
- >-
  Only the case q = 1. The general case needs Dirichlet L-functions of primitive characters and
  their completed versions; nothing in the network needs it yet.
