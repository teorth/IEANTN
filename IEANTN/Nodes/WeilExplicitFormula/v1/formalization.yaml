    locator: "Theorem 12.13, case q = 1 (chi = chi_0, E_0 = 1, kappa = 0)"
    note: >-
      Montgomery and Vaughan prove Theorem 12.13 for primitive characters modulo any q; this node
      states the case q = 1. ONE DEVIATION IN THE HYPOTHESES, AN EQUIVALENT ONE: (12.21) is an
      integral against |dF|, which Mathlib cannot express, so (12.20) and (12.21) are stated together
      as "x -> e^{a|x|} F(x) is integrable and of bounded variation on R", a = (1/2 + delta_0) 2 pi.
      The two are equivalent: one direction is Montgomery and Vaughan's own remark after the theorem;
      for the other, dF = e^{-a|x|} dG + G d(e^{-a|x|}) with G = e^{a|x|} F. The solution proves the
      equivalence with the printed form, as a Riemann-Stieltjes statement.
      THE IMPORTS ARE THE PROOF'S INPUTS, NOT MONTGOMERY AND VAUGHAN'S: their proof goes through the
      Hadamard product (Theorem 10.12, Corollary 10.14) for Lemma 12.1; the route planned here obtains
      Theorem 10.13 and Lemma 12.2 from Jensen's inequality and the Borel-Caratheodory lemma instead,
      and so does not import ZetaHadamard.v1. The digamma estimates (Theorem C.5, Lemma 12.14, and a
      bound for psi uniform on vertical strips) are proved in the pinned Riemann-Stieltjes library,
      so GammaAsymptotics.v1 is not imported either. Nor is ZetaZeroes.v1: the finiteness of the
      zeroes in compact sets is Mathlib's IsCompact.inter_riemannZetaZeros_finite, and their location
      follows from xi(1 - s) = xi(s) and the non-vanishing of zeta on Re s >= 1.
  designated: montgomery-vaughan

