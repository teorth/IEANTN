  kind: standard
  status: active

project:
  name: "Weil's explicit formula for the Riemann zeta function"
  description: >-
    Theorem 12.13 of Montgomery and Vaughan in the case q = 1: for a test function F with
    e^{(1/2+delta_0) 2 pi |x|} F(x) integrable and of bounded variation, normalized at its jumps and
    with F(x) + F(-x) = 2F(0) + O(|x|), the sums of Phi(rho) over the non-trivial zeroes with
    |Im rho| <= T converge, as T -> infinity, to Phi(0) + Phi(1) plus a Gamma-factor term, a sum over
    prime powers and an integral, where Phi(s) is the integral of F(x) e^{-(s-1/2) 2 pi x}. Used
    with F(x) = e^{2 pi i t x} times the Fourier transform of a band-limited majorant in explicit
    bounds for log |zeta| and 1/zeta under RH.
  authors: ["Harald Andres Helfgott"]
  license: "Apache-2.0"
  responsible_maintainers: ["Harald Andres Helfgott"]

