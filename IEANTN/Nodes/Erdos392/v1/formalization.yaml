# Node metadata for `Erdos392.v1`.  See docs/NODES.md.
#
# Imports nothing, and that is worth a note: the development this comes from uses the Prime Number
# Theorem twice, both times for an upper bound on pi that Mathlib's Chebyshev bound supplies. See
# the Conclusions module docstring.
version: "v0.4"

node:
  id: Erdos392.v1
  family: Erdos392
  version: v1
  kind: paper
  status: awaiting-verification

project:
  name: "Erdos problem 392: decomposing a factorial into few factors of size at most n^2"
  description: >-
    Write A(n) for the least t such that n! is a product of t integers each at most n^2. Erdos asked
    whether A(n) = n/2 - n/(2 log n) + o(n/log n); it is. This node states both halves --
    factors_le_n_sq, the upper bound, which is the content, and factors_le_n_sq_lower, the counting
    argument that matches it -- together with factors_le_n, the intermediate result bounding the
    number of factors of size at most n by n - n/log n + o(n/log n), from which the upper bound
    follows by pairing. Nothing here is conditional: the chain from Mathlib to the asymptotic is
    proof, not citation.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11A51", "11N56"]

conclusions:
- id: factors_le_n
  declaration: Erdos392.v1.factors_le_n
  challenge: Erdos392.v1.challenge_factors_le_n
  imports: []
  imports_status: none
  justifications:
  - id: unjustified
    kind: none-yet
    note: >-
      A Lean proof is in Solutions/Erdos392.v1, awaiting a Comparator receipt. Imports nothing, and
      the none is real: the only non-elementary input is an upper bound on pi(x), and Mathlib's
      Chebyshev.eventually_primeCounting_le supplies it. PrimeNumberTheoremAnd uses the Prime Number
      Theorem here instead, which is more than the argument needs and which its own blueprint note
      says is optional.
  designated: unjustified
  progress:
    solution: Solutions/Erdos392.v1/
    state: in-progress
    remaining_holes: 0
- id: factors_le_n_sq
  declaration: Erdos392.v1.factors_le_n_sq
  challenge: Erdos392.v1.challenge_factors_le_n_sq
  imports: []
  imports_status: none
  justifications:
  - id: unjustified
    kind: none-yet
    note: >-
      A Lean proof is in Solutions/Erdos392.v1, awaiting a Comparator receipt. The upper half of the
      asymptotic the problem asks about, obtained from factors_le_n by pairing factors. Imports
      nothing.
  designated: unjustified
  progress:
    solution: Solutions/Erdos392.v1/
    state: in-progress
    remaining_holes: 0
- id: factors_le_n_sq_lower
  declaration: Erdos392.v1.factors_le_n_sq_lower
  challenge: Erdos392.v1.challenge_factors_le_n_sq_lower
  imports: []
  imports_status: none
  justifications:
  - id: unjustified
    kind: none-yet
    note: >-
      A Lean proof is in Solutions/Erdos392.v1, awaiting a Comparator receipt. Unlike the other two
      conclusions this is NOT a port: PrimeNumberTheoremAnd proves only the upper bound, and a node
      stating half of a two-sided asymptotic invites exactly the misreading this network exists to
      prevent. The proof is four lines of counting on top of Mathlib's effective Stirling bound
      Stirling.le_log_factorial_stirling, and is stated for every n >= 2 rather than eventually.
  designated: unjustified

  progress:
    solution: Solutions/Erdos392.v1/
    state: in-progress
    remaining_holes: 0
