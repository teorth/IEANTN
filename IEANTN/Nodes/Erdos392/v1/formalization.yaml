- title: "Decomposing a factorial into large factors"
  authors: ["Boris Alexeev", "Evan Conway", "Matthieu Rosenfeld", "Andrew V. Sutherland", "Terence Tao",
    "Markus Uhr", "Kevin Ventullo"]
  type: "paper"
  id: "arXiv:2503.20170"
  location: "arXiv:2503.20170, submitted 26 March 2025"
  relationship: background
  note: >-
    Named by PNT+ as the inspiration for the method. Recorded as background rather than as what is
    formalized, because it solves a different problem: it studies t(N), the largest t such that N!
    is a product of exactly N integers all at least t, which is the dual question to the one here.
    Author list and date confirmed against the arXiv abstract page.

related_formalizations:
- id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
  relationship: builds-on
  note: >-
    PrimeNumberTheoremAnd/IEANTN/Erdos392.lean is where the two upper bounds come from, and the
    solution is a port of it. Three differences. Its dependency on the Prime Number Theorem is
    replaced by Mathlib's Chebyshev bound on pi, which is all the argument uses and which makes this
    node unconditional. Its statement of the n^2 bound places the cardinality bound inside the
    quantifier over factors, which is equivalent only because the product condition forces a
    nonempty index type; the statement here does not need that argument. And the lower bound, which
    PNT+ does not prove, is added so that the node states the problem rather than half of it.

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Ported the two upper bounds from PrimeNumberTheoremAnd under the direction of the maintainer,
      rewired their use of the Prime Number Theorem onto Mathlib's Chebyshev bound, replaced the one
      LeanCert-backed log bound they consume with a proof from Mathlib, restated them without the
      quantifier trap, and wrote the lower bound, which is new here rather than ported. The
      mathematics of the upper bounds and their tactic scripts are PNT+'s. Three of its tactic steps
      needed repair against this Mathlib, none of them mathematical: a renamed lemma
      (prod_le_prod became prod_le_prod0 for the nonnegativity-guarded form), two names made
      ambiguous by importing Mathlib wholesale, and one simp set that no longer decomposes a
      Finset.filter membership.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    The two upper bounds are transcribed from the PNT+ development; the lower bound is written here
    and is the only part of this node not derived from it. The problem statement was read from
    erdosproblems.com/392, which states it for factors of size at most n^2, matching
    factors_le_n_sq. The PNT+ dependency was traced by hand: pi_alt' is the only name Erdos392.lean
    takes from outside Mathlib and its own file, and it is used at exactly two places.

limitations:
- >-
  The upper bounds are asymptotic. Each says "for every epsilon > 0, eventually in n", with no
  effective threshold, so neither says anything about any particular n. The lower bound is
  effective, holding for every n >= 2.
- >-
  The lower bound is not a port and has had no review beyond the maintainer's. It is four lines of
  counting, but it is the one part of this node with no upstream to compare against.
- >-
  No novelty is claimed. The upper bounds are the forum argument, formalized in PNT+ before this;
  the lower bound is the standard counting observation that anyone posing the problem would make.
