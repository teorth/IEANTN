# Node metadata for `GammaAsymptotics.v1`.  See docs/NODES.md.
#
# Growth of Gamma and its logarithmic derivative -- textbook asymptotics Mathlib does not have.
# Named for the class: intended to grow, and a plausible eventual contribution to Mathlib.
version: "v0.4"

node:
  id: GammaAsymptotics.v1
  family: GammaAsymptotics
  version: v1
  kind: standard
  status: awaiting-solution

project:
  name: "Growth of the Gamma function and its logarithmic derivative"
  description: >-
    Textbook asymptotics for Gamma and digamma that Mathlib happens not to have, stated once so
    several nodes can import them rather than each carrying a copy. At present one conclusion: the
    digamma function equals log w up to O(1/|w|) in the right half-plane, the leading term of the
    Stirling expansion. Mathlib's Digamma file is sixty-four lines -- a definition, three special
    values, the recurrence and meromorphy -- with no growth bound anywhere, and its Stirling file
    concerns the factorial rather than Gamma in the complex plane. The gap is reached from any
    explicit estimate that shifts a contour into the left half-plane, since the functional equation
    for zeta turns zeta'/zeta into an expression whose digamma term must be controlled.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.CA]
  msc2020: ["33B15", "41A60"]

conclusions:
- id: digamma_sub_log_isBigO
  issue: 64
  declaration: GammaAsymptotics.v1.digamma_sub_log_isBigO
  challenge: GammaAsymptotics.v1.challenge_digamma_sub_log_isBigO
  imports: []
  imports_status: none
  justifications:
  - id: unjustified
    kind: none-yet
    note: >-
      Imports `none`, and that is a real none: w is universally quantified with its condition a
      hypothesis, so a Lean proof is the whole justification.
      EXPECTED ROUTE, which is elementary and does not need Stirling's formula proper. Mathlib has
      the recurrence digamma_apply_add_one, psi(s+1) = psi(s) + 1/s. Iterating it from a compact box
      in Re w in [1,2] -- where psi is continuous, hence bounded, since meromorphic_digamma puts its
      poles at the non-positive integers -- expresses psi(w) as a bounded term plus a partial sum of
      1/(w-j), which is log w + O(1/|w|) by comparison with the harmonic series. The work is in the
      comparison and in making the box argument uniform in the imaginary direction.
      A sharper route through the Gauss or Binet integral representations would give the full
      expansion, and Mathlib's Digamma file lists Gauss' representation as a TODO. Whoever proves
      this should consider whether proving the representation first is cheaper than the recurrence
      argument; it would also give the -1/(2w) term for free.
  designated: unjustified

sources:
- title: "The digamma asymptotic expansion"
  authors: ["folklore"]
  type: "folklore"
  id: "digamma-stirling"
  relationship: formalizes
  note: >-
    Standard material, in every reference on special functions; no particular source is followed and
    none is claimed. The `folklore` source type is used in the sense the schema allows rather than in
    the usual sense -- this is not an unproved fact circulating in the literature, it is a classical
    expansion that Mathlib has not got yet. What is specific to this node is the CHOICE of form: a
    half-plane rather than a sector, and an existential constant rather than a named one.

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Established that Mathlib carries no digamma growth bound, identified the statement CH2's
      ladder argument needs, and chose the form, under the direction of the maintainer. No proof is
      claimed.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    THE FORM WAS CHOSEN, NOT COPIED, and the choices are worth recording. The sharp statement is
    psi(w) = log w - 1/(2w) + O(1/w^2) on a sector |arg w| <= pi - delta. This node states the
    weaker O(1/|w|) on the half-plane Re w >= 1, for two reasons: the half-plane is what the
    applications use, and an explicit constant would invite the kind of numerology the node exists to
    avoid. A consumer wanting the -1/(2w) term, or the sector, should state that as a further
    conclusion here rather than sharpen this one -- they are different statements.
    What the applications actually consume is the corollary ||psi w|| <= ||log w|| + C, hence
    O(log|w|); that follows immediately and is not stated separately.
    Mathlib was checked rather than assumed: Analysis/SpecialFunctions/Gamma/Digamma.lean is 64 lines
    and contains the definition, digamma_zero, digamma_one, digamma_one_half, digamma_apply_add_one
    and meromorphic_digamma, and no bound of any kind. Analysis/SpecialFunctions/Stirling.lean is
    about the factorial, not Gamma on the complex plane.

limitations:
- >-
  Stated but not proved. Nothing downstream may treat it as established, and CH2.v1's ladder
  bounds inherit that.
- >-
  ONE ASYMPTOTIC ONLY, and a weak one. The node is named for the class because it is intended to
  grow: the -1/(2w) term, the sector version, a bound on Gamma itself, and Stirling's formula in the
  complex plane are all wanted and none is here. A consumer needing any of them will not find it.
- >-
  THE CONSTANT IS EXISTENTIAL. A consumer needing an explicit numerical constant -- which an explicit
  estimate eventually will -- cannot get one from this statement and will need a sharper conclusion
  stated alongside it.
- >-
  Re w >= 1 excludes the left half-plane entirely, where digamma has its poles. An application that
  needs psi there must use the reflection formula, which is not stated here either.
- >-
  No novelty is claimed. The expansion is classical.
