    note: >-
      A large finite computation, so `numerical` rather than `literature`. Recorded at second hand: MT
      states 'We select T0 = 3.06e10 as established in [10]' and defines T0 as a height to which the Riemann
      hypothesis has been verified. The paper itself has not been obtained, so its own statement of the
