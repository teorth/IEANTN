  reviewers:
  - Terence Tao
  notes: >-
    Everything here is at second hand, from MT's description of the height it selected. The cited paper
    has not been obtained.
limitations:
- >-
  The cited paper has not been read. The height 3.06e10 is MT's description of what it selected, not a
  quotation of this paper's own statement.
- >-
  The node states only the consequence that there are no zeros off the critical line below that height.
  The computation's real output is a list of zeros, which is data rather than a proposition; a consumer
  needing the zeros themselves needs more than the node says.
- >-
  No novelty is claimed.
