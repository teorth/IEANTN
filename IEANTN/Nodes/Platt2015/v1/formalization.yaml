project:
  name: 'Platt: computing pi(x) analytically'
  description: >-
    The verification of the Riemann hypothesis to height 3.06e10 that Mossinghoff-Trudgian's Theorem 1
    consumes. The node states the part of the computation that is expressible as a proposition -- that
    no zero below that height lies off the critical line -- which is precisely what MT takes from it.
  authors:
  - Terence Tao
  license: Apache-2.0
  responsible_maintainers:
  - Terence Tao
repository:
  role: substantive-development

classification:
  arxiv:
  - math.NT
  msc2020:
  - 11M26
  - 11Y35
  - 11Y70
conclusions:
- id: rh_up_to
  declaration: Platt2015.v1.rh_up_to
  challenge: Platt2015.v1.challenge_rh_up_to
  imports: []
  imports_status: undetermined
  justifications:
  - id: platt-paper
    kind: numerical
    source: Platt2015
    locator: Section 6, the zero computation the paper reports
    note: >-
      A large finite computation, so `numerical` rather than `literature`. Now recorded at FIRST hand:
      the arXiv source (1203.5712) is held, and says 'We isolated all the zeros of zeta to a height of
      30,610,046,000 (103,800,788,359 zeros)', having 'biased the run time towards computing zeros, both
      to confirm RH holds to a height sufficient for this computation'. That is 3.0610046e10, so the 3.06e10
      stated here is implied with room to spare. Earlier this node rested on MT's citation alone. The
      relationship to Platt2017.v1 is now established rather than guessed: they are one computation reported
      in two papers. Computing pi(x) Analytically says 'We isolated all the zeros of zeta to a height
      of 30,610,046,000 (103,800,788,359 zeros)' and cites for the technique a paper then in preparation
      titled 'Computing zeta on the half line', which is what became Isolating some non-trivial zeros
      of zeta. That paper's abstract reports the same height. KLN records N(H_0) = 103 800 788 359 at
      H_0 = 3.0610046e10 -- the same zero count. MT cites the pi(x) paper and rounds the height down to
      3.06e10, which is why this node states the weaker number: it exists to serve MT and states what
      MT selected.
  - id: bridge-from-platt2017
    kind: bridged
    from: Platt2017.v1.rh_up_to
    bridge: IEANTN/Bridges/Platt/P2017ToP2015.lean
    note: >-
      A second, independent ground, and the place where 'same computation, two papers' stops being prose.
      RiemannHypothesisUpTo is antitone in its height, so Platt2017.v1's 3.0610046e10 implies this node's
      3.06e10; the bridge is four lines and is compiled by the core build, so it cannot silently stop
      being a proof. NOT designated: the direct justification above rests on this node's own paper, while
      this one would route trust through another node. Its value is that the relationship is checked on
      every push.
  designated: platt-paper
sources:
- title: Computing pi(x) Analytically
  authors:
  - David J. Platt
  type: paper
  id: arXiv:1203.5712v3; Math. Comp. 84 (2015), 1521-1535
  location: Mathematics of Computation 84 (2015), 1521-1535; doi:10.1090/S0025-5718-2014-02884-6
  relationship: formalizes
  note: >-
    arXiv source held and read. Distinct from Platt's Isolating some non-trivial zeros of zeta, which
    reports the same computation and which this paper cites for the technique under its preprint title,
    and from the later Platt-Trudgian verification to 3e12.
