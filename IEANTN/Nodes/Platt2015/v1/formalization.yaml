    framework: Claude Code
    role: >-
      Created this node and stated the consequence of the computation that MT's Theorem 1 rests on, under
      the direction of the maintainer. No proof is claimed.
review:
  status: self-assessed
  reviewers:
  - Terence Tao
  notes: >-
    The height and the zero count were read from the paper's own LaTeX source. What was previously flagged
    as a guess -- the relationship to Platt2017.v1 -- is now established by the matching height, the matching
    zero count, and this paper's citation of the other for its technique.
limitations:
- >-
  The node states only the consequence that no zero below the height lies off the critical line. The computation's
  real output is a list of isolated zeros; a consumer needing those -- Buthe's algorithm does -- needs
  more than the node says.
- >-
  The node states 3.06e10 where the paper states 3.0610046e10, because 3.06e10 is what MT selects and
  this node exists to serve MT. Platt2017.v1 states the sharper height, and the bridge between them makes
  the implication explicit.
- >-
  Imports are undetermined: what a zero-verification rests on -- the rigorous interval arithmetic and
  the zeta evaluation method -- has not been traced.
- >-
  No novelty is claimed.
