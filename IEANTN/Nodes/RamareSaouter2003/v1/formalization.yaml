    paper's own Theorem 3 prints ]x(1 - 1/28 314 000), x], agreeing.

limitations:
- >-
  Cited, not proved. The inputs are now traced from the published article: the Riemann hypothesis
  up to T_0 = 3.3 x 10^9 in the numerical applications (Wedeniwski), no zero-free region, and an
  algorithmic prime-gap search. imports_status is `traced` rather than `identified` because none
  of those is drawn as an edge: the verification height could become one, and the search never
  can.
- >-
  One instance of a general theorem. The paper's Theorem 3 is stated here at its own constants;
  the surrounding parameterised results -- Theorem 4, which holds for any T_0 -- are not.
- >-
  Superseded for large x by KadiriLumley.v1, whose intervals are narrower above exp(59). This one
  is still needed below that.
