  justifications:
  - id: ramare-saouter-paper
    kind: literature
    source: ramare-saouter
    locator: "Theorem 3, p. 13"
    note: >-
      Asserted on the authority of the paper. Theorem 3 reads: 'Let x be a real number larger than
      10 726 905 041. Then the interval ]x(1 - 1/28 314 000), x] contains at least one prime.' That
      is this conclusion, at these constants.
      The locator previously read "Corollary 1", taken from PrimeNumberTheoremAnd's transcription.
      Corollary 1 of this paper is a different statement -- 'Every odd integer > 1 not more than
      1.13256 x 10^22 is a sum of at most three primes' -- which is what Goldbach.v1 cites it for,
      so the two nodes pointed the same label at different results. Read first hand from the
      published article, free from the first author's page at
      https://ramare-olivier.github.io/Maths/gap.pdf. See issue #271.
      What the result rests on, now traced from that copy: the Riemann hypothesis up to a height
      T_0, where the paper says 'By Wedeniwski [24], we can take T_0 = 3.33 x 10^9, but we shall
      only use T_0 = 3.3 x 10^9 in numerical applications. However Theorem 4 is valid for any T_0'
      (p. 14). No zero-free region is used: 'For so small x's, the infinite zero-free region is of
      course of no use' (p. 12). Also an algorithmic prime-gap search and a sieve, which are
      computations rather than propositions. Transcribed from PrimeNumberTheoremAnd, where it is
      `TMEEMT.RamareSaouter2003.has_prime_in_interval` and carries a `sorry`.
  designated: ramare-saouter-paper

