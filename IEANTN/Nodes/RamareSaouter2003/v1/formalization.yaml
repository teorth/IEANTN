  reviewers: ["Terence Tao"]
  notes: >-
    Statement and locator now read from the published article (free at
    https://ramare-olivier.github.io/Maths/gap.pdf), which corrected the locator from Corollary 1
    to Theorem 3 and let the inputs be traced. Previously both came from PNT+ rather than the
    paper. The interval convention was checked against PNT+'s blueprint text, which states it as
