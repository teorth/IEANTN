review:
  status: self-assessed
  reviewers:
  - Terence Tao
  notes: >-
    The statement is short and the proof is four cases. What deserves scrutiny is the hypothesis exp (2
    / R) < t0 -- whether it is the weakest that works, and whether the exp form really closes the junk-value
    hole the log form leaves open.

limitations:
- >-
  The height cannot be lowered below exp (2 / R). RiemannHypothesisUpTo excludes zeroes with Re s in the
  open interval (1/2, 1) and says nothing at Re s = 1/2, where the nontrivial zeroes actually are, so
  the argument needs the region to stay strictly right of the critical line. For R = 5.5666305 that permits
  t0 > 1.4324; for Bellotti-Trudgian-Yang's R = 4.896 it permits only t0 > 1.5045, so a hardcoded 1.5
  would have covered the first and quietly failed the second.
- >-
  Going below exp (2 / R) needs the height of the first nontrivial zero -- that no zero has 0 < Im s <
  14.134... at all, not merely none off the critical line. That is a different input and a natural second
  conclusion for this node whenever something wants it.
- >-
  Only positive imaginary part is covered, since ClassicalZeroFreeRegion quantifies over t >= t0. The
  literature's |t| form follows from the symmetry of the zeroes about the real axis, but that step is
  not done here.
- >-
  No novelty is claimed. The argument is standard and is used without comment in the sources this network
  already records.
