project:
  name: Lowering the height of a classical zero-free region
  description: >-
    A classical zero-free region is stated above some height -- 2 in Kadiri, Mossinghoff-Trudgian and
    Mossinghoff-Trudgian-Yang, 3 in the Korobov-Vinogradov theorem of the last, 21 in Rosser-Schoenfeld.
    This node supplies the step that lowers that height, given any numerical verification of the Riemann
    hypothesis reaching at least as far: below the old height a zero would have to sit on the critical
    line or right of Re s = 1, and the region excludes both. It is used without comment throughout the
    literature, which is what makes it folklore rather than a citation.
  authors:
  - Terence Tao
  license: Apache-2.0
  responsible_maintainers:
  - Terence Tao

