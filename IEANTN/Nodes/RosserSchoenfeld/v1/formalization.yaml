limitations:
- >-
  Theorem 1 rests on the cited paper; it is not proved in Lean here. The bridge from it to the classical
  shape is.
- >-
  Only positive imaginary part is quantified over. The paper's |t| >= 21 form follows by the symmetry
  of the zeroes about the real axis, which is not done here.
- >-
  Nothing recovers the band 3 <= t < 21, where the network's usual threshold sits and this paper says
  nothing.
- >-
  The paper contains a great many other inequalities. FKBJ's Theorem 2.1 attributes an N(T) formula to
  Rosser, which is the next one with a consumer waiting.
- >-
  No novelty is claimed. The results are Rosser and Schoenfeld's.
