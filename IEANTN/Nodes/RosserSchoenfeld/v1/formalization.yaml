conclusions:
- id: zero_free_region
  declaration: RosserSchoenfeld.v1.zero_free_region
  challenge: RosserSchoenfeld.v1.challenge_zero_free_region
  imports: []
  imports_status: undetermined
  justifications:
  - id: rs-paper
    kind: literature
    source: RosserSchoenfeld
    locator: Theorem 1, equation (1.27)
    note: >-
      Asserted on the authority of the paper, read from the rendered page rather than from extracted text.
      Theorem 1: 'There are no zeros of zeta(s) in the region sigma >= 1 - 1/(R log|t/17|), |t| >= 21',
      with R = 9.645908801. The inequality is >= and not >. An earlier note on this node said >, taken
      from extraction; the rendered page shows the closed form. That is the second wrong transcription
      this failure mode has produced here. Stated in the paper's own shape rather than the network's:
      the log(t/17) denominator makes the region wider than the plain classical one, and forcing it into
      ClassicalZeroFreeRegion would assert something on 3 <= t < 21 that the paper does not prove. Imports
      are undetermined -- what Theorem 1 itself rests on has not been traced.
  designated: rs-paper
- id: zero_free_region_classical
  declaration: RosserSchoenfeld.v1.zero_free_region_classical
  challenge: RosserSchoenfeld.v1.challenge_zero_free_region_classical
  imports: []
  imports_status: none
  justifications:
  - id: bridge-from-shape
    kind: bridged
    from: RosserSchoenfeld.v1.zero_free_region
    bridge: IEANTN/Bridges/RosserSchoenfeld/ToClassical.lean
    note: >-
      The weakening a consumer wants, obtained as a proof rather than as a second transcription. Kadiri2005
      uses R in the plain 1/(R log t) form at heights past 3.3e9; Theorem 1's region contains that one
      because log(t/17) <= log t. The bridge is compiled by the core build, so the weakening cannot silently
      stop being valid. Designated, because there is nothing else here to designate: this conclusion is
      not separately stated by the paper, it is derived from the conclusion above. Imports `none` for
      the same reason -- its one input is a sibling conclusion, which the bridge records, not an import.
  designated: bridge-from-shape

