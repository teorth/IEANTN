project:
  name: "Rosser-Schoenfeld: sharper bounds for the Chebyshev functions theta(x) and psi(x)"
  description: >-
    The classical source of explicit bounds on the Chebyshev functions, and the ancestor of every
    node in this chain. Still cited for the inequalities its successors have not superseded.
    Whichever inequalities downstream nodes actually cite, added one at a time. The paper contains
    a great many, and transcribing them speculatively would be work without a consumer.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

