version: "v0.4"

node:
  id: RosserSchoenfeld.v2
  family: RosserSchoenfeld
  version: v2
  kind: paper
  status: active

project:
  name: "Rosser-Schoenfeld: the b = 23 Chebyshev-psi bound"
  description: >-
    The strict error bound |psi(x) - x| < 0.00020211 x for x >= exp(23),
    assuming RH up to height 1894438.5122: Rosser and Schoenfeld's A = 1894438.51224...,
    rounded down, below which lie exactly the first 3 502 500 zeros. The finite-RH
    assumption is explicit.

  authors: ["IEANTN contributors"]
  license: "Apache-2.0"
  responsible_maintainers: ["IEANTN contributors"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M26"]

conclusions:
- id: psi_error_b23
  declaration: RosserSchoenfeld.v2.psi_error_b23
  challenge: RosserSchoenfeld.v2.challenge_psi_error_b23
  imports: []
  imports_status: none
  justifications:
  - id: integration-pending
    kind: none-yet
    note: >-
      The conclusion is conditional: a consumer supplies RiemannHypothesisUpTo 1894438.5122,
      the paper's own height A = 1894438.51224... rounded down. The pinned external proof
      (Lean 4.35.0) assumes RH up to 1894439, which the LMFDB shows includes one more zero
      (the 3 502 501st, at 1894438.63746...); it has passed independent Comparator replay
      with only propext, Classical.choice, and Quot.sound. That replay is not an IEANTN
      receipt, and it is of the 1894439 version. This solution lowers the height to
      1894438.5122 in five vendored files, regenerating the scalar certificate; each change
      is recorded in Solutions/RosserSchoenfeld.v2/source-provenance.json. The source is
      pinned in Solutions/RosserSchoenfeld.v2/README.md.
      The exact finite-RH vocabulary adapter and network theorem also compile on
      Lean 4.35.0 with only those three axioms. The complete solution also
      compiles on the core Lean 4.34.0-rc2 and Mathlib, and the compared
      theorem's local transitive-axiom audit lists only those three axioms;
      see Solutions/RosserSchoenfeld.v2/validation.md. IEANTN Comparator
      verification remains to be completed.

  - id: comparator
    kind: lean-comparator
    note: 'Comparator accepted the solution. Run: https://github.com/teorth/IEANTN/actions/runs/42554427084'
  designated: comparator

sources:
- title: "Sharper bounds for the Chebyshev functions theta(x) and psi(x)"
  authors: ["J. Barkley Rosser", "Lowell Schoenfeld"]
  type: paper
  id: "https://doi.org/10.1090/S0025-5718-1975-0457373-7"
  location: "Math. Comp. 29 (1975), 243-269; Lemmas 7-9 and Theorem 4"
  relationship: adapts
  note: >-
    The proof retains the quartic smoothing, delta = 0.0000211, the finite-RH height
    (A = 1894438.51224..., rounded down to 1894438.5122), threshold exp(23), and final
    1975 constant. It uses 29 certified zeros and eight
    cancellation subbands instead of the paper's 57-zero head computation.
- title: "RSBounds: the proved b = 23 psi estimate"
  authors: ["RSBounds contributors"]
  type: software
  id: "https://github.com/Garald1/PrimeNumberTheoremAnd/tree/087f4418a84516a34cddaa8883062abfd0fc7e4e/Projects/RSBounds"
  location: "RSBounds/RosserSchoenfeld1975.lean, theorem psi_error_b23"
  relationship: adapts
  note: >-
    Original implementation and independent replay evidence, pinned before the
    IEANTN integration. Its finite-RH predicate is converted to the network vocabulary.
    Its finite-RH height is 1894439; this integration lowers it to 1894438.5122.

automation:
  methods:
  - method: agent
    models: ["GPT-6 (OpenAI)"]
    framework: "OpenAI Codex"
    role: >-
      Prepared the conditional node and integration of the published RSBounds proof.
  - method: agent
    models: ["Claude (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Compiled the complete solution on the core Lean 4.34.0-rc2 and Mathlib, made and
      recorded the proof-script compatibility edits, fixed the solution library's roots,
      lowered the finite-RH height to 1894438.5122 (regenerating the scalar certificate
      with the pinned generator), and ran the local type-match and axiom pre-checks,
      under human direction.


review:
  status: self-assessed
  reviewers: ["OpenAI Codex"]
  notes: >-
    The solution builds on the core toolchain and passes the local pre-checks,
    and Comparator has since accepted it: https://github.com/teorth/IEANTN/actions/runs/42554427084.
    No human mathematical review is claimed.


limitations:
- "RH up to height 1894438.5122 remains an explicit assumption."
- "The external Lean 4.35.0 replay does not establish compatibility with IEANTN's pinned environment."
- "The external replay is of the pinned source at height 1894439; the lowered-height proof is compiled
  and audited locally on the core toolchain only."
- "This node asserts neither an unconditional psi bound nor the 1976 constant 0.00020171."
- "No novelty is claimed; the argument adapts Rosser and Schoenfeld's quartic method."
