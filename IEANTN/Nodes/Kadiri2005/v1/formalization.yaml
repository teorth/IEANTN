project:
  name: "Kadiri: an explicit zero-free region for the Riemann zeta function"
  description: >-
    An explicit zero-free region of classical de la Vallee Poussin shape: zeta has no zeros in a
    region defined by an explicit constant. The other analytic input, alongside a zero density
    estimate, to explicit bounds on the Chebyshev functions. The zero-free region, stated with its
    constant as a parameter rather than baked in, so that a later sharpening -- `MTY`, for
    instance -- can be swapped in by a downstream node without restating anything.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11M26"]

conclusions:
- id: zero_free_region
  declaration: Kadiri2005.v1.zero_free_region
  challenge: Kadiri2005.v1.challenge_zero_free_region
  imports:
  - node: RosserSchoenfeld.v1
    conclusion: zero_free_region_classical
  - node: Wedeniwski.v1
    conclusion: rh_up_to
  imports_status: identified
  justifications:
  - id: kadiri-paper
    kind: literature
    source: Kadiri2005
    locator: the paper's main theorem, as reported by MT Table 1 and Section 2
    note: >-
      Asserted on the authority of the paper, now read FIRST HAND from the published version, Acta Arith.
      117.4 (2005). Theoreme 1.1 (Principal): 'La fonction zeta de Riemann ne s'annule jamais dans la
      region suivante : Re s >= 1 - 1/(R_0 log(|Im s|)), |Im s| >= 2, avec R_0 = 5.69693.' Constant, threshold
      and the closed form all confirmed. The node previously recorded this at second hand from MT, and
      the arXiv preprint held alongside gives the weaker 5.70176, which -- since MT starts from R = 5.7
      and a smaller R is the stronger claim -- could not have supported the edge into MT. The published
      version was therefore load-bearing, and now it is held. Imports, both now edges. The paper takes
      its starting region from Rosser-Schoenfeld: 'Grace au resultat de Rosser, nous prenons tout d'abord
      R = 9.645908801', which is RosserSchoenfeld.v1.zero_free_region_classical -- the plain-shaped form,
      since Kadiri uses 1/(R log t) at heights past 3.3e9, and that form is bridged from the paper's own
      log(t/17) shape. And its height: 'pour T_0, nous prendrons la valeur de S. Wedeniwski, c'est a dire
      tres exactement 3 330 657 430.697', which is Wedeniwski.v1. Note what the second edge costs. Wedeniwski
      is the weakest evidence in the network -- a website, unpublished, with documented doubts -- so this
      conclusion, and everything downstream of it as far as FKS2, rests on it. Discharging Wedeniwski
      by a bridge from Platt2017 would remove that without changing any statement, and is the obvious
      next move.
  designated: kadiri-paper

