project:
  name: "Kadiri: an explicit zero-free region for the Riemann zeta function"
  description: >-
    An explicit zero-free region of classical de la Vallee Poussin shape: zeta has no zeros in a
    region defined by an explicit constant. The other analytic input, alongside a zero density
    estimate, to explicit bounds on the Chebyshev functions. The zero-free region, stated with its
    constant as a parameter rather than baked in, so that a later sharpening -- `MTY`, for
    instance -- can be swapped in by a downstream node without restating anything.
  authors: ["Terence Tao"]
