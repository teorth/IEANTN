limitations:
- >-
  The conclusion rests on the cited paper, and on MT's report of the published version rather than on
  that version itself; it is not proved in Lean here.
- >-
  The value stated is the published 5.69693. The arXiv preprint held locally gives 5.70176, and that value
  is too weak to support MT's use: MT starts from R = 5.7, and 5.70176 exceeds it. Obtaining the published
  version is therefore required to put the Kadiri-to-MT edge on first-hand evidence, not merely desirable.
- >-
  Imports are traced but not drawn. Rosser-Schoenfeld is a node that states nothing yet; Wedeniwski's
  height comes from a website.
- >-
  No novelty is claimed. The result is Kadiri's.
