review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    THE UNPAIRED STATEMENT WOULD HAVE BEEN VACUOUS, NOT WRONG, WHICH IS WORSE. The textbook form
    sums (1/(s-rho) + 1/rho) over the non-trivial zeroes in order of |Im rho|; that family is not
    absolutely summable, and Lean's tsum of a non-summable family is 0, so a conclusion built from
    IEANTN.zetaZeroesSum in the obvious way would typecheck and assert nothing. The Vocabulary
    docstring on zetaZeroesSum flags exactly this trap and names the fix -- state a regularised
    form -- and that is what was done. HasSum was chosen over tsum for the same reason: it carries
    summability as part of the claim.
    THE HYPOTHESES ARE FOUR, AND TWO OF THEM DO DOUBLE DUTY. s /= 1 and w /= 1 keep the 1/(s-1)
    terms finite and stay off the pole of zeta. zeta(s) /= 0 and zeta(w) /= 0 make the logarithmic
    derivatives finite, keep s and w off the zeroes the sum divides by, AND keep psi(s/2+1) off its
    poles: psi has poles exactly at 0, -1, -2, ..., so psi(s/2+1) has poles exactly at
    s = -2, -4, -6, ..., which are the trivial zeroes of zeta. A separate hypothesis for the digamma
    term was drafted and then removed as redundant.
    THE INDEX SET IS THE CRITICAL STRIP, and that is a choice worth stating. zetaZeroesIn
    (Set.Ioo 0 1) Set.univ is exactly the non-trivial zeroes, because zeta has no zeroes with
    Re rho >= 1 and none with Re rho <= 0 apart from the trivial ones at -2, -4, ... . Writing it
    as a strip rather than as "not a negative even integer" keeps the statement in the vocabulary
    the rest of the network already uses for zero counting.
    CHECKED NUMERICALLY BEFORE BEING WRITTEN, AND THE CHECK IS INDIRECT BECAUSE IT HAS TO BE.
    At s = 0.3+5i, s = -3+2i and s = 0.5+30i against w = 3/2 + i t, summing zeroes and conjugates
    out to N = 2000. The paired terms are only O(1/|rho|^2), so partial sums converge like
    log(T/2pi)/(2pi T) and about three digits is all a direct sum buys; raw agreement is therefore
    not what was established. What was established is that the residual IS the truncation tail.
    Three things say so. It decreases monotonically, roughly halving as N quadruples, which is the
    Riemann-von Mangoldt rate. IT IS ALMOST PURELY REAL, WHICH IS THE SHARP TEST: in all three
    cases w - s is real, so the tail terms (w-s)/((s-rho)(w-rho)) are approximately (w-s)/rho^2 and,
    summed over conjugate pairs, real to leading order -- so the IMAGINARY parts are free of the
    tail, and they agree to NINE significant figures at N = 2000 (relative 4e-7, 5.9e-7 and 1.9e-9)
    while the real residuals are still 1e-3. And in differentiated form,
    (zeta'/zeta)'(s) = -sum 1/(s-rho)^2 - psi'(s/2+1)/4 + 1/(s-1)^2, where the terms are
    O(1/|rho|^3), the residual is independent of s to four digits across four test points and its
    ratio between N = 100 and N = 400 is 0.428 observed against 0.443 predicted.
    AN EARLIER DRAFT OF THIS NOTE SAID "to 12 digits", which was wrong -- that was the working
    precision, not the agreement. Corrected here rather than left to be discovered.

limitations:
- >-
  THE JUSTIFICATION IS THE LITERATURE, NOT A RECEIPT. Montgomery and Vaughan prove Corollary 10.14;
  this node asserts it on that authority, plus the one line of algebra that turns their statement
  into the subtracted one. Nothing here has been through Comparator.
- >-
  A LEAN PROOF IS A REAL PROJECT, and that is the honest reason there is no solution. It needs the
  Hadamard factorisation of xi: that xi is entire of order 1, which needs a growth bound; that the
  zeroes satisfy sum 1/|rho|^2 < infinity, which needs Jensen's formula; and the product formula
  itself. Mathlib has none of these for xi. It does now have the discreteness of the zero set
  (Mathlib.NumberTheory.LSeries.ZetaZeros, 2026), which is a start and not much more.
- >-
  ONE IDENTITY, AND ONLY IN SUBTRACTED FORM. A consumer who genuinely needs the unsubtracted
  expansion, with its constant and its symmetric ordering, gets nothing from this conclusion. That
  is deliberate: the unsubtracted form cannot be stated in Lean without either fixing a summation
  order or naming the constant, and no consumer in this network needs it.
- >-
  THE MULTIPLICITY CONVENTION IS zetaOrder, matching IEANTN.zetaZeroesSum. If a zero were ever a
  pole -- it is not, zeta being holomorphic away from s = 1 -- zetaOrder would be negative and the
  weight would have the wrong sign. The convention is safe here and is recorded because it is the
  kind of thing that is safe until it is not.
- >-
  No novelty is claimed. The identity is classical and is not this repository's.
