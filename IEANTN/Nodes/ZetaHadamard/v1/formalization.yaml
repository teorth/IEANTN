# Node metadata for `ZetaHadamard.v1`.  See docs/NODES.md.
#
# The partial-fraction expansion of zeta'/zeta -- the Hadamard product for xi, differentiated.
# Textbook material Mathlib has not got; stated in paired form so that it is not vacuous.
version: "v0.4"

node:
  id: ZetaHadamard.v1
  family: ZetaHadamard
  version: v1
  kind: standard
  status: active

project:
  name: "The partial-fraction expansion of the logarithmic derivative of zeta"
  description: >-
    The identity zeta'/zeta(s) = sum over non-trivial zeroes rho of (1/(s-rho) + 1/rho)
    - psi(s/2+1)/2 - 1/(s-1) + C, which comes from the Hadamard factorisation of xi and is
    Corollary 10.14 of Montgomery and Vaughan. It is the only route from the zeroes of zeta to the
    size of zeta'/zeta inside the critical strip, and every explicit estimate of the shape
    "zeta'/zeta(s) is its nearby zeroes plus O(log t)" -- Titchmarsh Theorem 9.6(A) and its
    explicit descendants -- starts from it. Mathlib has the functional equation, the Dirichlet
    series and the discreteness of the zero set, but not the Hadamard factorisation, so this is
    stated once here rather than inside one paper's solution. The node states the identity taken at
    two points and SUBTRACTED, which removes both the additive constant and the conditional
    convergence of the unpaired sum: the paired terms are O(1/|rho|^2), so the claim can be made
    with HasSum, which asserts summability rather than leaving a tsum to fall back on its junk
    value of zero.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11M06", "11M26"]

conclusions:
- id: logDeriv_partial_fractions
  declaration: ZetaHadamard.v1.logDeriv_partial_fractions
  challenge: ZetaHadamard.v1.challenge_logDeriv_partial_fractions
  imports: []
  imports_status: none
  justifications:
  - id: montgomery-vaughan
    kind: literature
    source: MontgomeryVaughan2007
    locator: "Corollary 10.14"
    note: >-
      Montgomery and Vaughan prove the unsubtracted identity, with the constant left implicit and
      the sum over zeroes taken in the symmetric order. THIS NODE STATES THE DIFFERENCE OF THAT
      IDENTITY AT TWO POINTS, and the step from theirs to this is subtraction: nothing analytic is
      added and nothing is weakened. What subtraction buys is that the constant cancels -- so no
      normalisation has to be pinned down -- and that the terms become
      (w-s)/((s-rho)(w-rho)) = O(1/|rho|^2), hence absolutely summable, so the claim can be made
      with HasSum and carries its own convergence.
      THE SUBTRACTED FORM IS ALSO THE FORM CONSUMERS USE. Titchmarsh Theorem 9.6(A), and its
      explicit version as Chirre-Helfgott's prop:titch96A, evaluate the identity at s and at
      s_+ = sigma_+ + i t with sigma_+ > 1 and subtract; the unsubtracted version never appears.
      Davenport chapter 12 gives the same identity, as does Titchmarsh's own chapter 3.
      IMPORTS `none`, AND IT IS A REAL NONE. s and w are universally quantified with every side
      condition a hypothesis, so this conclusion consumes nothing from the network.
      A LEAN SOLUTION IS NOT CHEAP. It would need the Hadamard factorisation of xi -- order-one
      entire function, Jensen's formula, the product over zeroes -- none of which Mathlib has. That
      is why the designated justification is the literature and not a receipt; see `limitations`.
  designated: montgomery-vaughan

