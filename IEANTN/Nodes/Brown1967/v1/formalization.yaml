project:
  name: 'Brown: the aliasing error in the sampling theorem'
  description: >-
    The aliasing bound Platt2017 uses as its Theorem 4.4. States nothing yet: the result worth stating
    is Brown's own Theorem 1, which is stronger than the form Platt uses, and encoding it correctly needs
    Fourier vocabulary the network does not otherwise have and a symmetric limit rather than a tsum. Both
    obstacles are recorded in the Lean file.
  authors:
