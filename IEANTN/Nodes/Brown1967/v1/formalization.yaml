conclusions: []
sources:
- title: On the error in reconstructing a non-bandlimited function by means of the bandpass sampling
    theorem
  authors:
  - J. L. Brown, Jr.
  type: paper
  id: J. Math. Anal. Appl. 18 (1967), 75-84
  location: Journal of Mathematical Analysis and Applications 18 (1967), 75-84
  relationship: formalizes
  note: >-
    Held and read. Brown states the result Platt uses as 'Weiss's theorem', citing P. Weiss, An estimate
    of the error arising from misapplication of the sampling theorem, Amer. Math. Soc. Notices 10 (1963),
    351, Abstract No. 601-54 -- an abstract with no proof. Brown's own Theorem 1 is stronger and is proved
    here.
