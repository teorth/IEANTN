review:
  status: self-assessed
  reviewers:
  - Terence Tao
  notes: >-
    The identification of Platt's Theorem 4.4 with Brown's equation (5) was checked hypothesis by hypothesis
    and constant by constant, including the Fourier convention conversion. What has not been checked is
    the Weiss abstract itself, which is not held.
limitations:
- >-
  States nothing. The obstacles are recorded in the Lean file: Fourier vocabulary the network does not
  otherwise use, and a sum that is a symmetric limit rather than a tsum -- writing `sum' n : ℤ` would
  assert something Brown does not prove and, since tsum of a non-summable family is 0, would become a
  different and probably false claim rather than a vacuous one.
- >-
  The attributed original, Weiss's 1963 Notices abstract, is not held and contains no proof.
- >-
  No novelty is claimed.
