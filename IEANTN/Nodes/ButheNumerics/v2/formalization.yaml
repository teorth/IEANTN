- title: "An analytic method for bounding psi(x)"
  authors: ["Jan Buthe"]
  type: "paper"
  id: "https://doi.org/10.1090/mcom/3264"
  location: "Math. Comp. 87 (2018), no. 312, 1991-2009; Lemma 3 and the proof of Theorem 2"
  relationship: formalizes
  note: >-
