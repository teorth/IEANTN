review:
  status: self-assessed
  reviewers:
  - Terence Tao
  notes: >-
    The height and the claim were read from the paper's own abstract. The relationship to Platt2015.v1
    is established, not assumed: matching height, matching zero count, and the other paper citing this
    one for its technique under its preprint title. A bridge records the implication.
limitations:
- >-
  The node states only the consequence that no zero below the height lies off the critical line. The computation's
  real output is a list of isolated zeros to a precision of 2^-102, which is data rather than a proposition;
  a consumer needing the zeros themselves needs more than the node says.
- >-
  Its relationship to Platt2015.v1 is one computation reported in two papers, established from both sources
  rather than assumed. This node's 3.0610046e10 implies that node's 3.06e10, and IEANTN/Bridges/Platt/P2017ToP2015.lean
  discharges it.
- >-
  Imports are undetermined: what a zero-verification rests on -- the rigorous arithmetic and the zeta
  evaluation method -- has not been traced.
- >-
  No novelty is claimed.
