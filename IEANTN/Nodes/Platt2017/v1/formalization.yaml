review:
  status: self-assessed
  reviewers:
  - Terence Tao
  notes: >-
    The height and the claim were read from the paper's own abstract. What wants checking is the relationship
    to Platt2015.v1 -- whether these are one computation reported twice, which the notes assume but do
    not establish.
limitations:
- >-
  The node states only the consequence that no zero below the height lies off the critical line. The computation's
  real output is a list of isolated zeros to a precision of 2^-102, which is data rather than a proposition;
  a consumer needing the zeros themselves needs more than the node says.
- >-
  Its relationship to Platt2015.v1 is recorded as a guess. This node's 3.0610046e10 implies that node's
  3.06e10, and a bridge would let the second-hand node borrow this one's first-hand evidence, but whether
  they are the same computation is not established here.
- >-
  Imports are undetermined: what a zero-verification rests on -- the rigorous arithmetic and the zeta
  evaluation method -- has not been traced.
- >-
  No novelty is claimed.
