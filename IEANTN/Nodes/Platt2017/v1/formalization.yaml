project:
  name: 'Platt: isolating some non-trivial zeros of zeta'
  description: >-
    The verification of the Riemann hypothesis to height 3.0610046e10 that KLN fixes as its H_0. Unlike
    the network's other computational nodes this one is recorded at first hand: the paper is held and
    its abstract states the height and the claim directly.
  authors:
