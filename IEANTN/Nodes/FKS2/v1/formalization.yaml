version: "v0.4"

node:
  id: FKS2.v1
  family: FKS2
  version: v1
  kind: paper
  status: active

project:
  name: "Fiori-Kadiri-Swidinsky: sharper bounds for the error term in the prime number theorem"
  description: >-
    Two conversion pipelines carrying admissible classical bounds along psi -> theta -> pi, together with
    the explicit numerical bounds the paper obtains by running the best available inputs through them.
    This node exports three of those numerical outputs: a classical bound for E_theta, one row of the
    Table 6 classical bounds for E_pi, and the headline estimate |pi(x) - Li(x)| <= 0.4298 x / log x for
    x >= 2. The pipelines themselves are not stated yet; see the Conclusions module docstring for what
    they need first.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M06", "11M26", "11N56"]

conclusions:
- id: corollary_14
  declaration: FKS2.v1.corollary_14
  challenge: FKS2.v1.challenge_corollary_14
  imports:
  - node: FKS.v1
    conclusion: psi_classical_bound
  - node: BKLNW.v1
    conclusion: corollary_5_1
  - node: BKLNW.v1
    conclusion: theta_error_le_one
  justifications:
  - id: fks2-paper
    kind: literature
    source: FKS2
    locator: Corollary 14
    note: >-
      Asserted on the authority of the paper. The parameters are transcribed from PNT+'s formalization
      of the same corollary (PrimeNumberTheoremAnd/IEANTN/FKS2.lean, `corollary_14`), which proves it
      in Lean from the paper's Proposition 13 and its numerical inputs; that proof is complete there,
      so this is a conclusion a port could justify rather than a bare citation. Imports: FKS supplies
      the E_psi bound that Proposition 13 converts. The other input the paper names is BKLNW -- Corollary
      5.1 for the coefficients a1, a2 in Proposition 13's multiplier, and Tables 13 and 14 to cover 2
      <= x <= e^30 -- both of which are now recorded. Corollary 5.1 is stated on 7 <= b <= 38 log 10,
      which covers the x0 = e^30 this proof uses; Tables 13 and 14 enter as the single inequality E_theta(x)
      <= 1 on [2, e^30] that the proof actually consumes. Absolute values, checked against the rendered
      page. FKS (1.1) defines E_psi(x) = |(psi(x) - x)/x| and FKS2 (1) and (2) define E_pi, E_theta and
      E_psi the same way, all with bars, exactly as this network's Vocabulary does. An earlier note here
      claimed the papers defined these signed and that the conclusions were therefore stronger than the
      printed corollaries; that was wrong. PDF text extraction silently drops absolute-value bars around
      a displayed fraction, and the definitions were read from extracted text. They have since been read
      from the rendered page, where the bars are plainly there. Nothing about the statements needed to
      change.
  designated: fks2-paper
  imports_status: identified
  progress:
    solution: Solutions/FKS2.v1/
    state: in-progress
    remaining_holes: 10
- id: corollary_23
  declaration: FKS2.v1.corollary_23
  challenge: FKS2.v1.challenge_corollary_23
  imports:
  - node: FKS.v1
    conclusion: psi_classical_bound
  - node: Buthe.v1
    conclusion: theorem_2_li_minus_pi
  - node: FKS2Numerics.v1
    conclusion: table6_row2_floor
  justifications:
  - id: fks2-paper
    kind: literature
    source: FKS2
    locator: Corollary 23, Table 6, row [0.826, 0.25, 1.00, 1.000]
    note: >-
      Asserted on the authority of the paper. PNT+ states this corollary for every row of Table 6 and
      leaves it `sorry`, so unlike Corollary 14 there is no existing Lean proof to port. Note the fourth
      column of Table 6 is log x0, not x0; the threshold recorded here is exp 1. Imports: Rests on Corollary
      22, hence on the same FKS input, and on Buthe's Theorem 2 to verify the range x < 10^19. FKS's Table
      6 and its Lemmas 5.2 and 5.3 are also cited, the former as data and the latter as a method of interpolation
      rather than as a claim consumed; neither is an import edge. Absolute values, checked against the
      rendered page. FKS (1.1) defines E_psi(x) = |(psi(x) - x)/x| and FKS2 (1) and (2) define E_pi, E_theta
      and E_psi the same way, all with bars, exactly as this network's Vocabulary does. An earlier note
      here claimed the papers defined these signed and that the conclusions were therefore stronger than
      the printed corollaries; that was wrong. PDF text extraction silently drops absolute-value bars
      around a displayed fraction, and the definitions were read from extracted text. They have since
      been read from the rendered page, where the bars are plainly there. Nothing about the statements
      needed to change. Imports the paper's own small-x check as FKS2Numerics.v1.table6_row2_floor. That
      datum pins the x_0 = e threshold this row states: on [e, e^6] the bound is a finite arithmetic check,
      and only above the window does the asymptotic argument carry it. Upstream threads the same datum
      as a deliberate `sorry`; separating it into a computational node is what lets a solution here be
      free of sorryAx while resting on exactly the same computation.
  designated: fks2-paper
  imports_status: identified
  progress:
    solution: Solutions/FKS2.v1/
    state: in-progress
    remaining_holes: 10
