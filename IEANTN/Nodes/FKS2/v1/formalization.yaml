# Node metadata for `FKS2.v1`.  See docs/NODES.md.
#
# Four corollaries of the paper, all `lean-comparator` verified.
version: "v0.4"

node:
  id: FKS2.v1
  family: FKS2
  version: v1
  kind: paper
  status: active

project:
  name: "Fiori-Kadiri-Swidinsky: sharper bounds for the error term in the prime number theorem"
  description: >-
    Two conversion pipelines carrying admissible classical bounds along psi -> theta -> pi, together with
    the explicit numerical bounds the paper obtains by running the best available inputs through them.
    This node exports four of those numerical outputs: Corollary 14, a classical bound for E_theta;
    Corollary 22, the headline asymptotic |pi(x) - Li(x)| <= 9.2211 x sqrt(log x) exp(-0.84768363
    sqrt(log x)) for x >= 2; Corollary 23 at the [0.826, 0.25, 1.00, 1.000] row of Table 6; and Corollary
    26, |pi(x) - Li(x)| <= 0.4298 x / log x for x >= 2. The pipelines themselves live on FKS2.v2, the
    pipeline variant, and are imported here rather than restated.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11M06", "11M26", "11N56"]

