    note: >-
      Asserted on the authority of the paper. PNT+ proves it in Lean from Corollary 23 together with a
      direct argument on [2, e); since Corollary 23 is `sorry` there, that proof is conditional in PNT+
      and porting it here would need Corollary 23 first. The paper itself obtains the estimate by combining
      Corollary 23 above 10^19 with Buthe's estimates below it and explicit checks on small x. Imports:
      Buthe's Theorem 2 covers 97 <= x <= 10^19 -- (1.9) for the bound and (1.10) for its sign, which
      together give the two-sided estimate. Below 97 the paper checks the 25 relevant prime intervals
      directly and above 10^19 it uses its own Theorem 6 with Table 4; both are internal and neither is
      an import. Absolute values, checked against the rendered page. FKS (1.1) defines E_psi(x) = |(psi(x)
      - x)/x| and FKS2 (1) and (2) define E_pi, E_theta and E_psi the same way, all with bars, exactly
      as this network's Vocabulary does. An earlier note here claimed the papers defined these signed
      and that the conclusions were therefore stronger than the printed corollaries; that was wrong. PDF
      text extraction silently drops absolute-value bars around a displayed fraction, and the definitions
      were read from extracted text. They have since been read from the rendered page, where the bars
      are plainly there. Nothing about the statements needed to change. ROUTE CHANGE, and the imports
      above follow it. This conclusion is now derived from Corollary 23 rather than the paper's own route,
      so its imports are exactly Corollary 23's; the previous list (Buthe's two conclusions) followed
      the paper, which proves cor:weak numerically throughout -- 25 prime intervals below 97, Buthe on
      [97, 10^19], a numerical table above. Going via Corollary 23 is what PrimeNumberTheoremAnd does
      and is far cheaper here, because we need Corollary 23 anyway and the residual is then ENTIRELY ELEMENTARY:
      above e the row-2 curve 0.826 sqrt(u) e^{-u} never exceeds 0.413 (by e^{-u} <= 1/(1+u) and 2 sqrt(u)
      <= 1+u; true supremum 0.3543 at u = 1/2), and below e one has pi(x) = 1, 0 <= Li(x) <= 2 and log
      x / x <= 1/e, giving E_pi <= 1/e = 0.3679. Both halves are proved in Solutions/FKS2.v1/Corollary22.lean,
      so this conclusion needs no numerical claim of its own. Buthe's second conclusion (theorem_2_li_gt_pi)
      is no longer needed and has been dropped.
