review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    Statements were first transcribed from PNT+'s formalization of the same paper, whose definitions of
    E_psi, E_theta, E_pi and the admissible bound were checked line by line against this repository's
    Vocabulary and agree, including the use of the offset Li rather than li. They have since been read
    against the paper itself. The published version -- Res. Number Theory 9 (2023), Paper No. 63, the
    version this node's sources[].id cites -- is now held alongside the arXiv preprint, and the two agree
    on every constant: extracting each decimal in document order gives 692 distinct values in the preprint
    and 693 in the published version, differing only in the DOI and one occurrence of the arXiv id. See
    docs/SOURCES.md.

limitations:
- >-
  Each conclusion is proved in Lean here, but only CONDITIONALLY: the step from its imports to its
  statement is what Comparator checked. The imports themselves are not proved here. In particular
  FKS2Numerics.v1's five finite computations are asserted on the paper's authority and have not been
  re-run, and FKS.v1 and BKLNW.v1 are cited, so anything downstream inherits all of that.
- >-
  Two errata in the source paper, both still present in the published version. Lemma 10's `a = 0`
  bullet states that g decreases for all log(x) > -2b/c, where its own proof derives that the
  derivative is negative when u < -2b/c -- the inequality is reversed. And Corollary 11 states
  B >= 1 + C^2/(16R), where discharging it through Lemma 10's first bullet needs the strict
  B > 1 + C^2/(16R); at equality one falls into the second bullet, which gives decrease only above a
  threshold. Neither affects the corollaries stated here, which do not route through the equality case.
- >-
  Tables 6 and 7 are exported one row deep. Corollary 23 holds for every row of Table 6 and Corollary
  24 for every row of Table 7; stating them in full wants the tables as a data structure in Vocabulary.
- >-
  No novelty is claimed. The results are Fiori, Kadiri and Swidinsky's.
