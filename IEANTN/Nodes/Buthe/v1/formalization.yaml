project:
  name: "Buthe: an analytic method for bounding psi(x)"
  description: >-
    Numerical estimates for the Chebyshev functions and for pi on [1, 10^19], obtained by an analytic
    method resting on a verification of the Riemann hypothesis to a finite height. This is the node that
    covers the low range for the rest of the network: FKS2's Corollaries 23 and 26 both use Theorem 2
    below 10^19 and their own machinery above it.
  authors:
  - Terence Tao
  license: "Apache-2.0"
  responsible_maintainers:
  - Terence Tao

