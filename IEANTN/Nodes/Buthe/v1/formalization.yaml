  - Terence Tao
  notes: >-
    Read from the preprint PDF directly rather than from a secondary source. The inequality directions
    and ranges were checked against the rendered page, since the plain-text extraction misaligned them.

limitations:
- >-
  Every conclusion rests on the cited paper; none is proved in Lean here.
- >-
  (1.8), (1.9) and (1.10) are stated against li rather than Li, and (1.8) against the Riemann prime-counting
  function pi* rather than pi. A node consuming them alongside FKS2, which works with Li and pi, must
  do the conversions rather than assume them away.
- >-
  The import of FKBJ.v1 records a real dependency but understates it: Buthe's algorithm takes the tabulated
  zeros as input, and the network can state only that there are none off the critical line below that
  height.
- >-
  Theorem 2 is now stated in full, (1.5) through (1.10). The paper's other results -- the sieve bound
  of Section 6 and the Table 1 data that PNT+ formalizes -- are not stated; the table is the natural first
  use of a Tables.lean in this node.
- >-
  No novelty is claimed. The results are Buthe's.
