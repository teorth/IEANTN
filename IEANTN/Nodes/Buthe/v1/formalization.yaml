    locator: Theorem 2, equation (1.8)
    note: >-
      Asserted on the authority of the paper, transcribed from arXiv:1511.02032v2. Note the estimate is
      against li, the un-offset logarithmic integral, not Li; the two differ by li(2) = 1.045..., which
      is far from negligible at this precision. This one is about the Riemann prime-counting function
      pi*, not pi. The two differ by roughly sqrt(x)/log x in this range, which is the size of the bound
      itself, so reading it as a statement about pi would be vacuous rather than merely imprecise. Imports:
