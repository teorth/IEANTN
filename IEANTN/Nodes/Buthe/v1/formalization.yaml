  - 11Y35
  - 11M26

conclusions:
- id: theorem_2_psi
  declaration: Buthe.v1.theorem_2_psi
  challenge: Buthe.v1.challenge_theorem_2_psi
  imports:
  - node: FKBJ.v1
    conclusion: rh_up_to
  imports_status: traced
  justifications:
  - id: buthe-paper
    kind: literature
    source: Buthe
    locator: Theorem 2, equation (1.5)
    note: >-
      Asserted on the authority of the paper, transcribed from arXiv:1511.02032v2. Imports: Buthe states
      that the algorithm 'has been implemented and used to calculate analytic bounds for x <= 10^19, using
      the zeros with imaginary part up to 10^11, whose calculation has been reported in [5]' -- Franke,
      Kleinjung, Buthe and Jost, recorded as FKBJ.v1. That is the only external input Theorem 2 has; the
      analytic method is the paper's own. The edge understates the dependency, because the algorithm consumes
      the tabulated zeros themselves and the network can only state their consequence; see FKBJ.v1's limitations.
      Audited against arXiv:1511.02032v2 on 2026-08-26 and confirmed exact: all six equations of Theorem
      2 match in constant, threshold and strictness, and the vocabulary matches the paper's own (1.4)
      -- li is the principal-value integral from 0, pi* is the Riemann prime-counting function. Reclassified
      from `identified` to `traced`: the edge to FKBJ.v1 is real, but as the note above says it understates
      the dependency -- the algorithm consumes the tabulated zeros themselves, and a table is not a proposition.
      `traced` is the value for exactly that, so the understatement is now visible in the graph rather
      than only in this note.
  designated: buthe-paper
