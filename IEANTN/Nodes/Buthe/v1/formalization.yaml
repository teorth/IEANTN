limitations:
- >-
  Every conclusion rests on the cited paper; none is proved in Lean here.
- >-
  (1.9) and (1.10) are stated against li rather than Li. A node consuming them alongside FKS2, which works
  with Li, must do the conversion rather than assume it away.
- >-
  Theorem 2's remaining parts, (1.7) and (1.8), are not stated; add them when something needs them.
- >-
  No novelty is claimed. The results are Buthe's.
