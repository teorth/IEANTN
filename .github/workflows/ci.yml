name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core build: Vocabulary, node Conclusions, and generated Challenges.
  #
  # This must stay fast. Comparator is deliberately NOT run here — verifying every solution on
  # every pull request would take hours and defeat the purpose of separating the layers. Solution
  # verification is a separate, dispatchable workflow. See docs/ARCHITECTURE.md.
  build:
    name: Build Vocabulary and Nodes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Runs here rather than in the `network` job because it needs a built Lean environment.
      - name: Check statement fingerprints
        run: |
          lake build ieantn_hash
          python3 scripts/ieantn.py fingerprint --check
      # Informational: shows which receipts are green, stale, or broken.
      - name: Receipt status
        run: python3 scripts/ieantn.py status

  network:
    name: Check the node network
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Cheap automated review of the tooling itself. Most of this code is written by agents
      # and read closely by nobody, which is exactly where a type checker earns its keep.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Installs ruamel too: it is optional at runtime but the type checker should still see
      # the code path that uses it, rather than being told to ignore the import.
      - run: pip install -r requirements-dev.txt
      - name: Type-check the tooling
        run: npx --yes pyright@1.1.413
      - name: Tooling unit tests
        run: python3 -m unittest discover -s tests
      - name: Import closure, graph well-formedness, generated challenges
        run: python3 scripts/ieantn.py check
      # Online: fetches each receipt's recorded run and checks it really is a successful run of
      # the verification workflow in this repository. The `receipts/` path ruleset that was meant
      # to enforce this is impossible here -- GitHub refuses push rules on public repositories and
      # on repositories not owned by an organisation -- so provenance is the enforcement.
      - name: Receipt provenance
        run: python3 scripts/ieantn.py check-receipts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what each conclusion rests on
        run: python3 scripts/ieantn.py report

  # Validates every node's formalization.yaml against Palomar's *current* contract, so that a
  # node stays spin-off-ready. The validator is fetched fresh on every run and never vendored:
  # its required-field list moves, and a cached copy would accept files the live contract now
  # rejects. Non-blocking until the metadata settles.
  palomar-metadata:
    name: Validate node metadata against Palomar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Fetch the current validator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pal/scripts /tmp/pal/taxonomies
          for f in scripts/submission_contract.py scripts/verification_errors.py \
                   taxonomies/arxiv-categories.json taxonomies/msc2020-codes.json; do
            gh api "repos/PalomarRegistry/PalomarSubmission/contents/$f" --jq '.content' \
              | base64 -d > "/tmp/pal/$f"
          done
          touch /tmp/pal/scripts/__init__.py
      - name: Validate each node
        run: python3 scripts/check_palomar_metadata.py /tmp/pal

  impact:
    name: Network impact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the base state is recovered with `git show`, not by checking it out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Fails only on the one class that must not be silent: editing a conclusion that other
      # nodes depend on, or removing one that is still imported. Everything else is reported to
      # the job summary for the reviewer and does not block.
      - name: What this branch degrades
        run: python3 scripts/ieantn.py diff --base "${{ github.event.pull_request.base.sha }}"
