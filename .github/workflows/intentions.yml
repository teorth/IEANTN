name: Intentions

# Lets a contributor claim an issue by commenting on it: the bot assigns them and moves the
# issue's card on the project board from `Unclaimed` to `Claimed`.
#
# The board is `IEANTN`, at https://github.com/users/teorth/projects/3.
#
# It has to be owned by this repository's owner, and that is not a preference. The action resolves
# the board by looking first at projects linked to the repository and then at projects owned by
# `github.repository_owner`; it takes no board-owner input. GitHub separately refuses to link a
# project to a repository under a different owner -- "Only projects owned by the same owner as the
# repository can be linked." So a board under another account is unreachable from here however the
# token is provisioned. This repository's issues previously sat on AlexKontorovich's `PNT+ Project`
# board for cross-project visibility; that is what those two rules together ruled out.
#
# Only `issue_comment` is listed. That gives the comment commands but NOT the automatic board
# lifecycle: issues reach the board by hand, and their status is set by hand until someone claims
# one. That is deliberate and should stay.
#
# Adding the `issues` trigger would set `auto-add`, and with no `auto-add-labels` filter the action
# adds EVERY issue opened here -- so on a public repository the board would be populated by whoever
# happens to open an issue. No privilege comes with that: a stranger cannot set `Status`, assign, or
# reach anything else. What it costs is the board's meaning. `Unclaimed` here is a maintainer's
# judgement that the work is real and scoped, and automatic membership would say nothing at all.
#
# If the manual `gh project item-add` ever becomes a burden, the middle ground is `issues: [opened,
# labeled]` with `auto-add-labels` set: only issues carrying that label join the board, `labeled`
# catches the ones that qualify after the fact, and labels on a public repository need triage or
# write access -- so curation stays with maintainers. Prefer that over an unfiltered auto-add.
#
# `default-ttl: none` disables claim expiry, so no `Claim Expires` field and no scheduled sweep are
# needed. A claim then persists until it is disclaimed.
#
# The credential: the automatic `GITHUB_TOKEN` cannot write Projects v2 -- that is the whole reason
# a secret is needed here, and the only reason. `PAT_TOKEN` is a classic PAT with `project` scope
# and nothing else; the reusable workflow assigns issues and edits pull requests with this
# repository's own `GITHUB_TOKEN`, which it takes separately. Note that the token carries an expiry
# and the bot fails quietly when it lapses, so a `claim` that draws no response is worth checking
# against `gh secret list` before anything else.

on:
  issue_comment:
    types: [created]

jobs:
  intentions:
    permissions:
      issues: write
      pull-requests: write
    uses: leanprover-community/intentions/.github/workflows/intentions.yml@v1
    with:
      project-title: "IEANTN"
      default-ttl: "none"
    secrets:
      project-token: ${{ secrets.PAT_TOKEN }}
